<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetría Galactic Racer</title>
<style>
/* Dark side: obsidian black with a red tint, your lap in saber red (with a glow), the reference
   in cold steel, the best times in purple. Corners cut at an angle, like the imperial panels.
   No external resources: everything works without internet. */
:root {
  --background: #080505; --panel: #110b0b; --panel-raised: #1a1010; --line: #2d1a1a; --line-strong: #5a1a1c;
  --text: #f2e7e5; --text-muted: #a3908d; --text-dim: #6c5754;
  --accent: #ff2b2b; --reference: #c4d0dc; --best: #b382ff; --gain: #4fd18b; --loss: #ff8a3d; --warning: #f2c14e;
  --map-background: #060303; --map-track: #2a1515; --map-text: #c9b2ae;
  --glow: 0 0 6px rgba(255, 43, 43, .75), 0 0 18px rgba(255, 43, 43, .35);
  --corner-cut: 10px;
  --font-display: "Bahnschrift", "DIN Alternate", "Arial Narrow", "Segoe UI", sans-serif;
  --font-body: "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-data: "Cascadia Mono", Consolas, "SF Mono", ui-monospace, monospace;
  --aurebesh-font: ;
  --accent-deep: #aa000a; --accent-light: #ff6a5a; --surface: #140c0c; --surface-low: #0c0707; --surface-hover: #1f1111; --input-background: #0a0606;
  --selected-high: #7a1216; --selected-low: #4a0b0e; --line-hover: #8a1c20; --hologram: #ff3b3b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
::selection { background: color-mix(in srgb, var(--accent) 35%, transparent); color: #fff; }
html { background: var(--background); }
body { margin: 0; color: var(--text); font-family: var(--aurebesh-font) var(--font-body); font-size: 14px; line-height: 1.45;
  background:
    radial-gradient(1200px 520px at 50% -180px, color-mix(in srgb, var(--accent-deep) 22%, transparent), transparent 70%),
    radial-gradient(700px 400px at 100% 100%, color-mix(in srgb, var(--accent-deep) 10%, transparent), transparent 70%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.012) 0 1px, transparent 1px 3px),
    var(--background);
  background-attachment: fixed; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--background); }
::-webkit-scrollbar-thumb { background: var(--line-strong); border: 2px solid var(--background); }
::-webkit-scrollbar-thumb:hover { background: var(--line-hover); }
button, input { font: inherit; color: inherit; }
.app { display: grid; grid-template-rows: auto auto 1fr; min-height: 100vh; }
.topbar { display: flex; align-items: center; gap: 14px; padding: 15px 24px; background: linear-gradient(180deg, var(--surface), var(--surface-low));
  position: sticky; top: 0; z-index: 5; }
.topbar::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent) 18%, var(--accent-light) 50%, var(--accent) 82%, transparent);
  box-shadow: var(--glow); }
.brand { display: inline-flex; align-items: center; gap: 12px; font-family: var(--aurebesh-font) var(--font-display); font-weight: 700; font-size: 1.02rem;
  letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; }
.brand small { font-weight: 400; letter-spacing: 0.18em; color: var(--text-muted); font-size: 0.78rem; }
.saber { display: inline-flex; align-items: center; width: 58px; height: 10px; }
.saber .hilt { width: 16px; height: 8px; border-radius: 1px; background: linear-gradient(180deg, #5b5b60, #2a2a2e 55%, #4a4a50);
  box-shadow: inset 3px 0 0 #1a1a1c, inset -3px 0 0 #1a1a1c; }
.saber .blade { flex: 1; height: 3px; margin-left: 1px; border-radius: 0 3px 3px 0; background: #ffe9e6;
  box-shadow: 0 0 3px 1px var(--accent), 0 0 10px 2px color-mix(in srgb, var(--accent) 60%, transparent); animation: hum 3.2s ease-in-out infinite; }
@keyframes hum { 0%, 100% { opacity: 1; } 50% { opacity: .82; } }
.breadcrumbs { display: flex; gap: 8px; align-items: center; color: var(--text-muted); min-width: 0; font-family: var(--aurebesh-font) var(--font-display); letter-spacing: 0.06em; }
.breadcrumbs a { color: var(--text-muted); cursor: pointer; text-decoration: none; white-space: nowrap; }
.live, .live > span { white-space: nowrap; }
.breadcrumbs { flex: 0 1 auto; overflow: hidden; }
.app > * { min-width: 0; }
.breadcrumbs b { min-width: 0; }
.top-button, .live { flex: none; }
.breadcrumbs a:hover { color: var(--accent); text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 50%, transparent); }
.breadcrumbs b { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.live { display: inline-flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 0.8rem; font-family: var(--aurebesh-font) var(--font-display);
  letter-spacing: 0.12em; text-transform: uppercase; }
.live i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: var(--glow); animation: pulse 2.4s ease-in-out infinite; }
.live.off i { background: var(--text-dim); box-shadow: none; animation: none; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
.button { font-family: var(--aurebesh-font) var(--font-display); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; font-size: 0.82rem;
  background: linear-gradient(180deg, var(--surface), var(--surface)); border: 1px solid var(--line-strong); border-radius: 0; padding: 7px 14px; cursor: pointer;
  clip-path: polygon(7px 0, 100% 0, 100% calc(100% - 7px), calc(100% - 7px) 100%, 0 100%, 0 7px); transition: border-color .15s, color .15s, box-shadow .15s; }
.button:hover { border-color: var(--accent); color: #fff; box-shadow: inset 0 0 14px color-mix(in srgb, var(--accent) 28%, transparent); }
.button.small { padding: 3px 10px; font-size: 0.72rem; }
/* Drop-down lists: flat, with the theme colours and an arrow drawn with two gradients (it follows the text colour) */
select { appearance: none; -webkit-appearance: none; font: inherit; color: var(--text); background-color: var(--input-background); border: 1px solid var(--line-strong); border-radius: 0;
  padding: 4px 28px 4px 9px; max-width: 100%; text-overflow: ellipsis; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  transition: border-color .15s, box-shadow .15s; }
select:hover:not(:disabled) { border-color: var(--accent); box-shadow: inset 0 0 12px color-mix(in srgb, var(--accent) 22%, transparent); }
select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
select:disabled { opacity: .5; cursor: not-allowed; }
select option, select optgroup { background: var(--surface); color: var(--text); }
select option:checked { background: var(--selected-low); color: #fff; }
button:focus-visible, input:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
main { padding: 22px; display: grid; gap: 18px; align-content: start; max-width: 1500px; width: 100%; margin: 0 auto; }
h1, h2 { font-family: var(--aurebesh-font) var(--font-display); margin: 0; }
h1 { font-size: 1.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 22%, transparent); }
h2 { font-size: 0.76rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.2em; color: var(--text-muted); display: inline-flex; align-items: center; gap: 8px; }
h2::before { content: ""; width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); box-shadow: var(--glow); }
.numeric { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--text-muted); }
/* Top bar: the brand takes you home; the buttons carry an icon and a label */
.home-link { cursor: pointer; text-decoration: none; color: inherit; font-size: 1.22rem; gap: 14px; padding: 4px 8px 4px 0; transition: color .15s, text-shadow .15s; }
.home-link:hover { color: #fff; text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 55%, transparent); }
.home-link small { font-size: 0.82rem; }
.home-link .saber { width: 74px; height: 12px; }
.home-link .saber .hilt { width: 20px; height: 10px; }
.home-link .saber .blade { height: 4px; }
.top-button { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 0.8rem; }
.top-button svg { width: 19px; height: 19px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.top-button .pilot-dot { width: 11px; height: 11px; margin-right: 0; }
.top-button b { color: var(--accent); }
.mode-button span { opacity: .55; }
.mode-button span.chosen { opacity: 1; color: var(--accent); font-weight: 700; }
.options-button { padding: 8px 11px; }
.options-button svg { width: 21px; height: 21px; }
.top-button.language-button { padding: 8px 14px; }
/* In narrower windows the bar keeps every button: first the decorations go, then the labels (the icons stay) */
@media (max-width: 1600px) { .topbar .brand .aurebesh { display: none; } .topbar { gap: 10px; } }
@media (max-width: 1500px) { .home-link small { display: none; } .topbar .live > span { display: none; } }
/* Barra de arriba sin apreturas: sin ruta (el evento ya sale en su cabecera y el botón Arcade vuelve al inicio),
   el logo solo con "Telemetría" y el indicador de lectura solo con su punto (el texto, en el título al pasar el ratón) */
.topbar .breadcrumbs, .topbar .brand small, .topbar .brand .aurebesh, .topbar .live > span { display: none; }
/* El idioma se cambia en Opciones (Apariencia de la app); los botones de la barra, más compactos */
.topbar .language-button { display: none; }
.topbar .top-button { padding: 6px 11px; font-size: 0.74rem; gap: 6px; }
.topbar .top-button svg { width: 17px; height: 17px; }
@media (max-width: 1300px) { .top-button .top-label { display: none; } }
/* Simple mode: the parts of the full analysis are hidden */
html.mode-simple .tryhard-only { display: none !important; }
html:not(.mode-simple) .simple-only { display: none !important; }
html.mode-simple .event-figures { grid-template-columns: repeat(2, 1fr); }
html.mode-simple .event-figures .figure:nth-child(3) { display: none; }
/* Vehicle icons next to every event, and the planet illustration on top of each card */
.vehicle-icon { width: 1.7em; height: 1.7em; vertical-align: -0.55em; margin-right: 0.35em; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.event-art { position: relative; margin: -16px -16px 0; height: 96px; overflow: hidden; border-bottom: 1px solid var(--line); }
.event-art svg.planet-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.event-art .vehicle-icon { position: absolute; right: 10px; bottom: 8px; width: 34px; height: 34px; margin: 0; padding: 5px; color: #fff; background: rgba(0, 0, 0, .45); border-radius: 50%; stroke-width: 1.5; }
.event-card:hover .event-art svg.planet-art { transform: scale(1.04); }
.event-art svg.planet-art { transition: transform .35s ease; }
/* Panels with cut corners: the border is drawn with a gradient under a mask */
.panel, .event-card, .tile { position: relative; background: linear-gradient(180deg, var(--surface), var(--panel)); border: 1px solid var(--line); border-radius: 0;
  clip-path: polygon(var(--corner-cut) 0, 100% 0, 100% calc(100% - var(--corner-cut)), calc(100% - var(--corner-cut)) 100%, 0 100%, 0 var(--corner-cut)); }
.panel::before, .event-card::before, .tile::before { content: ""; position: absolute; top: 0; left: var(--corner-cut); width: 46px; height: 2px;
  background: var(--accent); box-shadow: var(--glow); opacity: .85; }
.panel { padding: 14px 16px; display: grid; gap: 10px; min-width: 0; }
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
/* Folding a panel: only its header stays */
.panel.folded > :not(.panel-header) { display: none !important; }
.fold-button { margin-left: auto; order: 99; background: none; border: 1px solid var(--line-strong); color: var(--text-muted); font-size: 0.9rem; line-height: 1; padding: 3px 7px; cursor: pointer; }
.fold-button:hover { color: var(--text); border-color: var(--accent); }
main > .panel-header { padding: 4px 2px; }
.table-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; }
th, td { padding: 6px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
th { font-family: var(--aurebesh-font) var(--font-display); font-weight: 600; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); border-bottom-color: var(--line-strong); }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
td.text { font-family: var(--aurebesh-font) var(--font-body); }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-hover); }
.best { color: var(--best); font-weight: 600; text-shadow: 0 0 10px rgba(179, 130, 255, .35); }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
.tag { font-family: var(--aurebesh-font) var(--font-display); font-size: 0.66rem; letter-spacing: 0.12em; text-transform: uppercase; border-radius: 0; padding: 1px 6px; border: 1px solid var(--line); color: var(--text-muted); margin-left: 6px; }
.tag.success { color: var(--gain); border-color: color-mix(in srgb, var(--gain) 45%, transparent); }
.tag.failure { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 45%, transparent); }
.tag.highlight { color: var(--best); border-color: color-mix(in srgb, var(--best) 45%, transparent); }
.empty-state { padding: 30px; text-align: center; color: var(--text-muted); display: grid; gap: 8px; justify-items: center; }
.empty-state b { color: var(--text); font-family: var(--aurebesh-font) var(--font-display); font-size: 1.1rem; letter-spacing: 0.1em; text-transform: uppercase; }

/* Home */
.event-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px; }
.event-card { padding: 16px; display: grid; gap: 12px; cursor: pointer; text-align: left; transition: border-color .15s, box-shadow .15s, transform .15s; }
.event-card:hover { border-color: var(--line-strong); box-shadow: inset 0 0 40px color-mix(in srgb, var(--accent) 8%, transparent); transform: translateY(-1px); }
.event-card:hover::before { width: 90px; opacity: 1; }
.event-card::before { transition: width .2s; }
/* Planet name: SF Distant Galaxy if it is installed or in the fonts\ folder (it is not built into the app) */
@font-face { font-family: "SWGR Planet"; src: local("SF Distant Galaxy"), local("SFDistantGalaxy"), url("/fonts/SF%20Distant%20Galaxy.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "SWGR Planet Outline"; src: local("SF Distant Galaxy Outline"), local("SFDistantGalaxyOutline"), url("/fonts/SF%20Distant%20Galaxy%20Outline.ttf") format("truetype"); font-display: swap; }
:root { --font-planet: "SWGR Planet", var(--font-display); }
/* Decorative Aurebesh (SF Distant Galaxy Symbols, letters a-z). Without the font nothing is shown */
@font-face { font-family: "SWGR Aurebesh"; src: local("SF Distant Galaxy Symbols"), local("SFDistantGalaxySymbols"), url("/fonts/SF%20Distant%20Galaxy%20Symbols.ttf") format("truetype"); font-display: block; }
.aurebesh { font-family: "SWGR Aurebesh", "Adobe Blank"; font-weight: 400; text-transform: none; letter-spacing: 0.12em; color: var(--text-dim); font-size: 0.72em; white-space: nowrap; }
html.no-aurebesh .aurebesh, html:not(.has-aurebesh) .aurebesh, html.language-aurebesh .aurebesh { display: none; }   /* no-aurebesh: set by the Taller */
/* Aurebesh language: the font only covers the letters a-z, so digits, signs and times stay in the normal font */
@font-face { font-family: "SWGR Aurebesh Interface"; src: local("SF Distant Galaxy Symbols"), local("SFDistantGalaxySymbols"), url("/fonts/SF%20Distant%20Galaxy%20Symbols.ttf") format("truetype"); unicode-range: U+0061-007A; font-display: block; }
html.language-aurebesh { --aurebesh-font: "SWGR Aurebesh Interface", ; }
html.language-aurebesh body, html.language-aurebesh body * { text-transform: lowercase !important; }
html.language-aurebesh .planet { font-family: var(--font-planet) !important; text-transform: uppercase !important; }
html.language-aurebesh .brand small { display: none; }
/* In narrow windows the live indicator text is cut instead of overflowing the bar */
.topbar .live { flex: 0 1 auto; min-width: 0; }
.live > span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
html.language-aurebesh .breadcrumbs, html.language-aurebesh .brand { letter-spacing: 0.02em; white-space: nowrap; }
.language-button { display: inline-flex; font-family: "Segoe UI", system-ui, sans-serif !important; text-transform: uppercase !important; letter-spacing: 0.1em; }
html:not(.has-aurebesh) .language-button, html:not(.has-aurebesh) .options-page .aurebesh-option { opacity: .55; }
.options-page .group > span.aurebesh-missing, .aurebesh-missing { display: none; font-size: 0.74rem; line-height: 1.4; color: var(--text-muted); text-transform: none; letter-spacing: 0; }
html:not(.has-aurebesh) .options-page .group > span.aurebesh-missing { display: block; }
.options-page .group > span.aurebesh-missing.highlighted { color: var(--warning); }
.language-button b { color: var(--accent); font-weight: 700; }
.brand .aurebesh { font-size: 0.7rem; margin-left: 4px; }
.planet + .aurebesh { display: block; margin: 1px 0 4px; font-size: 0.7rem; }
.event-header .planet + .aurebesh { font-size: 0.85rem; }
h2 .aurebesh { margin-left: 10px; font-size: 0.72rem; letter-spacing: 0.1em; }
.planet { font-family: var(--font-planet); font-weight: 400; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); line-height: 1.05; }
.event-card .planet { font-size: 1.5rem; }
.event-header .planet { font-size: 1.15rem; }
.event-header .aurebesh { display: none; }
td .planet { font-size: 0.95rem; margin-right: 8px; }
.event-name { font-family: var(--aurebesh-font) var(--font-display); font-weight: 700; font-size: 1.12rem; letter-spacing: 0.05em; text-transform: uppercase; }
.loss-lead { margin: 0; font-size: 0.92rem; }
.loss-sector { font-family: var(--aurebesh-font) var(--font-display); font-weight: 700; letter-spacing: 0.08em; }
.loss-table td, .loss-table th { padding: 4px 9px; }
.loss-table td.loss { text-align: right; }
.loss-start { margin: 4px 0 0; color: var(--text-muted); font-size: 0.9rem; }
.loss-start b { color: var(--text); }
.loss-start .tag { margin: 0 6px 0 0; }
.loss-lead b { color: var(--text); }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filters button { font-family: var(--aurebesh-font) var(--font-display); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.76rem;
  background: var(--panel); border: 1px solid var(--line); color: var(--text-muted); padding: 5px 12px; cursor: pointer; }
.filter-group { display: inline-flex; gap: 0; border: 1px solid var(--line); }
.filter-group button { border: 0 !important; border-left: 1px solid var(--line) !important; }
.filter-group button:first-child { border-left: 0 !important; }
.filter-group.active { border-color: var(--line-strong); }
.filter-group .filter-group-all { color: var(--text); }
html .filter-group { border-radius: 999px; overflow: hidden; }
html .filter-group button { border-radius: 0 !important; }
.filters button:hover { color: #fff; border-color: var(--line-strong); }
.filters button[aria-pressed="true"] { background: linear-gradient(180deg, var(--selected-high), var(--selected-low)); color: #fff; border-color: var(--accent); }
.planet-group { display: grid; gap: 12px; }
.planet-group-header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.planet-group-header .planet { font-size: 2rem; }
.planet-group-header .aurebesh { display: inline; font-size: 0.8rem; }
.planet-group-none { font-family: var(--aurebesh-font) var(--font-display); font-weight: 700; font-size: 1.3rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
.event-vehicle { font-family: var(--aurebesh-font) var(--font-display); font-size: 0.7rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
.planet-group-others { display: grid; gap: 6px; }
.planet-group-others .label { font-family: var(--aurebesh-font) var(--font-display); font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.compact-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(400px, 1fr)); gap: 2px 24px; }
.compact-row { display: grid; grid-template-columns: minmax(0, 1fr) 5.5rem 6rem; gap: 12px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.compact-title { display: grid; min-width: 0; }
.compact-title, .compact-title > * { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.compact-title .event-vehicle { margin: 0; font-size: 0.62rem; }
.compact-row .numeric { text-align: right; }
.compact-attempts { text-align: right; font-size: 0.82rem; white-space: nowrap; }
/* Resumen del evento: una franja compacta con tu récord, el objetivo y las medias */
.summary-strip { position: relative; display: flex; flex-wrap: wrap; align-items: stretch; gap: 4px 28px; padding: 8px 16px;
  background: linear-gradient(100deg, color-mix(in srgb, var(--accent) 10%, var(--panel)), var(--panel) 55%); border: 1px solid var(--line);
  clip-path: polygon(var(--corner-cut) 0, 100% 0, 100% calc(100% - var(--corner-cut)), calc(100% - var(--corner-cut)) 100%, 0 100%, 0 var(--corner-cut)); }
.summary-strip::before { content: ""; position: absolute; top: 0; left: var(--corner-cut); width: 120px; height: 2px; background: var(--accent); box-shadow: var(--glow); }
.strip-item { display: grid; gap: 0; align-content: center; min-width: 0; }
.strip-item .label { font-family: var(--aurebesh-font) var(--font-display); font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); white-space: nowrap; }
.strip-item .detail { color: var(--text-muted); font-size: 0.72rem; white-space: nowrap; }
.strip-value { font-size: 1.3rem; line-height: 1.2; color: var(--text); }
.strip-record .strip-value { font-size: 2rem; line-height: 1.05; color: #fff; text-shadow: 0 0 22px color-mix(in srgb, var(--accent) 45%, transparent); letter-spacing: -0.01em; }
.strip-game { display: flex; flex-wrap: wrap; align-items: center; gap: 3px 6px; max-width: 460px; }
.strip-game .label { flex-basis: 100%; }
.strip-game input { width: 82px; background: var(--input-background); border: 1px solid var(--line-strong); border-radius: 0; padding: 2px 6px; font-family: var(--font-data); font-size: 0.8rem; }
.strip-game input:focus { border-color: var(--accent); outline: none; }
.strip-game .detail { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
.pill { justify-self: start; font-family: var(--aurebesh-font) var(--font-display); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 0 8px; border: 1px solid; }
.pill.success { color: var(--gain); border-color: color-mix(in srgb, var(--gain) 50%, transparent); background: color-mix(in srgb, var(--gain) 10%, transparent); }
.pill.failure { color: var(--loss); border-color: color-mix(in srgb, var(--loss) 50%, transparent); background: color-mix(in srgb, var(--loss) 10%, transparent); }
/* Tables */
tr.faded-row td { opacity: 0.55; }
tr.group-row td { background: var(--surface); cursor: pointer; font-size: 0.9rem; border-bottom-color: var(--line-strong); }
tr.group-row:hover td { background: var(--surface-hover); }
tr.group-row .chevron { display: inline-block; width: 1.1em; color: var(--accent); transition: transform .15s; }
tr.group-row.open .chevron { transform: rotate(90deg); }
tr.lap-row td:first-child { padding-left: 26px; }
/* Subtle animations: only when the app opens or the screen changes */
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes ignite { 0% { transform: scaleX(0); opacity: .3; } 55% { transform: scaleX(1.04); opacity: 1; } 70% { transform: scaleX(.98); } 100% { transform: scaleX(1); opacity: 1; } }
@keyframes flare { 0% { box-shadow: 0 0 2px 0 var(--accent); } 45% { box-shadow: 0 0 10px 4px var(--accent), 0 0 34px 10px color-mix(in srgb, var(--accent) 75%, transparent); } 100% { box-shadow: 0 0 3px 1px var(--accent), 0 0 10px 2px color-mix(in srgb, var(--accent) 60%, transparent); } }
@keyframes planetIn { from { opacity: 0; letter-spacing: 0.3em; filter: blur(6px); } to { opacity: 1; letter-spacing: 0.06em; filter: none; } }
@keyframes countUp { from { opacity: 0; transform: translateY(10px) scale(.97); } to { opacity: 1; transform: none; } }
@keyframes sweep { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.saber .blade { transform-origin: left center; transform: scaleX(0); }
html.booted .saber .blade { transform: none; animation: ignite .9s cubic-bezier(.2,.8,.2,1) both, flare 1.1s ease-out both, hum 3.2s ease-in-out 1.2s infinite; }
html.no-animations .saber .blade { transform: none; }
main.entering .event-header .planet, main.entering .planet-group-header .planet { animation: planetIn .7s cubic-bezier(.2,.8,.2,1) both; }
main.entering .strip-record .strip-value { animation: countUp .55s cubic-bezier(.2,.8,.2,1) .1s both; }
.topbar::after { transform-origin: left center; transform: scaleX(0); }
html.booted .topbar::after { transform: none; animation: sweep .8s cubic-bezier(.2,.8,.2,1) .25s both; }
html.no-animations .topbar::after { transform: none; }
main.entering > * { animation: rise .38s cubic-bezier(.2,.8,.2,1) both; }
main.entering > *:nth-child(2) { animation-delay: .04s; } main.entering > *:nth-child(3) { animation-delay: .08s; }
main.entering > *:nth-child(4) { animation-delay: .12s; } main.entering > *:nth-child(5) { animation-delay: .16s; }
main.entering > *:nth-child(n+6) { animation-delay: .2s; }
main.entering .event-grid > .event-card { animation: rise .38s cubic-bezier(.2,.8,.2,1) both; }
main.entering .event-grid > .event-card:nth-child(2) { animation-delay: .05s; } main.entering .event-grid > .event-card:nth-child(3) { animation-delay: .1s; }
main.entering .event-grid > .event-card:nth-child(n+4) { animation-delay: .15s; }
/* ---------- Galactic Racer theme: inspired by the game's menus (petrol blue, cream, coral and mustard) ---------- */
@font-face { font-family: "SWGR Display"; src: url("/app-fonts/display.woff2") format("woff2"); font-display: swap; }
@font-face { font-family: "SWGR Text"; src: url("/app-fonts/text-400.woff2") format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "SWGR Text"; src: url("/app-fonts/text-600.woff2") format("woff2"); font-weight: 600; font-display: swap; }
@font-face { font-family: "SWGR Text"; src: url("/app-fonts/text-700.woff2") format("woff2"); font-weight: 700; font-display: swap; }
html[data-theme="galactic"] {
  --background: #0f2228; --panel: #173139; --panel-raised: #1d3b44; --line: #2a4b55; --line-strong: #3e6874;
  --text: #f1e8d6; --text-muted: #a8b9b5; --text-dim: #6c8789;
  --accent: #ef6b3c; --accent-light: #f39a63; --accent-deep: #c24a1f; --reference: #8fd6d2; --best: #c7a4ff; --gain: #8fd88a; --loss: #ff9a5c; --warning: #f2c14e;
  --map-background: #0c1d22; --map-track: #23434c; --map-text: #bfd0cc;
  --surface: #1a363f; --surface-low: #132a31; --surface-hover: #22434d; --input-background: #0e2026; --selected-high: #a8481f; --selected-low: #6d2c12; --line-hover: #5f8f99; --hologram: #7fe3ff;
  --glow: 0 0 6px color-mix(in srgb, var(--accent) 60%, transparent), 0 0 16px color-mix(in srgb, var(--accent) 25%, transparent);
  --font-display: "SWGR Display", "Archivo Black", "Arial Black", sans-serif;
  --font-body: "SWGR Text", "Barlow Semi Condensed", "Segoe UI", sans-serif;
  --corner-cut: 0px;
}
html[data-theme="galactic"] body { background: radial-gradient(1100px 520px at 70% -160px, rgba(143, 214, 210, .10), transparent 70%),
  radial-gradient(900px 500px at 0% 110%, rgba(239, 107, 60, .08), transparent 70%), var(--background); }
html[data-theme="galactic"] .topbar { background: linear-gradient(180deg, #17333b, #10262d); }
html[data-theme="galactic"] .brand { letter-spacing: 0.08em; font-weight: 400; }
html[data-theme="galactic"] h1 { font-weight: 400; letter-spacing: 0.02em; text-shadow: none; }
html[data-theme="galactic"] h1::before { content: "/"; color: var(--accent); margin-right: 0.08em; }
html[data-theme="galactic"] .event-name, html[data-theme="galactic"] .planet-group-none { font-weight: 400; letter-spacing: 0.03em; }
html[data-theme="galactic"] h2 { color: var(--warning); font-family: var(--aurebesh-font) var(--font-display); font-weight: 400; letter-spacing: 0.06em; font-size: 0.82rem;
  display: inline-grid; grid-auto-flow: row; justify-items: start; gap: 0; padding-bottom: 3px; border-bottom: 2px solid var(--warning); }
html[data-theme="galactic"] h2::before { display: none; }
html[data-theme="galactic"] h2 .aurebesh { order: -1; margin: 0 0 1px; font-size: 0.62rem; color: var(--text-muted); }
/* Formas de Galactic Racer para todos los temas (esquinas redondeadas, franja de rayas, botones en píldora);
   los colores y la tipografía siguen siendo de cada tema */
html .panel, html .event-card, html .tile, html .summary-strip { border-radius: 10px; clip-path: none; }
html .panel::before, html .event-card::before, html .tile::before, html .summary-strip::before {
  left: 14px; top: 0; width: 54px; height: 5px; box-shadow: none; opacity: 1;
  background: repeating-linear-gradient(-45deg, var(--accent) 0 5px, transparent 5px 9px); }
html .button, html .filters button, html .segmented { border-radius: 999px; clip-path: none; }
html .segmented { overflow: hidden; }
html[data-theme="galactic"] .filters button[aria-pressed="true"], html[data-theme="galactic"] .segmented button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: none; }
html[data-theme="galactic"] .planet { color: var(--accent); }
html[data-theme="galactic"] .strip-record .strip-value { text-shadow: none; color: var(--text); }
html[data-theme="galactic"] .summary-strip { background: linear-gradient(100deg, color-mix(in srgb, var(--reference) 10%, var(--panel)), var(--panel) 60%); }
html .pill { border-radius: 999px; }
html .tag { border-radius: 4px; }
html[data-theme="galactic"] .live i { background: var(--reference); box-shadow: 0 0 8px var(--reference); }
html[data-theme="galactic"] .saber .blade { background: #fff6e8; box-shadow: 0 0 3px 1px var(--accent), 0 0 10px 2px color-mix(in srgb, var(--accent) 60%, transparent); }
html[data-theme="galactic"] .loader-blade { box-shadow: 0 0 4px 1px var(--accent), 0 0 18px 4px color-mix(in srgb, var(--accent) 70%, transparent); }
html[data-theme="galactic"] .loader { background: radial-gradient(800px 420px at 50% 40%, rgba(143, 214, 210, .12), transparent 70%), var(--background); }
html[data-theme="galactic"] tr.group-row td { background: var(--surface-low); }
/* The heavy font only in titles; small labels use the bold text font */
html[data-theme="galactic"] :is(.figure .label, .tile .label, .strip-item .label, th, .event-vehicle, .planet-group-others .label, .live, .breadcrumbs, .tag, .pill, .loss-sector, .loader-step, .brand small) {
  font-family: var(--aurebesh-font) var(--font-body); font-weight: 700; letter-spacing: 0.1em; }
html[data-theme="galactic"] :is(.figure .label, .tile .label, .strip-item .label, th) { font-size: 0.72rem; }

/* ---------- Jedi theme: navy blue and a blue saber ---------- */
html[data-theme="jedi"] {
  --background: #060a12; --panel: #0b1220; --panel-raised: #111b2e; --line: #1a2742; --line-strong: #23406e;
  --text: #e6eefb; --text-muted: #8fa1bd; --text-dim: #56688a;
  --accent: #3d8bff; --accent-light: #7fb3ff; --accent-deep: #0a3aa0; --reference: #f0d38a; --best: #c09bff; --gain: #4fd18b; --loss: #ff8a3d; --warning: #f2c14e;
  --map-background: #04070d; --map-track: #16223a; --map-text: #aebbd0;
  --surface: #0d1626; --surface-low: #080e19; --surface-hover: #142238; --input-background: #050a13; --selected-high: #1c4aa3; --selected-low: #102c60; --line-hover: #2d5aa8; --hologram: #6fb5ff;
}
/* ---------- Imperial theme: charcoal grey and steel ---------- */
html[data-theme="imperial"] {
  --background: #0b0c0e; --panel: #141619; --panel-raised: #1b1e22; --line: #2a2e34; --line-strong: #4a5059;
  --text: #eef0f2; --text-muted: #9aa1aa; --text-dim: #636a73;
  --accent: #dfe5ec; --accent-light: #ffffff; --accent-deep: #5a6470; --reference: #ff5a4a; --best: #b382ff; --gain: #4fd18b; --loss: #ff8a3d; --warning: #f2c14e;
  --map-background: #08090b; --map-track: #23272c; --map-text: #b9c0c8;
  --surface: #16181c; --surface-low: #101215; --surface-hover: #20242a; --input-background: #08090b; --selected-high: #4a515b; --selected-low: #2b3037; --line-hover: #6a717b; --hologram: #cfe3ff;
  --glow: 0 0 6px rgba(223, 229, 236, .45), 0 0 16px rgba(223, 229, 236, .18);
}
html[data-theme="imperial"] .planet { color: var(--text); }
html[data-theme="imperial"] .filters button[aria-pressed="true"], html[data-theme="imperial"] .segmented button[aria-pressed="true"], html[data-theme="imperial"] .options-page .options button[aria-pressed="true"] { color: #fff; }
/* ---------- Hologram effect: scan lines and a band of light moving down ---------- */
html.hologram body::after { content: ""; position: fixed; inset: 0; z-index: 95; pointer-events: none;
  background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--hologram) 7%, transparent) 0 1px, transparent 1px 3px); mix-blend-mode: screen; }
.hologram-band { display: none; }
html.hologram .hologram-band { display: block; position: fixed; left: 0; right: 0; top: -30vh; height: 30vh; z-index: 96; pointer-events: none;
  background: linear-gradient(180deg, transparent, color-mix(in srgb, var(--hologram) 6%, transparent) 70%, color-mix(in srgb, var(--hologram) 12%, transparent) 96%, transparent);
  animation: hologramBand 7s linear infinite; }
@keyframes hologramBand { from { transform: translateY(0); } to { transform: translateY(160vh); } }
html.hologram h1, html.hologram .strip-value, html.hologram .planet, html.hologram .event-name {
  text-shadow: 1px 0 color-mix(in srgb, #ff2bd0 40%, transparent), -1px 0 color-mix(in srgb, #2be3ff 40%, transparent), 0 0 16px color-mix(in srgb, var(--hologram) 30%, transparent); }
html.hologram .panel, html.hologram .event-card, html.hologram .tile, html.hologram .summary-strip { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hologram) 12%, transparent), 0 0 24px color-mix(in srgb, var(--hologram) 6%, transparent); }
/* Hologram without flicker: only the sweep of light when it powers on (when the app opens or the effect is turned on) */
@keyframes powerOn { 0% { transform: scaleY(.003); opacity: 1; } 30% { transform: scaleY(.003); opacity: 1; } 62% { transform: scaleY(1); opacity: .55; } 100% { transform: scaleY(1); opacity: 0; } }
html.hologram.powering-on body::before { content: ""; position: fixed; inset: 0; z-index: 97; pointer-events: none; transform-origin: 50% 50%;
  background: linear-gradient(180deg, transparent 0, color-mix(in srgb, var(--hologram) 30%, transparent) 46%, color-mix(in srgb, var(--hologram) 25%, #fff) 50%, color-mix(in srgb, var(--hologram) 30%, transparent) 54%, transparent 100%);
  animation: powerOn .6s cubic-bezier(.3,.7,.2,1) both; }
html.no-animations .hologram-band { display: none; }

/* ---------- Página de Opciones ---------- */
.options-page { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 18px; align-items: start; }
.options-page > .panel-header { grid-column: 1 / -1; }
.options-nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 84px; }
.options-nav button { text-align: left; padding: 10px 14px; border: 1px solid var(--line); background: var(--surface); color: var(--text-muted); font: inherit; cursor: pointer; }
.options-nav button:hover { color: var(--text); }
.options-nav button[aria-pressed="true"] { color: var(--text); border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.options-content { min-width: 0; }
.options-content > section[hidden] { display: none !important; }   /* los paneles tienen su propio display y si no se seguían viendo */
.options-page .options-panel { margin: 0; }
@media (max-width: 900px) { .options-page { grid-template-columns: minmax(0, 1fr); } .options-nav { flex-direction: row; flex-wrap: wrap; position: static; } }
.options-description { margin: 0 0 12px; font-size: 0.85rem; }
.options-page .group { display: grid; gap: 5px; margin-bottom: 12px; }
.options-page .group > span { font-size: 0.68rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); }
.options-page .options { display: flex; gap: 5px; flex-wrap: wrap; }
.options-page .options button { flex: 1; background: var(--input-background); border: 1px solid var(--line); color: var(--text); padding: 5px 8px; cursor: pointer; font: 600 0.8rem "Segoe UI", system-ui, sans-serif; }
html .options-page .options button { border-radius: 999px; }
.options-page .options button[aria-pressed="true"] { background: var(--selected-low); border-color: var(--accent); color: #fff; }
.options-page .profile-split { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; align-items: start; }
.options-page .drop-zone-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
html.language-aurebesh .options-page .group, html.language-aurebesh .options-page .group * { text-transform: none !important; font-family: "Segoe UI", system-ui, sans-serif !important; }

/* Panel en carrera: a la izquierda la pantalla de muestra 16:9 (el panel se arrastra) y la colocación;
   a la derecha el resto, en dos columnas, para que quepa sin scroll */
.race-panel-editor { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.race-panel-left, .race-panel-right { display: grid; gap: 10px; align-content: start; min-width: 0; }
.options-page .options-content, .options-page .options-panel, .race-panel-right > * { min-width: 0; }
.race-panel-right { grid-template-columns: 1fr 1fr; column-gap: 18px; }
.race-panel-right > :nth-child(n+5) { grid-column: 1 / -1; }
.options-page .race-panel-editor .group { margin: 0; }
.options-page .race-panel-editor .options { flex-wrap: wrap; }
.options-page .race-panel-editor .options button { flex: 1 1 auto; padding-left: 10px; padding-right: 10px; }
.options-page .race-panel-left .note { margin: 0; }
@media (max-width: 1100px) { .race-panel-editor { grid-template-columns: 1fr; } }
.race-panel-screen { position: relative; width: 100%; aspect-ratio: 16 / 9; overflow: hidden; border: 1px solid var(--line-strong);
  background: linear-gradient(180deg, #5c7a8f 0%, #a9b8bf 45%, #6b5b4b 46%, #3b3129 100%); margin-bottom: 8px; }
.race-panel-stage { position: absolute; left: 0; top: 0; width: 3840px; height: 2160px; transform-origin: 0 0; }
.race-panel-preview { position: absolute; transform-origin: 0 0; cursor: grab; user-select: none; touch-action: none; font-family: "Segoe UI", system-ui, sans-serif; font-weight: 600; }
.race-panel-preview:active { cursor: grabbing; }
.race-panel-top { height: 2px; margin: 0 -10px 2px; }
.race-panel-row { display: grid; grid-template-columns: 36% 34% 30%; align-items: center; white-space: nowrap; }
.race-panel-row span:nth-child(2), .race-panel-row span:nth-child(3) { text-align: right; }
.race-panel-bars { display: flex; gap: 3px; height: 4px; margin: 3px 0 5px; }
.race-panel-bars i { flex: 1; }
.race-panel-colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 6px 12px; }
.race-panel-colors label { display: flex; align-items: center; gap: 8px; font-size: 0.86rem; }
.race-panel-colors input[type="color"] { width: 34px; height: 24px; padding: 0; border: 1px solid var(--line-strong); background: none; cursor: pointer; }
.options-page .race-panel-rows { flex-wrap: wrap; }
.options-page .group input[type="range"] { width: 100%; max-width: 260px; accent-color: var(--accent); }
/* Loading screen */
.loader { position: fixed; inset: 0; z-index: 100; display: grid; place-content: center; justify-items: center; gap: 18px;
  background: radial-gradient(800px 420px at 50% 40%, color-mix(in srgb, var(--accent-deep) 22%, transparent), transparent 70%), var(--background); transition: opacity .45s ease, visibility .45s; }
.loader.finished { opacity: 0; visibility: hidden; }
.loader-saber { display: flex; align-items: center; width: min(440px, 76vw); }
.loader-hilt { width: 54px; height: 16px; flex: none; border-radius: 2px; background: linear-gradient(180deg, #6a6a70, #2a2a2e 55%, #4a4a50);
  box-shadow: inset 8px 0 0 #1a1a1c, inset -10px 0 0 #1a1a1c, inset 22px 0 0 -18px #1a1a1c; }
.loader-track { flex: 1; height: 7px; margin-left: 2px; position: relative; }
.loader-blade { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 0 6px 6px 0; background: #fff1ee;
  box-shadow: 0 0 4px 1px var(--accent), 0 0 18px 4px color-mix(in srgb, var(--accent) 70%, transparent), 0 0 44px 10px color-mix(in srgb, var(--accent) 35%, transparent);
  transition: width .5s cubic-bezier(.2,.8,.2,1); }
.loader-title { font-family: var(--aurebesh-font) var(--font-display); font-weight: 700; font-size: 1.1rem; letter-spacing: 0.32em; text-transform: uppercase; color: var(--text); padding-left: .32em; }
.loader-step { font-family: var(--aurebesh-font) var(--font-body); font-size: 0.86rem; color: var(--text-muted); min-height: 1.3em; }
html.no-animations .loader { transition: none; }
/* While an event's telemetry loads the page is hidden and the red line at the top works as a progress bar */
main { transition: opacity .25s ease; }
main.pending { opacity: 0; pointer-events: none; }
@keyframes busy { 0% { transform: translateX(-100%) scaleX(.4); } 100% { transform: translateX(100%) scaleX(.4); } }
.topbar .busy { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; overflow: hidden; opacity: 0; transition: opacity .2s; }
.topbar .busy::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, #fff1ee, transparent); animation: busy .9s ease-in-out infinite; }
.topbar.loading .busy { opacity: 1; }
.page-loading { position: fixed; left: 0; right: 0; top: 40%; text-align: center; color: var(--text-muted); font-family: var(--aurebesh-font) var(--font-display); letter-spacing: 0.2em;
  text-transform: uppercase; font-size: 0.8rem; opacity: 0; transition: opacity .2s; pointer-events: none; }
.page-loading.visible { opacity: 1; }
.event-subtitle { color: var(--text-muted); font-size: 0.86rem; letter-spacing: 0.04em; white-space: nowrap; }
.event-subtitle::before { content: "· "; }
.event-figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.figure { display: grid; gap: 1px; min-width: 0; }
.figure .label { font-family: var(--aurebesh-font) var(--font-display); font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.figure .value { font-family: var(--font-data); font-size: 1.15rem; }
.figure .detail { font-family: var(--font-data); font-size: 0.78rem; color: var(--text-muted); }

/* Event */
.event-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 40px; }
.event-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.event-title h1 { font-size: 1.2rem; letter-spacing: 0.06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile { padding: 13px 15px; display: grid; gap: 3px; }
.tile .value { font-family: var(--font-data); font-size: 1.45rem; }
.tile .label { font-family: var(--aurebesh-font) var(--font-display); font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--text-muted); }
.tile .detail { font-size: 0.82rem; color: var(--text-muted); }
.tile input { width: 100%; background: var(--input-background); border: 1px solid var(--line-strong); border-radius: 0; padding: 4px 7px; font-family: var(--font-data); }
.tile input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 0 12px color-mix(in srgb, var(--accent) 30%, transparent); outline: none; }
.tile .row { display: flex; gap: 6px; align-items: center; }
.two-columns { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 1100px) { .two-columns { grid-template-columns: minmax(0, 1fr); } }
/* Página del evento: cabecera, franja de resumen y tres columnas (intentos, pestañas, mapa) que llenan la ventana */
.event-view { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 10px; min-height: 0; }
.event-body { display: grid; grid-template-columns: 300px minmax(0, 1fr) minmax(380px, 0.9fr); gap: 12px; min-height: 0; }
.event-left, .event-center, .analysis-map { min-height: 0; min-width: 0; }
.event-left { display: grid; grid-template-rows: minmax(120px, 1fr) auto; gap: 10px; overflow: hidden; }
.event-left .friends-simple { max-height: 40vh; overflow: auto; }
.attempts-panel { grid-template-rows: auto minmax(0, 1fr) auto; min-height: 0; overflow: hidden; }
.attempt-list { overflow: auto; min-height: 0; display: grid; gap: 3px; align-content: start; padding-right: 2px; }
.attempt { display: grid; grid-template-columns: auto 1fr auto; column-gap: 8px; row-gap: 1px; align-items: center; padding: 5px 8px; border: 1px solid var(--line);
  background: var(--surface-low); cursor: pointer; font-size: 0.82rem; }
.attempt:hover { background: var(--surface-hover); }
.attempt.focused { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); box-shadow: inset 3px 0 var(--accent); }
.attempt.faded-row { opacity: .55; cursor: default; }
.attempt-date { color: var(--text-muted); font-family: var(--font-data); }
.attempt-total { font-size: 0.95rem; text-align: right; }
.attempt-laps { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 0 9px; color: var(--text-muted); font-size: 0.74rem; }
.event-center { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 8px; overflow: hidden; }
.focus-info { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 0.84rem; min-height: 1.6em; }
.focus-info .tag { margin-left: 0; }
.tab-bar { display: flex; flex-wrap: wrap; gap: 4px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.tab-bar button { font-family: var(--aurebesh-font) var(--font-display); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; font-size: 0.72rem;
  background: var(--panel); border: 1px solid var(--line); color: var(--text-muted); padding: 4px 10px; cursor: pointer; }
.tab-bar button:hover { color: #fff; border-color: var(--line-strong); }
.tab-bar button[aria-pressed="true"] { background: linear-gradient(180deg, var(--selected-high), var(--selected-low)); color: #fff; border-color: var(--accent); }
html .tab-bar button { border-radius: 999px; }
.tab-panes { overflow: auto; min-height: 0; }
.tab-pane { display: none; gap: 8px; align-content: start; }
.tab-pane.active { display: grid; }
.friends-pane { display: grid; gap: 8px; }
.pane-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.analysis-map { overflow: auto; }
.analysis-map .map-panel { display: flex; flex-direction: column; gap: 8px; height: 100%; min-height: 0; }
.analysis-map .map-box { flex: 1 1 0; min-height: 180px; aspect-ratio: auto; }
/* Por debajo de 1250 px: los intentos arriba y, debajo, las pestañas y el mapa */
@media (max-width: 1250px) {
  html:not(.mode-simple) .event-body { grid-template-columns: minmax(0, 1fr) minmax(360px, 0.9fr); grid-template-rows: 170px minmax(0, 1fr); }
  html:not(.mode-simple) .event-left { grid-column: 1 / -1; }
}
/* Modo simple: la lista (y los amigos debajo) a la izquierda y el mapa a la derecha */
html.mode-simple .event-body { grid-template-columns: minmax(280px, 400px) minmax(0, 1fr); }
/* Pantalla normal (más de 900 px): la página no se desplaza, las columnas sí */
@media (min-width: 901px) {
  body:has(.event-view) { overflow: hidden; }
  body:has(.event-view) .app { height: 100vh; min-height: 0; }
  main:has(> .event-view) { min-height: 0; overflow: auto; padding: 10px 16px 12px; gap: 10px; max-width: none; grid-template-rows: minmax(0, 1fr); align-content: stretch; }
  .event-view { min-height: 560px; }
}
/* Ventana estrecha: una sola columna y la página se desplaza */
@media (max-width: 900px) {
  .event-view { grid-template-rows: auto; }
  .event-body, html.mode-simple .event-body, html:not(.mode-simple) .event-body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto; }
  .event-left, .event-center, .analysis-map { overflow: visible; }
  .event-left { grid-template-rows: auto; }
  .attempt-list { max-height: 320px; }
  .tab-panes { overflow: visible; }
  .analysis-map .map-panel { height: auto; }
  .analysis-map .map-box { flex: none; aspect-ratio: 1 / 1; min-height: 0; }
  .event-header { flex-wrap: wrap; }
}
.replay { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.replay input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
.replay select { color: var(--map-text); font-family: var(--font-data); padding-top: 3px; padding-bottom: 3px; }
.replay-gap { min-height: 1.4em; font-size: 0.86rem; color: var(--map-text); }
.replay .button[aria-pressed="true"] { background: linear-gradient(180deg, var(--selected-high), var(--selected-low)); color: #fff; border-color: var(--accent); }
.replay-options { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; width: 100%; }
.replay-options label { font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); display: inline-flex; gap: 6px; align-items: center; }
.compare-picker { display: flex; gap: 8px; align-items: center; margin: 2px 0 10px; flex-wrap: wrap; }
/* What is compared, always in view over the map: A against B and who wins */
.versus-bar { display: flex; flex-direction: column; align-items: stretch; gap: 8px; margin: 0 0 10px; padding: 8px 10px; border: 1px solid var(--line-strong); background: var(--surface-low); font-size: 0.86rem; }
.versus-kind { font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); display: inline-flex; gap: 6px; align-items: center; }
.versus-kind select { font-size: 0.86rem; letter-spacing: 0; text-transform: none; }
/* A and B: swatch, badge and select on one line; the time (and the gap) under the select */
.versus-side { display: grid; grid-template-columns: auto auto minmax(0, 1fr); align-items: center; gap: 4px 8px; min-width: 0; }
.versus-side select, .versus-side b { grid-column: 3; min-width: 0; width: 100%; }
.versus-sub { grid-column: 3; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 10px; min-width: 0; }
.versus-side b { font-weight: 600; }
/* Boost in use at the replay's instant */
.boost-tag { font-family: var(--font-display); font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 1px 6px; border: 1px solid var(--line-strong); color: var(--text-muted);
  display: inline-block; min-width: 13.5em; text-align: center; white-space: nowrap; box-sizing: border-box; }   /* fixed width: the bar does not move when it changes */
.boost-tag[data-boost="A"] { color: #1a0d00; background: #ff9a3d; border-color: #ff9a3d; }
.boost-tag[data-boost="R"] { color: #001424; background: #3db8ff; border-color: #3db8ff; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.versus-side .numeric { color: var(--text-muted); }
.versus-tag { font-family: var(--font-display); font-size: 0.72rem; letter-spacing: 0.1em; padding: 0 5px; border: 1px solid var(--line-strong); }
.versus-gap { margin-left: auto; font-family: var(--font-data); text-align: right; }
.compare-picker label { font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
.compare-picker select { font-size: 0.88rem; max-width: 100%; }
.sector-table td, .sector-table th { padding: 5px 8px; }
.sector-table tr.selected-a td { background: color-mix(in srgb, var(--accent) 10%, transparent); }
canvas { display: block; width: 100%; }
.map-panel { background: radial-gradient(circle at 50% 45%, var(--surface-low), var(--map-background) 70%); border-color: var(--line); }
.map-box { position: relative; width: 100%; aspect-ratio: 1 / 1; }
.map-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.segmented { display: inline-flex; border: 1px solid var(--line-strong); overflow: hidden; }
.segmented button { background: none; border: 0; padding: 4px 11px; cursor: pointer; font-family: var(--aurebesh-font) var(--font-display); font-weight: 600; letter-spacing: 0.1em;
  text-transform: uppercase; font-size: 0.76rem; color: var(--map-text); }
.segmented button:hover { color: #fff; }
.segmented button[aria-pressed="true"] { background: linear-gradient(180deg, var(--selected-high), var(--selected-low)); color: #fff; box-shadow: inset 0 -2px 0 var(--accent); }
.map-scale { display: flex; align-items: center; gap: 8px; font-family: var(--font-data); font-size: 0.75rem; color: var(--map-text); }
.map-scale .scale-bar { flex: 1; height: 5px; max-width: 260px; }
.ideal-row td { border-bottom: 2px solid var(--line-strong); }
.selected-a td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.selected-b td { background: color-mix(in srgb, var(--reference) 9%, transparent); }
.selected-a td:first-child { box-shadow: inset 3px 0 var(--accent); }
.selected-b td:first-child { box-shadow: inset 3px 0 var(--reference); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.85rem; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.legend-line { width: 16px; height: 3px; display: inline-block; }
.readout { font-family: var(--font-data); font-size: 0.82rem; color: var(--text-muted); min-height: 1.4em; flex-basis: 100%; }
@media (max-width: 1700px) { .breadcrumb-root { display: none; } }
.checkbox { accent-color: var(--accent); width: 15px; height: 15px; vertical-align: middle; }
.toast { position: fixed; right: 18px; bottom: 18px; background: var(--surface); border: 1px solid var(--line-strong); padding: 10px 14px;
  box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 0 20px color-mix(in srgb, var(--accent) 15%, transparent); }
.note { font-size: 0.82rem; color: var(--text-muted); max-width: 90ch; }
/* Notices (versions, safe mode) */
.notices { display: grid; gap: 6px; padding: 0 22px; max-width: 1500px; width: 100%; margin: 0 auto; }
.notices:not(:empty) { padding-top: 14px; }
.notice { display: flex; gap: 6px 12px; align-items: center; flex-wrap: wrap; padding: 9px 14px; font-size: 0.88rem;
  border: 1px solid var(--warning); border-left-width: 4px; background: color-mix(in srgb, var(--warning) 9%, var(--surface)); }
.notice b { color: var(--text); }
/* Pilots */
.pilot-row { display: flex; gap: 8px; margin: 6px 0 2px; flex-wrap: wrap; }
.pilot-row input { flex: 1 1 200px; min-width: 0; background: var(--input-background); border: 1px solid var(--line); color: var(--text); padding: 7px 10px; font: inherit; }
.pilot-row input:focus { outline: none; border-color: var(--accent); }
.drop-zone.drag-over { outline: 2px dashed var(--accent); outline-offset: -8px; }
.friends-list { display: grid; }
/* Profile and Social */
.pilot-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 1px rgba(0,0,0,.4); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin: 6px 0 4px; }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.swatch[aria-pressed="true"] { border-color: var(--text); box-shadow: 0 0 0 2px var(--background), 0 0 12px var(--pilot-color, #fff); }
.profile-card { display: grid; gap: 6px; padding: 18px 20px; border: 1px solid var(--line); border-left: 5px solid var(--pilot-color); background: var(--surface); margin-bottom: 10px; }
.profile-name { font-family: var(--aurebesh-font) var(--font-display); font-size: 1.5rem; font-weight: 700; letter-spacing: 0.06em; color: var(--text); }
table.social td.text { white-space: nowrap; }
table.social th { white-space: nowrap; }
.versus-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.versus-summary .win { font-size: 0.9rem; }
.more-friends { font-size: 0.85rem; }
/* Home: cards view or times-only view */
.home-tools { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.gold-count { font-size: 0.88rem; color: var(--text-muted); }
.filters.categories { flex-wrap: wrap; }
.filters.categories button .muted { font-family: var(--font-data); margin-left: 4px; }
.gold-count b { color: var(--warning); font-family: var(--font-data); }
.tag.gold { color: #1a1206; background: linear-gradient(180deg, #ffe08a, #e2a72e); border-color: #e2a72e; }
.times-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 10px; }
.time-tile { display: grid; gap: 4px; align-content: start; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.time-tile.clickable { cursor: pointer; }
.time-tile.clickable:hover { border-color: var(--line-strong); background: var(--surface-hover); }
.time-tile-title { display: grid; min-width: 0; }
.time-tile-title .event-vehicle { margin: 0; font-size: 0.62rem; }
.time-tile-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.time-tile-record { display: flex; align-items: center; gap: 4px; font-size: 1.25rem; }
.time-tile-record .tag, .time-tile-record .loss { font-size: 0.7rem; }
.time-tile-detail { font-size: 0.8rem; }
.time-tile-friends { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 1px 10px; font-size: 0.82rem; border-top: 1px solid var(--line); padding-top: 4px; margin-top: 2px; }
.time-tile-friends > span:nth-child(3n+1) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
html .time-tile { border-radius: 8px; }
/* About */
.about-versions { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.changelog { display: grid; gap: 8px; }
.changelog details { border: 1px solid var(--line); background: var(--surface-low); }
/* Grupo «Versiones anteriores»: las versiones de dentro, un poco sangradas */
.changelog .older-versions > details { margin: 0 10px 8px; }
.changelog summary { display: flex; align-items: center; gap: 8px; padding: 8px 12px; cursor: pointer; list-style: none; font-size: 0.95rem; font-weight: 700; letter-spacing: 0.06em; font-family: var(--font-display); }
.changelog summary::-webkit-details-marker { display: none; }
.changelog summary::before { content: ""; flex: none; width: 7px; height: 7px; border-right: 2px solid var(--text-muted); border-bottom: 2px solid var(--text-muted); transform: rotate(-45deg); transition: transform .15s, border-color .15s; }
.changelog details[open] > summary::before { transform: rotate(45deg); }
.changelog summary:hover::before { border-color: var(--accent); }
.changelog summary:hover { background: var(--surface-hover); }
.changelog summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.changelog summary .muted { font-weight: 400; letter-spacing: 0; font-size: 0.82rem; }
.changelog details[open] > summary { border-bottom: 1px solid var(--line); }
.changelog ul { margin: 0; padding: 10px 12px 12px 2em; display: grid; gap: 3px; }
.changelog li { line-height: 1.45; }
.credits { display: grid; gap: 8px; margin: 0; }
.credits dt { font-weight: 600; color: var(--text); }
.credits dd { margin: 0 0 4px; color: var(--text-muted); font-size: 0.88rem; line-height: 1.45; }
.about-warning { border-left: 4px solid var(--warning); padding: 10px 14px; background: color-mix(in srgb, var(--warning) 8%, var(--surface)); line-height: 1.5; }
.friend-item { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 12px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--line); }
.friend-item b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wins { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.wins .win { display: inline-flex; gap: 6px; align-items: baseline; padding: 4px 10px; border: 1px solid var(--line); background: var(--surface); font-size: 0.86rem; }
.wins .win.mine { border-color: var(--accent); }
.wins .win b { font-size: 1.05rem; }
tr.my-row td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
tr.my-row td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
tr.friend-row td { background: var(--surface-low); }
table.friends td.text, table.friends th:nth-child(2) { text-align: left; }
table.friends td.compare-cell { white-space: nowrap; }
.position { font-weight: 700; color: var(--text); }
.position.first { color: var(--best); }
.event-friends { color: var(--text); }
/* Hologram intensity */
html.hologram.hologram-soft body::after { background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--hologram) 4%, transparent) 0 1px, transparent 1px 4px); }

html.hologram.hologram-strong body::after { background: repeating-linear-gradient(0deg, color-mix(in srgb, var(--hologram) 14%, transparent) 0 1px, transparent 1px 3px),
  radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0, 0, 0, .38)); }
html.hologram.hologram-strong .hologram-band { height: 42vh; filter: brightness(1.9); animation-duration: 5s; }
html.hologram.hologram-strong .panel, html.hologram.hologram-strong .event-card, html.hologram.hologram-strong .tile, html.hologram.hologram-strong .summary-strip {
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--hologram) 22%, transparent), 0 0 30px color-mix(in srgb, var(--hologram) 12%, transparent); }
html.no-animations *, html.no-animations *::before, html.no-animations *::after { transition: none !important; animation: none !important; }
</style>

<script>
// Lap analysis from the SWGR Telemetry mod's session CSV and its route.csv.
// It does not depend on the mod's version: checkpoint crossings are recalculated from the distance
// travelled, and the finish line is the checkpoint crossed when the OFFICIAL event shows up (the lap
// time published by the game).
// Distances are in centimetres along the route and times in seconds.

// route.csv: type,distance,x,y,z with "point" rows (the spline) and "checkpoint" rows.
// Files from 0.9.17 and earlier used P and C for the type.
function parseRouteCsv(text) {
  const points = [], checkpointDistances = [], checkpoints = [];
  for (const line of text.split(/\r?\n/).slice(1)) {
    const columns = line.split(',');
    if (columns.length < 5) continue;
    const type = columns[0], record = [+columns[1], +columns[2], +columns[3], +columns[4]];
    if (type === 'point' || type === 'P') points.push(record);
    else if (type === 'checkpoint' || type === 'C') {
      checkpointDistances.push(+columns[1]);
      checkpoints.push({ distance: +columns[1], x: +columns[2], y: +columns[3] });
    }
  }
  return { points, checkpointDistances, checkpoints };
}

// The session CSV: one sample per row. The columns are looked up by name, with the English names
// of 0.9.18 or the Spanish ones of the earlier versions.
// Tipo de vehículo según el nombre del evento: CAR, BIKE, SKIMMER o PLANE (como en el mod)
function vehicleTypeOfEvent(eventId) {
  const match = /_(CAR|BIKE|SKIMMER|PLANE)_/.exec(eventId || '');
  return match ? match[1] : '';
}
// Estela blanca (el «cuadrado») y freno de cada muestra: W, B, WB o '' (como la columna 9 del fantasma).
// Coche: derrape; rasante: canto; vaina: aerofreno; moto: la carga y suelta del freno de energía.
// En la moto, el frenado mientras cargas es parte del cuadrado y no cuenta como freno.
function trailCodeOf(vehicleType, value) {
  const active = name => value(name) > 0;
  const white = vehicleType === 'CAR' ? active('drifting') : vehicleType === 'SKIMMER' ? active('knifing')
    : vehicleType === 'PLANE' ? active('air_brake_scale') : vehicleType === 'BIKE' ? active('energy_brake_state') : false;
  const braking = active('brake') && !(vehicleType === 'BIKE' && white);
  return (white ? 'W' : '') + (braking ? 'B' : '');
}
function parseSessionCsv(text, vehicleType) {
  const lines = text.split(/\r?\n/);
  const header = lines[0].split(',');
  const columnOf = (...names) => names.map(name => header.indexOf(name)).find(index => index >= 0) ?? -1;
  const timeColumn = columnOf('time', 't'), distanceColumn = columnOf('distance', 'dist'), xColumn = columnOf('x'), yColumn = columnOf('y');
  const zColumn = columnOf('z'), headingColumn = columnOf('heading', 'rumbo');
  const speedColumn = columnOf('kmh'), eventColumn = columnOf('event', 'evento'), boostColumn = columnOf('boost');   // boost: from mod 0.9.25 on
  // estado del vehículo (desde la 0.9.31): estela blanca y freno
  const stateColumns = {};
  for (const name of ['brake', 'drifting', 'knifing', 'air_brake_scale', 'energy_brake_state']) stateColumns[name] = header.indexOf(name);
  const hasState = header.indexOf('brake') >= 0;
  const samples = [];
  for (let index = 1; index < lines.length; index++) {
    const columns = lines[index].split(',');
    if (columns.length < 15) continue;
    const events = columns[eventColumn] || '';
    samples.push({ time: +columns[timeColumn], distance: +columns[distanceColumn], x: +columns[xColumn], y: +columns[yColumn], speed: +columns[speedColumn],
      // bonificación ganada en esta muestra (Precisión): marcas BONUS+1.500
      bonus: events.split(' ').filter(token => token.startsWith('BONUS')).reduce((sum, token) => sum + (parseFloat(token.slice(5)) || 0), 0),
      official: events.includes('OFFICIAL') || events.includes('OFICIAL'), go: events.split(' ').includes('GO'), started: events.includes('START'), reset: events.includes('RESET') || events.includes('RETROCESO'),
      boost: boostColumn >= 0 ? (columns[boostColumn] || '') : '',
      trail: hasState ? trailCodeOf(vehicleType, name => +(columns[stateColumns[name]] || 0)) : '',
      z: zColumn >= 0 ? +columns[zColumn] : NaN, heading: headingColumn >= 0 ? +columns[headingColumn] : NaN });
  }
  return samples;
}

// Samples packed as "time,distance,x,y,speed,flags;..." (flags: 1 = official lap time, 2 = reset)
function unpackSamples(packed) {
  return packed.split(';').map(sample => {
    const columns = sample.split(',');
    const flags = +columns[5];
    return { time: +columns[0], distance: +columns[1], x: +columns[2], y: +columns[3], speed: +columns[4], official: (flags & 1) > 0, reset: (flags & 2) > 0 };
  });
}

function routeLength(route) { return route.points[route.points.length - 1][0]; }

// Driving direction relative to the spline: compares the recorded distance with the distance of the
// closest route point.
function detectDirection(route, samples) {
  const length = routeLength(route);
  let forward = 0, backward = 0;
  const moving = samples.filter(sample => sample.speed > 50);
  const step = Math.max(1, Math.floor(moving.length / 40));
  for (let index = 0; index < moving.length; index += step) {
    const sample = moving[index];
    let closestSquared = Infinity, closestDistance = 0;
    for (const point of route.points) {
      const squared = (point[1] - sample.x) ** 2 + (point[2] - sample.y) ** 2;
      if (squared < closestSquared) { closestSquared = squared; closestDistance = point[0]; }
    }
    const forwardGap = Math.abs(sample.distance - closestDistance), backwardGap = Math.abs(sample.distance - (length - closestDistance));
    if (Math.min(forwardGap, length - forwardGap) < Math.min(backwardGap, length - backwardGap)) forward++; else backward++;
  }
  return forward >= backward ? 1 : -1;
}

// rolling (opcional): arranque lanzado, { total, officialLap } del resumen. La vuelta va del GO a la
// meta, la puerta cierra el S1 y los checkpoints de la carrerilla no cuentan.
function analyzeSession(route, samples, name, rolling) {
  const length = routeLength(route);
  const direction = detectDirection(route, samples);
  // Checkpoint gates: position, distance in the driving direction and direction of the route
  const points = route.points;
  const gates = (route.checkpoints || route.checkpointDistances.map(distance => ({ distance, x: null, y: null }))).map(checkpoint => {
    let segment = 0;
    while (segment < points.length - 2 && points[segment + 1][0] < checkpoint.distance) segment++;
    const behind = points[Math.max(0, segment - 2)], ahead = points[Math.min(points.length - 1, segment + 3)];
    let tangentX = ahead[1] - behind[1], tangentY = ahead[2] - behind[2];
    const tangentLength = Math.hypot(tangentX, tangentY) || 1;
    tangentX = tangentX / tangentLength * direction; tangentY = tangentY / tangentLength * direction;
    const fraction = (checkpoint.distance - points[segment][0]) / ((points[segment + 1][0] - points[segment][0]) || 1);
    const x = checkpoint.x ?? points[segment][1] + fraction * (points[segment + 1][1] - points[segment][1]);
    const y = checkpoint.y ?? points[segment][2] + fraction * (points[segment + 1][2] - points[segment][2]);
    return { distance: direction === 1 ? checkpoint.distance : length - checkpoint.distance, x, y, tangentX, tangentY };
  }).sort((first, second) => first.distance - second.distance);
  const checkpointDistances = gates.map(gate => gate.distance);
  const GATE_RADIUS = 15000;
  // Checkpoint crossings, combining two methods:
  //  1. Progress along the route: its time matches the game's official time.
  //  2. Passing through the checkpoint's gate: finds the crossings the first method misses when you
  //     drive very far from the centre (alternative lines, weaving from edge to edge).
  const byRoute = [], byGate = [];
  const resetTimes = [];
  const lastByRoute = {}, lastByGate = {};
  for (let index = 1; index < samples.length; index++) {
    const previous = samples[index - 1], sample = samples[index];
    if (sample.reset) resetTimes.push(sample.time);
    if (!(sample.time > previous.time)) continue;
    const previousDistance = previous.distance, distance = sample.distance;
    const wrapsAround = previousDistance > 0.9 * length && distance < 0.1 * length;
    const step = wrapsAround ? distance + length - previousDistance : distance - previousDistance;
    if (step > 0 && step < 0.05 * length) {
      checkpointDistances.forEach((checkpointDistance, checkpoint) => {
        let fraction = null;
        if (wrapsAround) {
          if (checkpointDistance > previousDistance) fraction = (checkpointDistance - previousDistance) / step;
          else if (checkpointDistance <= distance) fraction = (checkpointDistance + length - previousDistance) / step;
        } else if (previousDistance < checkpointDistance && checkpointDistance <= distance) fraction = (checkpointDistance - previousDistance) / step;
        if (fraction === null) return;
        const crossingTime = previous.time + fraction * (sample.time - previous.time);
        if (lastByRoute[checkpoint] === undefined || crossingTime - lastByRoute[checkpoint] > 2) { lastByRoute[checkpoint] = crossingTime; byRoute.push({ time: crossingTime, checkpoint }); }
      });
    }
    if (Math.hypot(sample.x - previous.x, sample.y - previous.y) > 20000) continue;
    gates.forEach((gate, checkpoint) => {
      const sideBefore = (previous.x - gate.x) * gate.tangentX + (previous.y - gate.y) * gate.tangentY;
      const sideAfter = (sample.x - gate.x) * gate.tangentX + (sample.y - gate.y) * gate.tangentY;
      if (!(sideBefore < 0 && sideAfter >= 0)) return;
      const fraction = sideBefore / (sideBefore - sideAfter);
      if (Math.hypot(previous.x + fraction * (sample.x - previous.x) - gate.x, previous.y + fraction * (sample.y - previous.y) - gate.y) > GATE_RADIUS) return;
      let gapAlongRoute = Math.abs(sample.distance - gate.distance); gapAlongRoute = Math.min(gapAlongRoute, length - gapAlongRoute);
      if (gapAlongRoute > 0.25 * length) return;
      const crossingTime = previous.time + fraction * (sample.time - previous.time);
      if (lastByGate[checkpoint] === undefined || crossingTime - lastByGate[checkpoint] > 2) { lastByGate[checkpoint] = crossingTime; byGate.push({ time: crossingTime, checkpoint }); }
    });
  }
  const crossings = byRoute.slice();
  for (const crossing of byGate) {
    if (!byRoute.some(other => other.checkpoint === crossing.checkpoint && Math.abs(other.time - crossing.time) < 1.5)) crossings.push(crossing);
  }
  crossings.sort((first, second) => first.time - second.time);
  // Finish line: the checkpoint crossed next to the OFFICIAL event
  const officialTimes = samples.filter(sample => sample.official).map(sample => sample.time);
  const votes = {};
  for (const officialTime of officialTimes) {
    let closest = null, closestGap = 1.0;
    for (const crossing of crossings) { const gap = Math.abs(crossing.time - officialTime); if (gap <= closestGap) { closestGap = gap; closest = crossing; } }
    if (closest) votes[closest.checkpoint] = (votes[closest.checkpoint] || 0) + 1;
  }
  let finishCheckpoint = null, mostVotes = 0;
  for (const checkpoint in votes) if (votes[checkpoint] > mostVotes) { mostVotes = votes[checkpoint]; finishCheckpoint = +checkpoint; }
  let finishDistance, finishTimes;
  if (finishCheckpoint !== null) {
    finishDistance = checkpointDistances[finishCheckpoint];
    finishTimes = crossings.filter(crossing => crossing.checkpoint === finishCheckpoint).map(crossing => crossing.time);
  } else {
    // Without official data: the start of the route works as the finish line
    finishDistance = 0; finishTimes = [];
    for (let index = 1; index < samples.length; index++) {
      const previousDistance = samples[index - 1].distance, distance = samples[index].distance;
      if (previousDistance > 0.9 * length && distance < 0.1 * length) {
        finishTimes.push(samples[index - 1].time + (length - previousDistance) / (distance + length - previousDistance) * (samples[index].time - samples[index - 1].time));
      }
    }
  }
  // Open stage (point to point): the start is the first checkpoint in the driving direction and each
  // lap goes from its crossing to the finish; on a circuit, from finish to finish.
  const firstPoint = points[0], lastPoint = points[points.length - 1];
  const isPointToPoint = Math.hypot(lastPoint[1] - firstPoint[1], lastPoint[2] - firstPoint[2]) > 2000 && finishCheckpoint !== null;
  let startCheckpoint = null;
  if (isPointToPoint) startCheckpoint = checkpointDistances.map((_, checkpoint) => checkpoint).find(checkpoint => checkpoint !== finishCheckpoint && checkpointDistances[checkpoint] < finishDistance) ?? null;
  let originDistance = startCheckpoint !== null ? checkpointDistances[startCheckpoint] : finishDistance;
  let sectorCheckpoints = checkpointDistances.map((_, checkpoint) => checkpoint).filter(checkpoint => checkpoint !== finishCheckpoint && checkpoint !== startCheckpoint);
  // Arranque lanzado: el GO es el total antes de la meta (o la marca GO del CSV) y la puerta, la vuelta oficial antes
  let rollingSpan = null;
  if (isPointToPoint && rolling && finishTimes.length) {
    const end = finishTimes[0];
    const goMarker = samples.find(sample => sample.go);
    const goTime = rolling.total > 0 ? end - rolling.total : (goMarker ? goMarker.time : null);
    const gateTime = rolling.officialLap > 0 ? end - rolling.officialLap : null;
    const gate = gateTime === null ? null : crossings.filter(crossing => crossing.checkpoint !== finishCheckpoint && Math.abs(crossing.time - gateTime) < 0.5)
      .sort((first, second) => Math.abs(first.time - gateTime) - Math.abs(second.time - gateTime))[0];
    if (goTime !== null && gate) {
      // Donde arrancas: la primera muestra desde el GO, ya con la salida registrada (antes la distancia no tiene sentido de marcha)
      const startedIndex = Math.max(0, samples.findIndex(sample => sample.started));
      const goSample = samples.find((sample, index) => index >= startedIndex && sample.time >= goTime) || samples[startedIndex];
      startCheckpoint = gate.checkpoint;
      originDistance = goSample.distance;
      const gateDistance = checkpointDistances[gate.checkpoint];
      sectorCheckpoints = [gate.checkpoint].concat(checkpointDistances.map((_, checkpoint) => checkpoint)
        .filter(checkpoint => checkpoint !== finishCheckpoint && checkpointDistances[checkpoint] > gateDistance));
      rollingSpan = [goTime, end];
    }
  }
  const sectorCount = sectorCheckpoints.length + 1;
  const sectorStarts = sectorCheckpoints.map(checkpoint => (checkpointDistances[checkpoint] - originDistance + length) % length).sort((first, second) => first - second);
  const spans = [];
  if (rollingSpan) spans.push(rollingSpan);
  else if (startCheckpoint !== null) {
    const startTimes = crossings.filter(crossing => crossing.checkpoint === startCheckpoint).map(crossing => crossing.time);
    for (const end of finishTimes) {
      const start = startTimes.filter(time => time < end).pop();
      if (start !== undefined) spans.push([start, end]);
    }
  } else for (let index = 1; index < finishTimes.length; index++) spans.push([finishTimes[index - 1], finishTimes[index]]);
  // Bonificación (Precisión): lo que se descuenta entre dos momentos
  const bonusSamples = samples.filter(sample => sample.bonus);
  const bonusBetween = (from, to) => bonusSamples.reduce((sum, sample) => sample.time > from && sample.time <= to ? sum + sample.bonus : sum, 0);
  const laps = [];
  for (const [start, end] of spans) {
    if (end - start < 5 || end - start > 900) continue;
    const lapBonus = bonusBetween(start, end);
    const time = end - start - lapBonus;
    const firstCrossing = {};
    let repeatedCrossings = 0;
    for (const crossing of crossings) {
      if (!sectorCheckpoints.includes(crossing.checkpoint) || crossing.time <= start + 0.25 || crossing.time >= end - 0.25) continue;
      if (firstCrossing[crossing.checkpoint] !== undefined) repeatedCrossings++; else firstCrossing[crossing.checkpoint] = crossing.time;
    }
    const sectorEnds = Object.values(firstCrossing).sort((first, second) => first - second);
    const allSectors = sectorEnds.length === sectorCount - 1;
    const sectors = [];
    let sectorStart = start;
    for (const sectorEnd of sectorEnds) { sectors.push(sectorEnd - sectorStart - bonusBetween(sectorStart, sectorEnd)); sectorStart = sectorEnd; }
    sectors.push(end - sectorStart - bonusBetween(sectorStart, end));
    const official = officialTimes.some(officialTime => Math.abs(officialTime - end) < 1.0);
    const incident = repeatedCrossings > 0 || resetTimes.some(resetTime => resetTime > start && resetTime <= end);
    // Trace: distance from the finish line and lap time
    const trace = [];
    for (const sample of samples) {
      if (sample.time < start - 0.05 || sample.time > end + 0.05) continue;
      let lapDistance;
      if (isPointToPoint) lapDistance = sample.distance - originDistance;
      else {
        lapDistance = (sample.distance - finishDistance + length) % length;
        if (sample.time - start < 2 && lapDistance > 0.8 * length) lapDistance -= length;
        if (end - sample.time < 2 && lapDistance < 0.2 * length) lapDistance += length;
      }
      trace.push({ distance: lapDistance, time: sample.time - start - bonusBetween(start, sample.time), x: sample.x, y: sample.y, speed: sample.speed, boost: sample.boost || '', trail: sample.trail || '', z: sample.z, heading: sample.heading });
    }
    laps.push({ session: name, number: laps.length + 1, start, end, time, bonus: lapBonus, sectors: allSectors ? sectors : null,
      measuredSectors: sectors, official, incident, trace });
  }
  return { name, direction, routeLength: length, finishDistance, finishCheckpoint, startCheckpoint, isPointToPoint, originDistance, rolling: !!rollingSpan,
    span: isPointToPoint ? finishDistance - originDistance : length, sectorCount, sectorStarts, laps };
}

// Lap time as a function of distance (monotonic: after a reset the first instant each distance is
// reached is the one kept).
function timeAtDistance(lap) {
  if (lap.timeByDistance) return lap.timeByDistance;
  const distances = [], times = [];
  let furthest = -Infinity;
  for (const point of lap.trace) {
    if (point.distance > furthest) { furthest = point.distance; distances.push(point.distance); times.push(point.time); }
  }
  lap.timeByDistance = { distances, times };
  return lap.timeByDistance;
}
// Linear interpolation of y at x, with xValues sorted from low to high
function interpolate(xValues, yValues, x) {
  if (x <= xValues[0]) return yValues[0];
  if (x >= xValues[xValues.length - 1]) return yValues[yValues.length - 1];
  let low = 0, high = xValues.length - 1;
  while (high - low > 1) { const middle = (low + high) >> 1; if (xValues[middle] <= x) low = middle; else high = middle; }
  const fraction = (x - xValues[low]) / (xValues[high] - xValues[low] || 1);
  return yValues[low] + fraction * (yValues[high] - yValues[low]);
}
// Time difference between two laps (A − B) at pointCount + 1 evenly spaced distances
function deltaSeries(lapA, lapB, length, pointCount) {
  const timesA = timeAtDistance(lapA), timesB = timeAtDistance(lapB);
  const series = [];
  for (let index = 0; index <= pointCount; index++) {
    const distance = length * index / pointCount;
    series.push({ distance, difference: interpolate(timesA.distances, timesA.times, distance) - interpolate(timesB.distances, timesB.times, distance) });
  }
  return series;
}

  // Con el nombre oficial en inglés solo en la página en inglés; el nombre que pone el usuario manda siempre

  // ---------- Records imported from the game (game_records.txt) ----------
  // Columns: total, attempts, name, planet, date, #1 time, category, planet code
  function gameRecordOf(data, eventId) {
    const line = (data.gameRecords || {})[eventId];
    if (!line) return null;

  // The planet (shown in its own font) and the event name without the planet

  // ---------- Model ----------

  function buildEvents(data) {
    const eventsById = {};
    for (const session of data.sessions) {
      if (session.hasBuild) continue;
      (eventsById[session.event] ||= { id: session.event, sessions: [] }).sessions.push(session);
    }
    const events = Object.values(eventsById).map(event => summarizeEvent(event, data));
    events.sort((first, second) => (second.lastDate || '').localeCompare(first.lastDate || ''));
    return events;
  }
  function summarizeEvent(event, data) {
    const sessions = event.sessions.slice().sort((first, second) => first.id.localeCompare(second.id));
    event.sessions = sessions;
    event.gameRecord = gameRecordOf(data, event.id);
    event.name = data.eventNames[event.id] || (officialEventName(event.id) && [planetOf(event.gameRecord, event.id), officialEventName(event.id)].filter(Boolean).join(' · ')) || gameEventName(event.gameRecord, event.id) || describeEventCode(event.id);
    Object.assign(event, eventTitles(data, event.id, event.gameRecord));
    event.lastDate = sessions.length ? sessions[sessions.length - 1].date || sessions[sessions.length - 1].id : '';
    event.plannedLaps = Math.max(0, ...sessions.map(session => session.plannedLaps || 0));
    // Arranque lanzado (tramos que empiezan a cronometrar la vuelta en una puerta tras una carrerilla): el
    // tiempo que cuenta es el total desde el GO. Las carreras de antes del cambio traían la vuelta oficial
    // (desde la puerta): pasan a valer el total del evento y se quedan sin sectores.
    // Bonificación (Precisión): las vueltas de antes no la descontaban; cuenta su total, pero no sus vueltas
    event.bonus = sessions.some(session => (session.laps || []).some(lap => lap.bonusEvent));
    if (event.bonus) for (const session of sessions) for (const lap of session.laps || []) {
      if (!lap.bonusEvent) { lap.valid = false; lap.official = false; }
    }
    event.rolling = event.plannedLaps === 1 && sessions.some(session => (session.laps || []).some(lap => lap.rolling));
    if (event.rolling) for (const session of sessions) for (const lap of session.laps || []) {
      if (lap.rolling) continue;
      lap.rolling = true; lap.officialLap = lap.time; lap.sectors = []; lap.valid = false;
      if (session.total > lap.time + 1) lap.time = session.total; else lap.official = false;   // sin total no se puede comparar
    }
    event.attempts = sessions.length;
    event.completeSessions = sessions.filter(session => session.total > 0);
    event.bestSession = event.completeSessions.reduce((best, session) => (!best || session.total < best.total ? session : best), null);
    const withTarget = sessions.filter(session => session.target > 0);
    event.targetSource = withTarget.length ? withTarget[withTarget.length - 1] : null;
    // No races with a target: the #1 time that the mod imports from the Arcade list
    if (!event.targetSource && event.gameRecord && event.gameRecord.target) event.targetSource = { target: event.gameRecord.target, targetPlayer: 'nº1 del juego' };
    // Sectors: the most common count among valid laps
    const lapsBySectorCount = {};
    let bestLap = null;
    const allLaps = [];
    // solo las carreras completas: los intentos sin terminar (reinicios) no cuentan para los mejores ni el ideal
    for (const session of sessions) for (const lap of session.incomplete ? [] : session.laps || []) {
      allLaps.push({ session, lap });

      if (lap.valid) lapsBySectorCount[lap.sectors.length] = (lapsBySectorCount[lap.sectors.length] || 0) + 1;
    }
    event.bestLap = bestLap;
    const sectorCount = +Object.keys(lapsBySectorCount).sort((first, second) => lapsBySectorCount[second] - lapsBySectorCount[first])[0] || 0;
    event.sectorCount = sectorCount;
    // Start lap (lap 1 of an event with several laps): only its S1 is different, because it starts with
    // less speed. That S1 is kept apart; the rest of lap 1 counts like any other lap.
    const severalLaps = event.plannedLaps > 1;
    const isStartLap = lap => severalLaps && lap.number === 1;
    const isStartSector = (lap, sectorIndex) => isStartLap(lap) && sectorIndex === 0;
    event.bestSectors = Array(sectorCount).fill(null);
    event.bestStartSector = null;
    for (const { session, lap } of allLaps) {
      // las vueltas con incidente (choque, retroceso) no cuentan: un sector recortado haría el ideal irreal
      if (!lap.valid || lap.incident || lap.sectors.length !== sectorCount) continue;
      lap.sectors.forEach((value, sectorIndex) => {
        if (isStartSector(lap, sectorIndex)) { if (!event.bestStartSector || value < event.bestStartSector.value) event.bestStartSector = { value, session, lap }; }
        else if (!event.bestSectors[sectorIndex] || value < event.bestSectors[sectorIndex].value) event.bestSectors[sectorIndex] = { value, session, lap };
      });
    }
    event.idealLap = sectorCount && event.bestSectors.every(Boolean) ? event.bestSectors.reduce((sum, best) => sum + best.value, 0) : null;
    event.idealStartLap = severalLaps && event.idealLap && event.bestStartSector ? event.idealLap - event.bestSectors[0].value + event.bestStartSector.value : null;
    // Total ideal. Con varias vueltas, con vueltas que has dado de verdad: tu mejor vuelta 1 y tus mejores
    // vueltas lanzadas (una distinta para cada vuelta que queda; si no hay bastantes, se repite la mejor).
    // Repetir la vuelta ideal por sectores en todas daba un total que nadie puede hacer.
    event.idealTotal = null;
    if (severalLaps) {
      const realLaps = allLaps.filter(item => item.lap.official && !item.lap.incident).map(item => item.lap);
      const bestStart = realLaps.filter(isStartLap).reduce((best, lap) => (!best || lap.time < best.time ? lap : best), null);
      const flyingTimes = realLaps.filter(lap => !isStartLap(lap)).map(lap => lap.time).sort((first, second) => first - second);
      if (bestStart && flyingTimes.length) {
        event.idealTotal = bestStart.time;
        for (let index = 0; index < event.plannedLaps - 1; index++) event.idealTotal += flyingTimes[Math.min(index, flyingTimes.length - 1)];
      }
    } else if (event.idealLap && event.plannedLaps) event.idealTotal = event.idealLap;
    // Consistency: the average of your last 10 clean laps against your best lap
    const cleanLaps = allLaps.filter(item => item.lap.official && !item.lap.incident && !isStartLap(item.lap)).slice(-10);
    event.recentAverageLap = cleanLaps.length >= 3 ? cleanLaps.reduce((sum, item) => sum + item.lap.time, 0) / cleanLaps.length : null;
    // Where you lose time: the average of your last 10 clean laps in each sector against your best sector
    const comparableLaps = allLaps.filter(item => item.lap.valid && !item.lap.incident && item.lap.sectors.length === sectorCount);
    const recentLaps = comparableLaps.filter(item => !isStartLap(item.lap)).slice(-10);
    const recentStarts = comparableLaps.filter(item => isStartLap(item.lap)).slice(-10);
    event.startSectorLoss = event.bestStartSector && recentStarts.length >= 2 ? { count: recentStarts.length, best: event.bestStartSector.value,
      averageLoss: recentStarts.reduce((sum, item) => sum + item.lap.sectors[0], 0) / recentStarts.length - event.bestStartSector.value } : null;
    event.sectorLosses = null;
    if (sectorCount >= 2 && recentLaps.length >= 3 && event.bestSectors.every(Boolean)) {
      const bestLapWithSectors = bestLap && bestLap.lap.valid && bestLap.lap.sectors.length === sectorCount ? bestLap.lap : null;
      event.sectorLosses = { count: recentLaps.length, rows: event.bestSectors.map((best, sectorIndex) => {
        const laps = comparableLaps.filter(item => !isStartSector(item.lap, sectorIndex)).slice(-10);
        const average = laps.reduce((sum, item) => sum + item.lap.sectors[sectorIndex], 0) / laps.length;
        return { sectorIndex, best: best.value, average, loss: average - best.value, lossInBestLap: bestLapWithSectors ? bestLapWithSectors.sectors[sectorIndex] - best.value : null };
      }) };

    const manualRecord = (data.manualGameRecords[event.id] || '').split('|');
    event.gameBest = { total: (event.gameRecord && event.gameRecord.total) || parseFloat(manualRecord[0]) || null, lap: parseFloat(manualRecord[1]) || null, imported: !!event.gameRecord };
    event.recordTime = Math.min(...[event.bestSession && event.bestSession.total, event.gameBest.total].filter(value => value > 0));
    if (!isFinite(event.recordTime)) event.recordTime = null;
    return event;
  }

      const fastest = Math.min(...[item.recordTime].concat(friendTimes.map(entry => entry.time)).filter(value => value > 0));

  // Franja de resumen: tu récord contra el objetivo nº1, el total ideal y las medias

      '<button class="button small" id="gameRecordSave">Guardar</button><span class="detail" id="gameRecordMessage">Tus tiempos de antes del mod</span></div>';

  // Dónde pierdes tiempo: una tabla por sector con la pérdida media y tu mejor tiempo
  function lossHtml(event) {
    const rows = event.sectorLosses.rows.slice().sort((first, second) => second.loss - first.loss);
    const worstSectors = rows.slice(0, 2).filter(row => row.loss > 0.01);

    html += '<table class="loss-table"><thead><tr><th>Sector</th><th>Pérdida</th><th>Tu mejor</th><th>En tu mejor vuelta</th></tr></thead><tbody>';

        (row.lossInBestLap != null ? (row.lossInBestLap < 0.0005 ? '<span class="best">igual</span>' : '+' + row.lossInBestLap.toFixed(3)) : '—') + '</td></tr>';
    }
    html += '</tbody></table>';
    html += '<div class="note">media de tus últimas ' + event.sectorLosses.count + (event.plannedLaps > 1 ? ' vueltas' : ' pasadas') + ' limpias frente a tu mejor tiempo en cada sector' + (event.plannedLaps > 1 ? ' · el S1 de salida va aparte' : '') + '</div>';

        startLoss.best.toFixed(3) + '</b> y de media en tus últimas ' + startLoss.count + ' pierdes <b class="numeric loss">+' + Math.max(0, startLoss.averageLoss).toFixed(3) + '</b>.</p>';

  // Intento elegido en la lista: el que se analiza (por defecto, el del mejor total)
  function focusedSession(event) {
    const chosen = event.sessions.find(session => session.id === focusedSessionByEvent[event.id] && session.telemetryFile);
    if (chosen) return chosen;
    if (event.bestSession && event.bestSession.telemetryFile) return event.bestSession;
    return event.sessions.filter(session => session.telemetryFile).pop() || null;
  }
  // Lista compacta de intentos: fecha, total y tiempos de vuelta; pulsar uno lo elige y la casilla suma otros al análisis
  function attemptsHtml(event) {
    const selected = selectedSessions(event), focused = focusedSession(event);
    let html = '<section class="panel attempts-panel"><div class="panel-header"><h2>Intentos</h2><span class="muted" title="Pulsa un intento para ver sus datos y marca la casilla para sumar otros al análisis. Se conservan los últimos ' + state.data.attemptsToKeep +
      ' por evento; el mejor total y la mejor vuelta se guardan siempre.">Pulsa uno para analizarlo</span></div><div class="attempt-list">';
    if (!event.completeSessions.length) html += '<p class="muted">Aún no hay carreras completas en este evento</p>';
    for (const session of event.completeSessions.slice().reverse()) {
      const isBestSession = event.bestSession === session;
      const explanation = [session.eventGuessed ? 'grabado antes de identificar eventos' : '', session.telemetryFile ? '' : 'su telemetría ya no se conserva'].filter(Boolean).join(' · ');
      const rowClasses = 'attempt' + (session.telemetryFile ? '' : ' faded-row') + (focused && focused.id === session.id ? ' focused' : '');
      html += '<div class="' + rowClasses + '" data-attempt="' + escapeHtml(session.id) + '"' +
        (explanation ? ' title="' + escapeHtml(explanation) + '"' : '') + '><input type="checkbox" class="checkbox" data-select-session="' + escapeHtml(session.id) + '"' +
        (selected.has(session.id) ? ' checked' : '') + (session.telemetryFile ? '' : ' disabled') + ' id="select-' + escapeHtml(session.id) + '">' +
        '<span class="attempt-date">' + escapeHtml((session.date || session.id).slice(5, 16)) + '</span>' +
        '<span class="attempt-total numeric' + (isBestSession ? ' best' : '') + '">' + (session.total ? formatTime(session.total) + (session.totalCalculated ? '*' : '') : '—') + '</span>';
      if (event.plannedLaps > 1) {
        html += '<span class="attempt-laps numeric">';
        for (let lapIndex = 0; lapIndex < event.plannedLaps; lapIndex++) {
          const lap = (session.laps || [])[lapIndex];
          html += '<span' + (lap && event.bestLap && event.bestLap.lap === lap ? ' class="best"' : '') + '>' + (lap ? formatTime(lap.time) + (lap.incident ? '<span class="tag failure">!</span>' : '') : '—') + '</span>';
        }
        html += '</span>';
      }
      html += '</div>';
    }
    return html + '</div><div class="note">* Total calculado sumando las vueltas oficiales. ! = vuelta con incidente (choque o retroceso). En gris: sin telemetría.</div></section>';
  }
  // Datos del intento elegido, sobre las pestañas: fecha, total, objetivo, resultado y etiquetas
  function focusInfoHtml(event) {
    const session = focusedSession(event);
    if (!session) return '';
    const isBestSession = event.bestSession === session, hasBestLap = event.bestLap && event.bestLap.session === session;
    return '<b class="numeric">' + escapeHtml((session.date || session.id).slice(0, 16)) + '</b>' +
      '<span class="numeric' + (isBestSession ? ' best' : '') + '">' + (session.total ? formatTime(session.total) + (session.totalCalculated ? '*' : '') : '—') + '</span>' +
      (session.total && session.target ? '<span class="muted">objetivo</span><span class="numeric ' + (session.total <= session.target ? 'gain' : 'loss') + '">' + formatSigned(session.total - session.target) + '</span>' : '') +
      (isBestSession ? '<span class="tag highlight">récord</span>' : '') + (hasBestLap ? '<span class="tag highlight">mejor vuelta</span>' : '') +
      (session.success == null ? ''
        : (session.total > 0 && session.target > 0 && session.total <= session.target) ? '<span class="tag success">nº1 batido</span>'
        : session.success ? '<span class="tag">superado</span>' : '<span class="tag failure">no superado</span>');
  }
  // Pulsar un intento lo elige: la columna del centro y el mapa pasan a mostrar sus datos (en modo simple se suma a los cargados)
  function focusAttempt(event, sessionId) {
    const session = event.sessions.find(item => item.id === sessionId);
    if (!session || !session.telemetryFile) return;
    focusedSessionByEvent[event.id] = session.id;
    const selection = selectedSessions(event);
    if (!isSimpleMode()) selection.clear();
    selection.add(session.id);
    state.pendingFocusSession = session.id;
    document.querySelectorAll('[data-attempt]').forEach(row => {
      row.classList.toggle('focused', row.dataset.attempt === session.id);
      const checkbox = row.querySelector('[data-select-session]');
      if (checkbox) checkbox.checked = selection.has(row.dataset.attempt);
    });
    byId('focusInfo').innerHTML = focusInfoHtml(event);
    loadAnalysis(event);
  }
  // Muestra una pestaña del centro y dibuja lo que necesita tamaño (las gráficas no se pueden dibujar ocultas)
  function showEventTab(name, remember) {
    const panes = [...document.querySelectorAll('[data-pane]')];
    if (!panes.some(pane => pane.dataset.pane === name)) name = 'laps';
    if (remember) { state.eventTab = name; writeStored('swgr.eventTab', name); }
    panes.forEach(pane => pane.classList.toggle('active', pane.dataset.pane === name));
    document.querySelectorAll('[data-tab]').forEach(button => button.setAttribute('aria-pressed', button.dataset.tab === name));
    const event = state.events.find(item => item.id === state.view.id);
    if (name === 'progress' && event) drawProgress(event);
    if (name === 'charts' && state.analysis && state.analysis.event === event) drawAll();
  }
  document.addEventListener('click', clickEvent => {
    const button = clickEvent.target.closest('[data-tab]');
    if (button) showEventTab(button.dataset.tab, true);
  });
  const tile = (label, value, detail) => '<div class="tile"><span class="label">' + label + '</span><span class="value">' + value + '</span><span class="detail">' + (detail || '&nbsp;') + '</span></div>';

  // Saves a game record typed in by hand, an event name or a preference, then reloads the data
  async function saveValue(kind, key, value) {
    try {
      await postJson('/api/save', { kind, key, value: String(value) });
      await refreshData(true);
      showToast('Guardado');
    } catch (error) { showToast('No se pudo guardar: ' + error.message); }
  }

  // Attempts ticked for analysis (by default: the record, the one with the best lap and the latest one)
  const selectedSessionsByEvent = {};
  function selectedSessions(event) {
    if (!selectedSessionsByEvent[event.id]) {
      const selection = new Set();
      const withTelemetry = event.sessions.filter(session => session.telemetryFile);
      if (event.bestSession && event.bestSession.telemetryFile) selection.add(event.bestSession.id);
      if (event.bestLap && event.bestLap.session.telemetryFile) selection.add(event.bestLap.session.id);
      if (withTelemetry.length) selection.add(withTelemetry[withTelemetry.length - 1].id);
      // Attempts holding your best sectors, to build the ideal lap
      for (const best of event.bestSectors || []) if (best && best.session.telemetryFile) selection.add(best.session.id);
      selectedSessionsByEvent[event.id] = selection;
    }
    return selectedSessionsByEvent[event.id];
  }

  function drawProgress(event) {
    const canvas = byId('progressChart');
    const { context, width, height } = fitCanvas(canvas, 110);
    const points = event.completeSessions.map((session, index) => ({ index, value: session.total, session }));
    const referenceTimes = [event.targetSource && event.targetSource.target, event.gameBest.total].filter(Boolean);
    if (!points.length) {
      context.fillStyle = cssVariable('--text-muted'); context.font = '13px ' + cssVariable('--font-body');
      context.fillText('Aquí verás la evolución de tu tiempo total en cada evento completo.', 60, 40); return;
    }
    const values = points.map(point => point.value).concat(referenceTimes);
    let lowest = Math.min(...values), highest = Math.max(...values);
    const padding = Math.max(0.5, (highest - lowest) * 0.12); lowest -= padding; highest += padding;
    const margin = { left: 70, right: 16, top: 12, bottom: 24 };
    const xOf = index => margin.left + (points.length === 1 ? 0.5 : index / (points.length - 1)) * (width - margin.left - margin.right);
    const yOf = value => margin.top + (highest - value) / (highest - lowest) * (height - margin.top - margin.bottom);
    const gridStep = niceStep(highest - lowest, 4);
    context.font = '11px ' + cssVariable('--font-data'); context.fillStyle = cssVariable('--text-muted'); context.strokeStyle = cssVariable('--line'); context.textAlign = 'right'; context.textBaseline = 'middle';
    for (let value = Math.ceil(lowest / gridStep) * gridStep; value <= highest; value += gridStep) {
      const y = Math.round(yOf(value)) + 0.5;
      context.beginPath(); context.moveTo(margin.left, y); context.lineTo(width - margin.right, y); context.stroke();
      context.fillText(formatTime(value), margin.left - 6, y);
    }
    const referenceLine = (value, color, label) => {
      if (!value) return;
      context.strokeStyle = color; context.setLineDash([5, 4]); context.lineWidth = 1.5;
      context.beginPath(); context.moveTo(margin.left, yOf(value)); context.lineTo(width - margin.right, yOf(value)); context.stroke(); context.setLineDash([]);
      context.fillStyle = color; context.textAlign = 'left'; context.fillText(label, margin.left + 6, yOf(value) - 9);
    };
    referenceLine(event.targetSource && event.targetSource.target, cssVariable('--warning'), 'objetivo ' + formatTime(event.targetSource && event.targetSource.target));
    referenceLine(event.gameBest.total, cssVariable('--best'), 'récord del juego');
    const accent = cssVariable('--accent');
    if (points.length > 1) {
      const gradient = context.createLinearGradient(0, margin.top, 0, height - margin.bottom);
      gradient.addColorStop(0, accent + '40'); gradient.addColorStop(1, accent + '00');
      context.fillStyle = gradient;
      context.beginPath(); context.moveTo(xOf(points[0].index), height - margin.bottom);
      points.forEach(point => context.lineTo(xOf(point.index), yOf(point.value)));
      context.lineTo(xOf(points[points.length - 1].index), height - margin.bottom); context.closePath(); context.fill();
    }
    context.save(); context.shadowColor = accent; context.shadowBlur = 10;
    context.strokeStyle = accent; context.lineWidth = 2.2;
    context.beginPath(); points.forEach((point, order) => { order ? context.lineTo(xOf(point.index), yOf(point.value)) : context.moveTo(xOf(point.index), yOf(point.value)); }); context.stroke();
    context.restore();
    points.forEach(point => {
      const isBestSession = point.session === event.bestSession;
      context.fillStyle = isBestSession ? cssVariable('--best') : accent; context.strokeStyle = cssVariable('--background'); context.lineWidth = 2;
      context.beginPath(); context.arc(xOf(point.index), yOf(point.value), isBestSession ? 6 : 4, 0, Math.PI * 2); context.fill(); context.stroke();
    });
    // Labels: your best recorded event and the latest one
    const pointLabel = (point, text, color) => {
      context.font = '600 11px ' + cssVariable('--font-data'); context.fillStyle = color; context.textBaseline = 'bottom';
      const x = xOf(point.index); context.textAlign = x > width - 120 ? 'right' : x < margin.left + 60 ? 'left' : 'center';
      context.fillText(text, x, yOf(point.value) - 9);
    };
    if (event.bestSession) { const bestPoint = points.find(point => point.session === event.bestSession); if (bestPoint) pointLabel(bestPoint, 'mejor ' + formatTime(bestPoint.value), cssVariable('--best')); }
    const lastPoint = points[points.length - 1];
    if (lastPoint && lastPoint.session !== event.bestSession) pointLabel(lastPoint, 'último ' + formatTime(lastPoint.value), cssVariable('--text'));
    context.fillStyle = cssVariable('--text-muted'); context.textAlign = 'center'; context.textBaseline = 'top';
    context.fillText('intentos completos, del más antiguo al más reciente →', (margin.left + width - margin.right) / 2, height - margin.bottom + 6);
  }

  // ---------- Lap analysis (map, difference, speed) ----------
  async function fetchText(path) {
    if (state.fileCache[path]) return state.fileCache[path];
    const text = await (await fetchFromApp('/api/file?path=' + encodeURIComponent(path))).text();
    state.fileCache[path] = text;
    return text;
  }

  // Arranque lanzado: el total y la vuelta oficial de la carrera, para que el análisis empiece en el GO
  // (core.js ya marca las vueltas de esos eventos, también las de antes del cambio)
  function rollingOf(session) {
    const lap = (session.laps || [])[0];
    return lap && lap.rolling && lap.officialLap ? { total: session.total || lap.time, officialLap: lap.officialLap } : null;
  }

  async function loadAnalysis(event) {
    const selection = selectedSessions(event);
    const chosen = event.sessions.filter(session => selection.has(session.id) && session.telemetryFile);
    const loadToken = Symbol();
    state.analysisLoadToken = loadToken;
    byId('readout').textContent = chosen.length ? 'Cargando telemetría…' : 'Marca algún intento en la lista para analizar sus vueltas.';
    if (!chosen.length) { state.analysis = null; drawAll(); byId('lapTable').innerHTML = ''; return; }
    try {
      const route = parseRouteCsv(await fetchText(chosen[chosen.length - 1].routeFile));
      const loaded = [];
      for (const session of chosen) loaded.push({ label: (session.date || session.id).slice(5, 16), samples: parseSessionCsv(await fetchText(session.telemetryFile), vehicleTypeOfEvent(session.event)), session });
      if (state.analysisLoadToken !== loadToken) return;
      const routeLength = route.points[route.points.length - 1][0];
      const analysis = { route, routeLength, lapLength: routeLength, laps: [], track: null, event };
      for (const item of loaded) {
        const result = analyzeSession(route, item.samples, item.label, rollingOf(item.session));
        if (!analysis.track || result.finishCheckpoint !== null) analysis.track = result;
        result.laps.forEach(lap => {

          const official = (item.session.laps || []).find(summaryLap => summaryLap.number === lap.number);
          if (official && official.official && Math.abs(official.time - lap.time) < 1.5) lap.officialTime = official.time;
          analysis.laps.push(lap);
        });
      }
      // On a point-to-point stage the charts go from the start to the finish
      if (analysis.track && analysis.track.isPointToPoint) analysis.lapLength = analysis.track.span;
      const previousA = state.analysis && state.analysis.lapA;
      const sameLap = previous => previous && analysis.laps.find(lap => lap.sessionLabel === previous.sessionLabel && lap.number === previous.number);
      const cleanLaps = analysis.laps.filter(lap => !lap.incident).sort((first, second) => officialLapTime(first) - officialLapTime(second));   // by the game's official time
      analysis.idealLap = buildIdealLap(analysis);
      analysis.idealStartLap = buildIdealLap(analysis, true);
      analysis.idealRace = buildIdealRace(analysis);
      analysis.friendLaps = friendLaps(event, analysis);
      analysis.friendRaces = friendRaces(event, analysis);
      analysis.friendStarts = friendStarts(event, analysis);
      analysis.lapA = sameLap(previousA) || bestOwnLap(analysis, event) || cleanLaps[0] || analysis.laps[0];
      analysis.lapB = null;
      // A es el intento elegido en la lista y B el rival por defecto (el amigo más rápido o tu mejor carrera)
      fitComparison(analysis);

      state.pendingFocusSession = null;
      prepareMap(analysis);
      state.analysis = analysis;
      renderLapTable(); drawAll();

    } catch (error) {

      // its folder, and compresses long sessions): the data is read again, which loads the analysis again
      if (state.analysisLoadToken !== loadToken) return;
      if (!state.analysisRetriedAt || performance.now() - state.analysisRetriedAt > 15000) {
        state.analysisRetriedAt = performance.now(); state.fileCache = {};

      }
      byId('readout').textContent = 'No se pudo cargar la telemetría: ' + error.message;
      showToast('No se pudo cargar la telemetría de tus intentos. Cierra y vuelve a abrir la app; si sigue, guarda log.txt y la carpeta tracks para revisarlo.');
    }
  }

  // Ideal lap: joins the stretch of each best sector (among the loaded attempts), with its trace and
  // its time, to use it as a reference.
  // startLap: the ideal lap 1 of an event of several laps (your best start S1, the rest your best sectors);
  // if not, the ideal flying lap (the start S1 does not count, it is slower).
  // Laps with an incident, or a sector whose trace does not match its time, are left out: their line would jump.
  function buildIdealLap(analysis, startLap) {
    if (!analysis.track) return null;
    const sectorCount = analysis.track.sectorCount;
    const bounds = [0].concat(analysis.track.sectorStarts).concat([analysis.lapLength]);
    const bestSectors = Array(sectorCount).fill(null);
    const severalLaps = analysis.event && analysis.event.plannedLaps > 1;
    if (startLap && !severalLaps) return null;
    for (const lap of analysis.laps) {
      if (!lap.sectors || lap.sectors.length !== sectorCount || lap.incident) continue;
      lap.sectors.forEach((value, sectorIndex) => {
        if (severalLaps && (startLap ? lap.number !== 1 : lap.number === 1)) return;   // laps 1 only in the ideal lap 1, and never in the flying one
        const measured = +(lap.measuredSectors || [])[sectorIndex];
        if (measured > 0 && Math.abs(measured - value) > 0.3) return;
        if (!bestSectors[sectorIndex] || value < bestSectors[sectorIndex].value) bestSectors[sectorIndex] = { value, lap };
      });
    }
    if (bestSectors.some(best => !best)) return null;
    // Each sector keeps its own trace, with its times stretched to its official time: no jumps in time where they join
    const trace = [];
    let elapsed = 0;
    bestSectors.forEach((best, sectorIndex) => {
      const timeByDistance = timeAtDistance(best.lap);
      const startTime = interpolate(timeByDistance.distances, timeByDistance.times, bounds[sectorIndex]);
      const endTime = interpolate(timeByDistance.distances, timeByDistance.times, bounds[sectorIndex + 1]);
      const stretch = endTime > startTime ? best.value / (endTime - startTime) : 1;
      for (const point of best.lap.trace) {

        trace.push({ distance: point.distance, time: elapsed + (interpolate(timeByDistance.distances, timeByDistance.times, point.distance) - startTime) * stretch,
          x: point.x, y: point.y, speed: point.speed });
      }
      elapsed += best.value;
    });
    trace.sort((first, second) => first.distance - second.distance);
    // Where two sectors of different laps join, the two racing lines (and speeds) are blended over 30 m
    const BLEND = 1500;
    for (const point of trace) {
      for (let boundary = 1; boundary < sectorCount; boundary++) {
        const before = bestSectors[boundary - 1].lap, after = bestSectors[boundary].lap, middle = bounds[boundary];
        if (before === after || Math.abs(point.distance - middle) >= BLEND) continue;
        let share = (point.distance - (middle - BLEND)) / (2 * BLEND); share = share * share * (3 - 2 * share);
        const pointBefore = lapPointAtDistance(before, point.distance), pointAfter = lapPointAtDistance(after, point.distance);
        point.x = pointBefore.x + (pointAfter.x - pointBefore.x) * share; point.y = pointBefore.y + (pointAfter.y - pointBefore.y) * share;
        point.speed = pointBefore.speed + (pointAfter.speed - pointBefore.speed) * share;
      }
    }
    return { isIdeal: true, sessionLabel: startLap ? 'Vuelta 1 ideal' : 'Vuelta ideal', number: startLap ? 1 : '', time: elapsed, sectors: bestSectors.map(best => best.value), measuredSectors: bestSectors.map(best => best.value),
      sourceLaps: bestSectors.map(best => best.lap.sessionLabel + ' V' + best.lap.number), trace, incident: false };
  }
  // The ideal race: your ideal lap 1 (with your best start) and then the ideal lap on every other lap
  // Con vueltas de verdad (de los intentos cargados): tu mejor vuelta 1 y tus mejores vueltas lanzadas,
  // una distinta para cada vuelta que queda (si no hay bastantes, se repite la mejor)
  function buildIdealRace(analysis) {
    const plannedLaps = analysis.event && analysis.event.plannedLaps;
    if (!(plannedLaps > 1)) return null;
    const cleanLaps = analysis.laps.filter(lap => !lap.incident && lap.official).sort((first, second) => officialLapTime(first) - officialLapTime(second));
    const startLap = cleanLaps.find(lap => lap.number === 1);
    const flyingLaps = cleanLaps.filter(lap => lap.number !== 1);
    if (!startLap || !flyingLaps.length) return null;
    const race = { laps: [] };
    race.laps.push(Object.assign({}, startLap, { number: 1, time: officialLapTime(startLap), idealRace: race, sessionLabel: 'Carrera ideal' }));
    for (let lapNumber = 2; lapNumber <= plannedLaps; lapNumber++) {
      const lap = flyingLaps[Math.min(lapNumber - 2, flyingLaps.length - 1)];
      race.laps.push(Object.assign({}, lap, { number: lapNumber, time: officialLapTime(lap), idealRace: race, sessionLabel: 'Carrera ideal' }));
    }
    race.total = race.laps.reduce((sum, lap) => sum + lap.time, 0);

  }

  // Simple mode compares your best lap with one rival: a friend, the ideal lap or the best lap of another attempt of yours
  function simpleRivals(analysis) {
    return comparisonCandidates(analysis).filter(item => item.lap && item.lap !== analysis.lapA).map(item => ({ value: item.value, label: item.label, detail: item.detail || item.label, lap: item.lap }));
  }
  function useSimpleComparison(analysis) {

  function fillSimpleRivalPicker() {
    const picker = byId('simpleRival'), analysis = state.analysis;

    picker.innerHTML = rivals.length ? rivals.map(rival => '<option value="' + escapeHtml(rival.value) + '"' + (rival.value === selected ? ' selected' : '') + ' title="' + escapeHtml(rival.detail) + '">' + escapeHtml(rival.label) + '</option>').join('')

  }
  document.addEventListener('change', changeEvent => {
    if (changeEvent.target.id !== 'simpleRival' || !state.analysis || !changeEvent.target.value) return;
    state.simpleRival = changeEvent.target.value;
    useSimpleComparison(state.analysis);
    renderLapTable(); drawAll();
  });

  // Values of the lap pickers and of the table rows: "lap:<index>", "friend:<index>", "ideal", "race:<session id>"
  // "friendrace:<index>:<lap index>" is a lap of a friend's best race (the first lap stands for the whole race)
  const lapValue = (analysis, lap) => lap.isFriendStart ? 'friendstart:' + analysis.friendStarts.indexOf(lap) : lap.idealRace ? 'idealrace' : lap === analysis.idealStartLap ? 'idealstart' : lap === analysis.idealLap ? 'ideal' : lap.friendRace ? 'friendrace:' + analysis.friendRaces.indexOf(lap.friendRace) + ':' + lap.friendRace.laps.indexOf(lap)

    if (kind === 'friendrace') { const race = (analysis.friendRaces || [])[+index]; return race ? race.laps[+lapIndex || 0] || null : null; }
    return kind === 'friend' ? analysis.friendLaps[+index] : kind === 'lap' ? analysis.laps[+index] : null;
  }
  function renderLapTable() {
    if (state.replay) { stopReplay(true); if (byId('replayGap')) byId('replayGap').textContent = ''; }
    const analysis = state.analysis, event = analysis.event;
    const sectorCount = analysis.track ? analysis.track.sectorCount : 1;
    const selectionClasses = lap => (lap === analysis.lapA ? ' selected-a' : '') + (lap === analysis.lapB ? ' selected-b' : '');
    let html = '<thead><tr><th>Vuelta</th><th>Tiempo</th>';
    for (let sectorNumber = 1; sectorNumber <= sectorCount; sectorNumber++) html += '<th>S' + sectorNumber + '</th>';
    html += '<th></th></tr></thead><tbody>';
    if (analysis.idealLap) {
      const lap = analysis.idealLap;
      html += '<tr class="clickable ideal-row' + selectionClasses(lap) + '" data-lap="ideal"><td class="text"><b class="best">Vuelta ideal</b> <span class="muted" title="' + escapeHtml(lap.sourceLaps.join(' · ')) + '">mejores sectores</span></td>' +
        '<td class="best">' + formatTime(lap.time) + '</td>' + lap.sectors.map((value, sectorIndex) => '<td class="best" title="' + escapeHtml(lap.sourceLaps[sectorIndex]) + '">' + value.toFixed(3) + '</td>').join('') +
        '<td><button class="button small" data-reference="ideal">B</button></td></tr>';
    }
    (analysis.friendLaps || []).forEach(lap => {
      const value = lapValue(analysis, lap);
      html += '<tr class="clickable friend-row' + selectionClasses(lap) + '" data-lap="' + value + '"><td class="text"><b>' + escapeHtml(lap.pilot) + '</b> <span class="muted">su mejor vuelta</span></td>' +
        '<td>' + formatTime(officialLapTime(lap)) + '</td>';
      for (let sectorIndex = 0; sectorIndex < sectorCount; sectorIndex++) { const sector = (lap.sectors || [])[sectorIndex]; html += '<td>' + (sector > 0 ? (+sector).toFixed(3) : '—') + '</td>'; }
      html += '<td><button class="button small" data-reference="' + value + '">B</button></td></tr>';
    });
    // Laps grouped by attempt; open are the ones holding A, the reference or your best lap
    state.openLapGroups = state.openLapGroups || {};
    const groups = [];
    analysis.laps.forEach(lap => {
      let group = groups[groups.length - 1];
      if (!group || group.label !== lap.sessionLabel) { group = { label: lap.sessionLabel, laps: [] }; groups.push(group); }
      group.laps.push(lap);
    });
    groups.forEach((group, groupIndex) => {
      const key = event.id + '|' + group.label;
      const holdsSelection = group.laps.some(lap => lap === analysis.lapA || lap === analysis.lapB || (event.bestLap && Math.abs(officialLapTime(lap) - event.bestLap.lap.time) < 0.01));
      const open = state.openLapGroups[key] ?? holdsSelection;
      const fastest = group.laps.reduce((best, lap) => (!best || officialLapTime(lap) < officialLapTime(best) ? lap : best), null);
      html += '<tr class="group-row' + (open ? ' open' : '') + '" data-group="' + groupIndex + '" data-group-key="' + escapeHtml(key) + '"><td class="text" colspan="' + (sectorCount + 3) + '"><span class="chevron" aria-hidden="true">▸</span><b>' + escapeHtml(group.label) + '</b>' +
        '<span class="muted"> · ' + group.laps.length + (group.laps.length === 1 ? ' vuelta' : ' vueltas') + ' · mejor <span class="numeric">' + formatTime(officialLapTime(fastest)) + '</span></span></td></tr>';
      group.laps.forEach(lap => {
        const value = lapValue(analysis, lap);
        const isStartLap = event.plannedLaps > 1 && lap.number === 1;
        html += '<tr class="clickable lap-row' + selectionClasses(lap) + '" data-lap="' + value + '" data-in-group="' + groupIndex + '"' + (open ? '' : ' hidden') + '><td class="text">V' + lap.number +
          (isStartLap ? '<span class="tag" title="Vuelta de salida: su S1 se compara solo con otras salidas">salida</span>' : '') + (lap.incident ? '<span class="tag failure">incidente</span>' : '') + '</td>';
        html += '<td class="' + (event.bestLap && Math.abs(officialLapTime(lap) - event.bestLap.lap.time) < 0.01 ? 'best' : '') + '">' + formatTime(officialLapTime(lap)) + '</td>';
        const sectors = lap.sectors || lap.measuredSectors;
        for (let sectorIndex = 0; sectorIndex < sectorCount; sectorIndex++) {
          const sector = sectors[sectorIndex];
          const best = isStartLap && sectorIndex === 0 ? event.bestStartSector : event.bestSectors[sectorIndex];
          const isBestSector = lap.sectors && best && sector != null && Math.abs(sector - best.value) < 0.01;
          html += '<td class="' + (isBestSector ? 'best' : '') + '">' + (sector != null ? sector.toFixed(3) : '—') + '</td>';
        }
        html += '<td><button class="button small" data-reference="' + value + '">B</button></td></tr>';
      });
    });
    byId('lapTable').innerHTML = html + '</tbody>';
    fillComparisonPickers(); fillSimpleRivalPicker(); fillReplayScopes(); renderSectorComparison();
    updateVersusBar();
    byId('lapTable').onclick = clickEvent => {
      const groupRow = clickEvent.target.closest('tr.group-row');
      if (groupRow) {
        const open = !groupRow.classList.contains('open');
        groupRow.classList.toggle('open', open); state.openLapGroups[groupRow.dataset.groupKey] = open;
        byId('lapTable').querySelectorAll('tr[data-in-group="' + groupRow.dataset.group + '"]').forEach(row => { row.hidden = !open; });
        return;
      }
      const referenceButton = clickEvent.target.closest('[data-reference]');
      // The table holds laps: picking one there compares laps (or the sector being compared)
      const pickedRow = referenceButton || clickEvent.target.closest('tr[data-lap]');
      if (pickedRow) {
        const picked = lapFromValue(analysis, (referenceButton ? referenceButton.dataset.reference : pickedRow.dataset.lap));
        const pickedNumber = +picked.number, severalLaps = severalLapsEvent(analysis);
        const wantedKind = !severalLaps ? (comparisonKind() === 'sector' ? state.replay.scope : 'lap')
          : comparisonKind() === 'sector' ? state.replay.scope
          : pickedNumber >= 1 && !picked.isIdeal ? (pickedNumber === 1 ? 'start' : 'L' + pickedNumber) : comparisonKind() === 'race' ? 'start' : state.replay.scope;
        if (wantedKind !== state.replay.scope) {
          state.replay.scope = wantedKind; state.replay.segment = null;
          if (referenceButton) { analysis.lapB = picked; fitComparison(analysis); if (picked !== analysis.lapA) analysis.lapB = picked; }
          else { analysis.lapA = picked; fitComparison(analysis); analysis.lapA = picked; if (analysis.lapB === picked) analysis.lapB = null; }
          renderLapTable(); drawAll(); return;
        }
      }
      if (referenceButton) { const lap = lapFromValue(analysis, referenceButton.dataset.reference); if (lap !== analysis.lapA) analysis.lapB = lap; renderLapTable(); drawAll(); return; }
      const row = clickEvent.target.closest('tr[data-lap]');
      if (!row) return;
      const lap = lapFromValue(analysis, row.dataset.lap);
      if (lap === analysis.lapB) analysis.lapB = analysis.lapA;
      analysis.lapA = lap; renderLapTable(); drawAll();

  }

  function fitCanvas(canvas, cssHeight) {
    const box = canvas.getBoundingClientRect();
    const pixelRatio = window.devicePixelRatio || 1;
    const width = Math.max(10, box.width), height = cssHeight || Math.max(10, box.height);
    if (cssHeight) canvas.style.height = cssHeight + 'px';
    canvas.width = Math.round(width * pixelRatio); canvas.height = Math.round(height * pixelRatio);

    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);

  // A round grid step (1, 2, 2.5 or 5 times a power of ten) giving about `divisions` lines over `span`

    for (const multiple of [1, 2, 2.5, 5, 10]) if (rawStep <= multiple * powerOfTen) return multiple * powerOfTen;
    return 10 * powerOfTen;

    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const include = (x, y) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); };
    analysis.route.points.forEach(point => include(point[1], point[2]));
    analysis.laps.forEach(lap => lap.trace.forEach(point => include(point.x, point.y)));
    analysis.bounds = { minX, maxX, minY, maxY };
  }
  // Position on the route's spline at a distance along it
  function routePointAt(analysis, routeDistance) {
    const points = analysis.route.points, length = analysis.routeLength;
    routeDistance = ((routeDistance % length) + length) % length;
    let low = 0, high = points.length - 1;
    while (high - low > 1) { const middle = (low + high) >> 1; if (points[middle][0] <= routeDistance) low = middle; else high = middle; }
    const fraction = (routeDistance - points[low][0]) / (points[high][0] - points[low][0] || 1);
    return [points[low][1] + fraction * (points[high][1] - points[low][1]), points[low][2] + fraction * (points[high][2] - points[low][2])];
  }
  // A lap distance (from the finish line, or from the start of a point-to-point stage) as a distance along the route's spline
  function lapDistanceToRouteDistance(analysis, lapDistance) {
    const length = analysis.routeLength, origin = analysis.track.isPointToPoint ? analysis.track.originDistance : analysis.track.finishDistance;
    const distanceDriven = ((origin + lapDistance) % length + length) % length;
    return analysis.track.direction === 1 ? distanceDriven : length - distanceDriven;
  }
  function lapPointAtDistance(lap, distance) {

    const before = trace[index - 1], after = trace[index], fraction = (distance - before.distance) / ((after.distance - before.distance) || 1);
    return { x: before.x + fraction * (after.x - before.x), y: before.y + fraction * (after.y - before.y), speed: before.speed + fraction * (after.speed - before.speed) };

  }
  // Replay: a sector, the lap or the whole race; in real time or with both cars at the same point
  state.replay = { time: null, playing: false, lastFrame: 0, animationFrame: 0, scope: 'lap', sync: 'realTime', followCar: false, segment: null };
  const referenceName = lap => !lap ? 'B' : lap.isIdeal ? 'ideal' : lap.isFriend ? lap.pilot : 'B';
  function sectorBounds(analysis) { return analysis.track ? [0].concat(analysis.track.sectorStarts).concat([analysis.lapLength]) : [0, analysis.lapLength]; }
  // A stretch of a lap, with the time set to zero when it enters it
  function sliceLap(lap, startDistance, endDistance) {

    const trace = lap.trace.filter(point => point.distance >= startDistance && point.distance <= endDistance)

  // The rival of a whole race: another attempt of yours with the same laps or, if not, the reference repeated on every lap
  function raceRival(analysis, lapA, lapB) {

  // ---------- What is compared: always like with like ----------
  // The scope is state.replay.scope: 'race' (whole race), 'start' (lap 1), 'L2'… (lap 2…), 'lap' (the only lap of a one-lap event)
  // or a sector ('S1'…, only from the tables). A and B are of that kind: the same lap (or sector) of two races, or two whole races.

  // Novedades: la versión actual a la vista; todas las demás, plegadas dentro de «Versiones anteriores»
  function changelogEntry(entry, open) {
    const title = entry.version === 'Antes' ? 'Primeras versiones' : /^\d/.test(entry.version) ? 'Versión ' + escapeHtml(entry.version) + ' <span class="muted">app y mod</span>' : 'Antes: ' + escapeHtml(entry.version);
    return '<details' + (open ? ' open' : '') + '><summary>' + title + '</summary><ul>' +
      entry.items.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul></details>';
  }
  function changelogHtml() {
    const [current, ...older] = CHANGELOG;
    return (current ? changelogEntry(current, true) : '') +
      (older.length ? '<details class="older-versions"><summary>Versiones anteriores</summary>' + older.map(entry => changelogEntry(entry, false)).join('') + '</details>' : '');
  }

  const RACE_PANEL_ROWS = [['live_difference', 'Diferencia en vivo'], ['sector_bars', 'Barras de sectores'], ['last_lap', 'Última vuelta'], ['best_lap', 'Mejor vuelta'],
    ['ideal_lap', 'Vuelta ideal'], ['speeds', 'Velocidades'], ['event_total', 'Total'], ['forecast', 'Previsto'], ['target', 'Objetivo']];
  // Lo que pone el mod si el archivo no dice nada (timing_panel.lua)
  const RACE_PANEL_DEFAULTS = { enabled: 'true', style: 'compact', x: '0.045', y: '0.265', scale: '1.15', opacity: '0.20', compare_with: 'best',

  state.racePanel = null;

  const racePanelValue = key => (state.racePanel && state.racePanel[key] !== undefined && state.racePanel[key] !== '' ? state.racePanel[key] : RACE_PANEL_DEFAULTS[key]);
  const racePanelOn = key => racePanelValue(key) !== 'false';
  // La paleta de partida: la del estilo (el estilo «current» de antes era la gris)
  const racePanelBasePalette = () => RACE_PANEL_PALETTES[racePanelValue('style') === 'current' ? 'gray' : 'sith'];
  function racePanelColor(key) {
    const entry = RACE_PANEL_COLORS.find(item => item[0] === key);
    const chosen = state.racePanel && state.racePanel[entry[2]];
    return chosen || racePanelBasePalette()[key];

  // Lee el archivo y prepara los controles
  async function loadRacePanel() {
    if (!byId('racePanelScreen')) return;
    try { state.racePanel = (await (await fetchFromApp('/api/timing-panel')).json()).values || {}; } catch (error) { state.racePanel = {}; }
    wireRacePanel();
    drawRacePanel();
  }
  // Guarda unos cambios (y los aplica ya a la muestra)
  function saveRacePanel(changes) {
    Object.assign(state.racePanel, changes);
    drawRacePanel();
    clearTimeout(state.racePanelSaveTimer);
    state.racePanelSaveTimer = setTimeout(async () => {
      const pending = state.racePanelPending || {}; state.racePanelPending = {};
      try {
        const response = await postJson('/api/timing-panel', { values: pending });
        if (!response.ok) throw new Error(await response.text());
        if (!state.racePanelSavedNotice) { state.racePanelSavedNotice = true; showToast('Panel guardado: se aplica en la siguiente carrera'); }
      } catch (error) { showToast('No se pudo guardar el panel: ' + error.message); }
    }, 350);
    state.racePanelPending = Object.assign(state.racePanelPending || {}, changes);
  }

  function wireRacePanel() {
    document.querySelectorAll('[data-race-panel-place]').forEach(button => button.addEventListener('click', () => {
      const [x, y] = button.dataset.racePanelPlace.split(',');
      saveRacePanel({ x, y });
    }));
    document.querySelectorAll('[data-race-panel-key] button').forEach(button => button.addEventListener('click', () => {
      saveRacePanel({ [button.parentElement.dataset.racePanelKey]: button.dataset.value });
    }));
    document.querySelectorAll('[data-race-panel-toggle]').forEach(button => button.addEventListener('click', () => {
      const key = button.dataset.racePanelToggle;
      saveRacePanel({ [key]: racePanelOn(key) ? 'false' : 'true' });
    }));
    document.querySelectorAll('[data-race-panel-palette]').forEach(button => button.addEventListener('click', () => {
      const palette = RACE_PANEL_PALETTES[button.dataset.racePanelPalette], changes = {};
      RACE_PANEL_COLORS.forEach(([key, , fileKey]) => { changes[fileKey] = palette[key]; });
      saveRacePanel(changes);
    }));
    document.querySelectorAll('[data-race-panel-color]').forEach(input => input.addEventListener('input', () => {
      const entry = RACE_PANEL_COLORS.find(item => item[0] === input.dataset.racePanelColor);
      saveRacePanel({ [entry[2]]: input.value });
    }));
    const slider = (id, key, digits) => byId(id).addEventListener('input', event => saveRacePanel({ [key]: (+event.target.value).toFixed(digits) }));
    slider('racePanelScale', 'scale', 2); slider('racePanelOpacity', 'opacity', 2);
    // Arrastrar el panel por la pantalla de muestra
    const preview = byId('racePanelPreview');
    preview.addEventListener('pointerdown', down => {
      const zoom = state.racePanelZoom || 1, layout = racePanelLayout(), scale = +racePanelValue('scale');
      const panelWidth = layout.width * scale, panelHeight = preview.offsetHeight * scale;
      const startLeft = preview.offsetLeft, startTop = preview.offsetTop;
      preview.setPointerCapture(down.pointerId);
      const move = event => {
        const left = Math.max(0, Math.min(RACE_PANEL_SCREEN.width - panelWidth, startLeft + (event.clientX - down.clientX) / zoom));
        const top = Math.max(0, Math.min(RACE_PANEL_SCREEN.height - panelHeight, startTop + (event.clientY - down.clientY) / zoom));
        state.racePanel.x = (left / Math.max(1, RACE_PANEL_SCREEN.width - panelWidth)).toFixed(3);
        state.racePanel.y = (top / Math.max(1, RACE_PANEL_SCREEN.height - panelHeight)).toFixed(3);
        drawRacePanel();
      };
      const up = () => {
        preview.removeEventListener('pointermove', move); preview.removeEventListener('pointerup', up);
        saveRacePanel({ x: state.racePanel.x, y: state.racePanel.y });
      };
      preview.addEventListener('pointermove', move); preview.addEventListener('pointerup', up);
    });
    if (!state.racePanelResizeWired) { state.racePanelResizeWired = true; window.addEventListener('resize', () => { if (byId('racePanelScreen')) drawRacePanel(); }); }
  }

  // La muestra: un panel parecido al del juego, con los colores, filas y medidas elegidos
  function drawRacePanel() {
    const screen = byId('racePanelScreen'), stage = byId('racePanelStage'), preview = byId('racePanelPreview');
    if (!screen || !state.racePanel) return;
    const layout = racePanelLayout(), compact = racePanelValue('style') === 'compact', color = racePanelColor;

    if (!pilot) { showMessage('<span class="loss">Antes crea tu perfil: </span><a data-navigate="profile" href="#">ponte un nombre de piloto</a>.'); return; }
    const events = state.events.filter(event => event.recordTime || event.bestLap);
    // Events with only the record imported from the game: their time goes too, for the friends' standings
    const withTelemetryIds = new Set(state.events.map(event => event.id));
    const recordsOnly = Object.keys(state.data.gameRecords || {}).filter(id => !withTelemetryIds.has(id)).map(id => ({ id, gameRecord: gameRecordOf(state.data, id) })).filter(item => item.gameRecord);
    if (!events.length && !recordsOnly.length) { showMessage('Aún no tienes tiempos que exportar.'); return; }
    byId('pilotExport').disabled = true;
    const file = { format: 'swgr-pilot', version: 2, pilot, color: myPilotColor(), date: new Date().toISOString().slice(0, 16).replace('T', ' '), app: state.data.version, events: {} };
    let prepared = 0, withLap = 0, withRace = 0, timeOnly = recordsOnly.length;
    const cache = {};
    for (const event of events) {
      showMessage('Preparando ' + (++prepared) + ' de ' + events.length + ': ' + escapeHtml(event.shortTitle || event.title) + '…');
      const gameRecord = gameRecordOf(state.data, event.id);
      const result = { name: event.title, planet: event.planet || '', vehicle: vehicleOf(event.id), plannedLaps: event.plannedLaps || null, total: roundToMilliseconds(event.recordTime),
        bestLap: event.plannedLaps === 1 ? roundToMilliseconds(Math.min(...[event.recordTime, event.bestLap && event.bestLap.lap.time].filter(value => value > 0))) : event.bestLap ? roundToMilliseconds(event.bestLap.lap.time) : null,
        sectors: event.bestSectors.map(best => (best ? roundToMilliseconds(best.value) : null)), startSector: event.bestStartSector ? roundToMilliseconds(event.bestStartSector.value) : null,
        idealLap: roundToMilliseconds(event.idealLap), date: event.bestSession ? String(event.bestSession.date || '').slice(0, 16) : '',

        timeFrom: event.gameBest.total && event.recordTime === event.gameBest.total ? 'game' : 'mod' };
      if (!result.date && gameRecord) result.date = gameRecord.date;
      try { result.bestLapTelemetry = await bestLapForExport(event, cache); if (result.bestLapTelemetry) withLap++; } catch (error) { result.bestLapTelemetry = null; }
      try { result.bestRaceTelemetry = await bestRaceForExport(event, cache); if (result.bestRaceTelemetry) withRace++; } catch (error) { result.bestRaceTelemetry = null; }
      try { result.bestStartTelemetry = await bestStartForExport(event, cache); } catch (error) { result.bestStartTelemetry = null; }
      if (!result.bestLapTelemetry && !result.bestRaceTelemetry) timeOnly++;
      for (const sessionId of Object.keys(cache)) delete cache[sessionId];   // the next event uses other attempts
      file.events[event.id] = result;
    }
    for (const { id, gameRecord } of recordsOnly) {
      const titles = eventTitles(state.data, id, gameRecord);
      file.events[id] = { name: titles.title, planet: titles.planet || '', vehicle: vehicleOf(id), plannedLaps: null, total: roundToMilliseconds(gameRecord.total), bestLap: null, sectors: [], startSector: null,
        idealLap: null, date: gameRecord.date || '', attempts: gameRecord.attempts || 0, targetTime: gameRecord.target > 0 ? roundToMilliseconds(gameRecord.target) : null, timeFrom: 'game',
        bestLapTelemetry: null, bestRaceTelemetry: null, bestStartTelemetry: null };
    }
    try {
      const response = await postJson('/api/export-pilot', file);
      const { path } = await response.json();
      const eventCount = events.length + recordsOnly.length;
      showMessage('<b>Listo:</b> ' + eventCount + (eventCount === 1 ? ' evento' : ' eventos') + ' (' + withRace + ' con la carrera entera, ' + withLap + ' con la mejor vuelta, ' +
        timeOnly + ' solo con el tiempo) en <span class="numeric">' + escapeHtml(path) + '</span>. Te he abierto la carpeta: pásaselo a tus amigos.');
    } catch (error) { showMessage('<span class="loss">No se pudo guardar: ' + escapeHtml(error.message) + '</span>'); }
    byId('pilotExport').disabled = false;
  }
  async function importPilotFiles(fileList) {

    const added = [], failed = [];
    for (const file of files) {
      try {
        const response = await fetchFromApp('/api/add-friend', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: await file.text() });
        added.push((await response.json()).pilot);
      } catch (error) { failed.push(file.name + ': ' + error.message.trim()); }
    }
    if (added.length) showToast('Añadido: ' + added.join(', '));
    if (failed.length) showToast('No se pudo añadir ' + failed.join(' · '));

  }

  // ---------- Social: your times against all your friends' ----------
  // Friends from the best to the worst: their average position (from 0 to 1) in the events they have
  function friendRanking() {
    const friends = friendPilots(), scores = {};
    const eventIds = new Set(); friends.forEach(friend => Object.keys(friend.events).forEach(eventId => eventIds.add(eventId)));
    eventIds.forEach(eventId => {
      const rows = standings(eventId, state.events.find(event => event.id === eventId)).filter(row => row.total);
      rows.forEach((row, position) => {
        if (row.isMe) return;
        const score = (scores[row.pilot] ||= { sum: 0, count: 0 });
        score.sum += rows.length > 1 ? position / (rows.length - 1) : 0; score.count++;
      });
    });
    const averagePosition = friend => (scores[friend.pilot] ? scores[friend.pilot].sum / scores[friend.pilot].count : 9);
    return friends.slice().sort((first, second) => averagePosition(first) - averagePosition(second));
  }
  state.versusPilot = readStored('swgr.versusPilot', '');
  function socialRows(friends) {
    const eventIds = new Set(Object.keys(state.data.gameRecords || {}));
    friends.forEach(friend => Object.keys(friend.events).forEach(eventId => eventIds.add(eventId)));
    state.events.forEach(event => eventIds.add(event.id));
    return [...eventIds].map(eventId => {
      const event = state.events.find(item => item.id === eventId);
      const rows = standings(eventId, event).filter(row => row.total);
      const friendResult = friends.map(friend => friend.events[eventId]).find(Boolean) || {}, gameRecord = gameRecordOf(state.data, eventId);
      const titles = eventTitles(state.data, eventId, gameRecord);
      return { eventId, event, rows, title: event ? (event.shortTitle || event.title) : (titles.shortTitle || titles.title || friendResult.name || describeEventCode(eventId)),
        planet: event ? event.planet : (titles.planet || friendResult.planet || '') };

  }
  // What a friend's file brings: events, and how many with the whole race or the best lap
  function friendFileContents(friend) {
    const results = Object.values(friend.events || {}).filter(Boolean);
    const races = results.filter(result => result.bestRaceTelemetry && Array.isArray(result.bestRaceTelemetry.laps)).length;
    const laps = results.filter(result => result.bestLapTelemetry && Array.isArray(result.bestLapTelemetry.trace)).length;
    return results.length + (results.length === 1 ? ' evento' : ' eventos') + (races ? ' · ' + races + ' con carrera entera' : '') + ' · ' + laps + ' con vuelta';
  }
  function renderSocial() {
    const friends = friendRanking();

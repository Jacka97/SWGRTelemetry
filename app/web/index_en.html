    byId('main').innerHTML = html;

    if (byId('gameRecordSave')) byId('gameRecordSave').onclick = async () => {
      const total = parseTime(byId('gameTotalInput').value), lap = parseTime(byId('gameLapInput').value);
      if (Number.isNaN(total) || Number.isNaN(lap)) { byId('gameRecordMessage').innerHTML = '<span class="loss">Use the format 1:21.500 or 19.800</span>'; return; }
      await saveValue('manualGameRecord', event.id, total || lap ? (total || '') + '|' + (lap || '') : '');
    };
    document.querySelectorAll('[data-select-session]').forEach(checkbox => checkbox.addEventListener('change', () => {
      const selection = selectedSessions(event);
      if (checkbox.checked) selection.add(checkbox.dataset.selectSession); else selection.delete(checkbox.dataset.selectSession);
      loadAnalysis(event);
    }));
    document.querySelectorAll('[data-compare-friend]').forEach(button => button.addEventListener('click', () => compareWithFriend(button.dataset.compareFriend, false)));
    document.querySelectorAll('[data-compare-friend-race]').forEach(button => button.addEventListener('click', () => compareWithFriend(button.dataset.compareFriendRace, true)));
    document.querySelectorAll('[data-attempt]').forEach(row => row.addEventListener('click', clickEvent => {
      if (!clickEvent.target.closest('input')) focusAttempt(event, row.dataset.attempt);
    }));
    byId('sectorTableTitle').textContent = 'Sector by sector';
    byId('chartsTitle').textContent = 'Gap and speed along the lap';
    // Al abrir un evento se compara la carrera entera
    if (state.replay.eventId !== event.id) { state.replay.eventId = event.id; state.replay.scope = event.plannedLaps > 1 ? 'race' : 'lap'; state.replay.lapScope = null; }
    showEventTab(state.eventTab, false);
    state.analysisLoading = loadAnalysis(event);
  }
  // Franja de resumen: tu récord contra el objetivo nº1, el total ideal y las medias
  function summaryHtml(event) {
    const targetSource = event.targetSource, recordTime = event.recordTime;
    const gap = targetSource && recordTime ? recordTime - targetSource.target : null;
    const fromGame = event.gameBest.total && recordTime === event.gameBest.total;
    const source = !recordTime ? 'no completed event yet'
      : fromGame ? 'game record' + (event.gameRecord && event.gameRecord.attempts ? ' · ' + event.gameRecord.attempts + ' attempts' : '')
      : 'with the mod · ' + escapeHtml((event.bestSession && event.bestSession.date || '').slice(0, 10));
    const item = (label, value, detail, extraClass) => '<div class="strip-item' + (extraClass ? ' ' + extraClass : '') + '"><span class="label">' + label + '</span><span class="strip-value numeric">' + value +
      '</span><span class="detail">' + (detail || '&nbsp;') + '</span></div>';
    let html = '<section class="summary-strip">' + item('Your record', formatTime(recordTime), source, 'strip-record');
    if (targetSource) {
      html += item('#1 target · ' + escapeHtml(targetSource.targetPlayer || ''), formatTime(targetSource.target),
        gap == null ? '' : gap <= 0 ? '<span class="pill success">#1 beaten · ' + formatSigned(gap) + '</span>' : '<span class="pill failure">' + gap.toFixed(3) + ' s off #1</span>');
    }
    html += item('Ideal total', formatTime(event.idealTotal), event.idealTotal && recordTime
      ? 'vs your record <span class="' + (event.idealTotal <= recordTime ? 'gain' : 'loss') + '">' + formatSigned(event.idealTotal - recordTime) + '</span>'
      : (event.plannedLaps > 1 ? 'ideal lap 1 + ideal lap for the rest' : 'ideal lap'));
    const recentTotals = event.completeSessions.slice(-5).map(session => session.total);
    if (recentTotals.length >= 2) html += item('Avg of last ' + recentTotals.length, formatTime(recentTotals.reduce((sum, total) => sum + total, 0) / recentTotals.length));
    html += item(event.plannedLaps === 1 ? 'Best run with the mod' : 'Best lap', event.bestLap ? formatTime(event.bestLap.lap.time) : '—',
      event.bestLap ? 'recorded ' + escapeHtml((event.bestLap.session.date || '').slice(0, 10)) : 'no official laps', 'tryhard-only');
    html += item('Ideal lap', formatTime(event.idealLap), event.idealLap && event.bestLap ? 'margin ' + (event.bestLap.lap.time - event.idealLap).toFixed(3) + ' s off your best' : 'sum of your best sectors', 'tryhard-only');
    html += item('Consistency', event.recentAverageLap ? formatTime(event.recentAverageLap) : '—',
      event.recentAverageLap && event.bestLap ? 'last 10 avg · ' + formatSigned(event.recentAverageLap - event.bestLap.lap.time) + ' vs your best' : 'average of your last 10 laps', 'tryhard-only');
    if (!event.gameRecord) html += '<div class="strip-item strip-game tryhard-only"><span class="label">Game record (manual)</span>' +
      '<label class="detail" for="gameTotalInput">Total</label><input id="gameTotalInput" placeholder="1:21.500" value="' + (event.gameBest.total ? formatTime(event.gameBest.total) : '') + '">' +
      '<label class="detail" for="gameLapInput">Best lap</label><input id="gameLapInput" placeholder="19.800" value="' + (event.gameBest.lap ? formatTime(event.gameBest.lap) : '') + '">' +
      '<button class="button small" id="gameRecordSave">Save</button><span class="detail" id="gameRecordMessage">Your times from before the mod</span></div>';
    return html + '</section>';
  }
  // Dónde pierdes tiempo: una tabla por sector con la pérdida media y tu mejor tiempo
  function lossHtml(event) {
    const rows = event.sectorLosses.rows.slice().sort((first, second) => second.loss - first.loss);
    const worstSectors = rows.slice(0, 2).filter(row => row.loss > 0.01);
    const possibleGain = worstSectors.reduce((sum, row) => sum + row.loss, 0);
    let html = '';
    if (worstSectors.length) html += '<p class="loss-lead">Match your best ' + worstSectors.map(row => 'S' + (row.sectorIndex + 1)).join(' and ') + ' and you gain <b class="numeric">' + possibleGain.toFixed(3) +
        ' s</b> per lap' + (event.plannedLaps > 1 ? ' (<b class="numeric">' + worstSectors.reduce((sum, row) => sum + row.loss * (row.sectorIndex === 0 ? event.plannedLaps - 1 : event.plannedLaps), 0).toFixed(2) + ' s</b> over the event)' : '') + '.</p>';
    html += '<table class="loss-table"><thead><tr><th>Sector</th><th>Loss</th><th>Your best</th><th>In your best lap</th></tr></thead><tbody>';
    for (const row of rows) {
      html += '<tr><td class="loss-sector">S' + (row.sectorIndex + 1) + '</td><td class="loss">+' + row.loss.toFixed(3) + '</td><td>' + row.best.toFixed(3) + '</td><td>' +
        (row.lossInBestLap != null ? (row.lossInBestLap < 0.0005 ? '<span class="best">same</span>' : '+' + row.lossInBestLap.toFixed(3)) : '—') + '</td></tr>';
    }
    html += '</tbody></table>';
    html += '<div class="note">average of your last ' + event.sectorLosses.count + (event.plannedLaps > 1 ? ' clean laps' : ' clean runs') + ' vs your best time in each sector' + (event.plannedLaps > 1 ? ' · the start S1 is counted separately' : '') + '</div>';
    if (event.startSectorLoss) {
      const startLoss = event.startSectorLoss;
      html += '<p class="loss-start"><span class="tag">start</span> Lap 1 S1 (you start slower) is only compared with your other starts: your best is <b class="numeric">' +
        startLoss.best.toFixed(3) + '</b> and on average over your last ' + startLoss.count + ' you lose <b class="numeric loss">+' + Math.max(0, startLoss.averageLoss).toFixed(3) + '</b>.</p>';
    }
    return html;
  }

  // Intento elegido en la lista: el que se analiza (por defecto, el del mejor total)
  function focusedSession(event) {
    const chosen = event.sessions.find(session => session.id === focusedSessionByEvent[event.id] && session.telemetryFile);
    if (chosen) return chosen;
    if (event.bestSession && event.bestSession.telemetryFile) return event.bestSession;
    return event.sessions.filter(session => session.telemetryFile).pop() || null;
  }
  // Lista compacta de intentos: fecha, total y tiempos de vuelta; pulsar uno lo elige y la casilla suma otros al análisis
  // Columna izquierda: en modo simple, Intentos y Amigos son pestañas del mismo panel
  state.simpleLeftTab = 'attempts';
  function leftPanelHtml(event) {
    const friends = friendsPanel(event, true), showFriends = friends && state.simpleLeftTab === 'friends';
    if (!friends) return attemptsHtml(event);
    const tab = (name, label, pressed) => '<button type="button" data-left-tab-button="' + name + '" aria-pressed="' + pressed + '">' + label + '</button>';
    const tabs = '<div class="tab-bar simple-only">' + tab('attempts', 'Attempts', !showFriends) + tab('friends', 'Friends', !!showFriends) + '</div>';
    return attemptsHtml(event).replace('class="panel attempts-panel"', showFriends ? 'class="panel attempts-panel showing-friends"' : 'class="panel attempts-panel"')
      .replace('<div class="attempt-list">', tabs + '<div class="attempt-list">').replace('<div class="note">', '<div class="simple-friends simple-only">' + friends + '</div><div class="note">');
  }
  document.addEventListener('click', clickEvent => {
    const button = clickEvent.target.closest('[data-left-tab-button]');
    if (!button) return;
    state.simpleLeftTab = button.dataset.leftTabButton;
    button.closest('.attempts-panel').classList.toggle('showing-friends', state.simpleLeftTab === 'friends');
    button.parentElement.querySelectorAll('[data-left-tab-button]').forEach(item => item.setAttribute('aria-pressed', item === button));
  });
  function attemptsHtml(event) {
    const selected = selectedSessions(event), focused = focusedSession(event);
    let html = '<section class="panel attempts-panel"><div class="panel-header"><h2>Attempts</h2><span class="muted" title="Click an attempt to see its data and tick the box to add others to the analysis. Telemetry is kept for the last ' + state.data.attemptsToKeep +
      ' per event; your best total and best lap are always kept.">Click one to analyse it</span></div><div class="attempt-list">';
    if (!event.completeSessions.length) html += '<p class="muted">No complete races in this event yet</p>';
    for (const session of event.completeSessions.slice().reverse()) {
      const isBestSession = event.bestSession === session;
      const explanation = [session.eventGuessed ? 'recorded before events were identified' : '', session.telemetryFile ? '' : 'its telemetry is no longer kept'].filter(Boolean).join(' · ');
      const rowClasses = 'attempt' + (session.telemetryFile ? '' : ' faded-row') + (focused && focused.id === session.id ? ' focused' : '');
      html += '<div class="' + rowClasses + '" data-attempt="' + escapeHtml(session.id) + '"' +
        (explanation ? ' title="' + escapeHtml(explanation) + '"' : '') + '><input type="checkbox" class="checkbox" data-select-session="' + escapeHtml(session.id) + '"' +
        (selected.has(session.id) ? ' checked' : '') + (session.telemetryFile ? '' : ' disabled') + ' id="select-' + escapeHtml(session.id) + '">' +
        '<span class="attempt-date">' + escapeHtml((session.date || session.id).slice(5, 16)) + '</span>' +
        '<span class="attempt-total numeric' + (isBestSession ? ' best' : '') + '">' + (session.total ? formatTime(session.total) + (session.totalCalculated ? '*' : '') : '—') + '</span>';
      if (event.plannedLaps > 1) {
        html += '<span class="attempt-laps numeric">';
        for (let lapIndex = 0; lapIndex < event.plannedLaps; lapIndex++) {
          const lap = (session.laps || [])[lapIndex];
          html += '<span' + (lap && event.bestLap && event.bestLap.lap === lap ? ' class="best"' : '') + '>' + (lap ? formatTime(lap.time) + (lap.incident ? '<span class="tag failure">!</span>' : '') : '—') + '</span>';
        }
        html += '</span>';
      }
      html += '</div>';
    }
    return html + '</div><div class="note">* Total worked out by adding up the official laps. ! = lap with an incident (crash or reset). Greyed out: no telemetry.</div></section>';
  }
  // Datos del intento elegido, sobre las pestañas: fecha, total, objetivo, resultado y etiquetas
  function focusInfoHtml(event) {
    const session = focusedSession(event);
    if (!session) return '';
    const isBestSession = event.bestSession === session, hasBestLap = event.bestLap && event.bestLap.session === session;
    return '<b class="numeric">' + escapeHtml((session.date || session.id).slice(0, 16)) + '</b>' +
      '<span class="numeric' + (isBestSession ? ' best' : '') + '">' + (session.total ? formatTime(session.total) + (session.totalCalculated ? '*' : '') : '—') + '</span>' +
      (session.total && session.target ? '<span class="muted">target</span><span class="numeric ' + (session.total <= session.target ? 'gain' : 'loss') + '">' + formatSigned(session.total - session.target) + '</span>' : '') +
      '<div class="focus-tags">' + (isBestSession ? '<span class="tag highlight">record</span>' : '') + (hasBestLap ? '<span class="tag highlight">best lap</span>' : '') +
      (session.success == null ? ''
        : (session.total > 0 && session.target > 0 && session.total <= session.target) ? '<span class="tag success">#1 beaten</span>'
        : session.success ? '<span class="tag">passed</span>' : '<span class="tag failure">not passed</span>') + '</div>';
  }
  // Pulsar un intento lo elige: la columna del centro y el mapa pasan a mostrar sus datos (en modo simple se suma a los cargados)
  function focusAttempt(event, sessionId) {
    const session = event.sessions.find(item => item.id === sessionId);
    if (!session || !session.telemetryFile) return;
    focusedSessionByEvent[event.id] = session.id;
    const selection = selectedSessions(event);
    if (!isSimpleMode()) selection.clear();
    selection.add(session.id);
    state.pendingFocusSession = session.id;
    document.querySelectorAll('[data-attempt]').forEach(row => {
      row.classList.toggle('focused', row.dataset.attempt === session.id);
      const checkbox = row.querySelector('[data-select-session]');
      if (checkbox) checkbox.checked = selection.has(row.dataset.attempt);
    });
    byId('focusInfo').innerHTML = focusInfoHtml(event);
    loadAnalysis(event);
  }
  // Muestra una pestaña del centro y dibuja lo que necesita tamaño (las gráficas no se pueden dibujar ocultas)
  function showEventTab(name, remember) {
    const panes = [...document.querySelectorAll('[data-pane]')];
    if (!panes.some(pane => pane.dataset.pane === name)) name = 'laps';
    if (remember) { state.eventTab = name; writeStored('swgr.eventTab', name); }
    panes.forEach(pane => pane.classList.toggle('active', pane.dataset.pane === name));
    document.querySelectorAll('[data-tab]').forEach(button => button.setAttribute('aria-pressed', button.dataset.tab === name));
    const event = state.events.find(item => item.id === state.view.id);
    if (name === 'progress' && event) drawProgress(event);
    if (name === 'charts' && state.analysis && state.analysis.event === event) drawAll();
  }
  document.addEventListener('click', clickEvent => {
    const button = clickEvent.target.closest('[data-tab]');
    if (button) showEventTab(button.dataset.tab, true);
  });
  const tile = (label, value, detail) => '<div class="tile"><span class="label">' + label + '</span><span class="value">' + value + '</span><span class="detail">' + (detail || '&nbsp;') + '</span></div>';

  // Saves a game record typed in by hand, an event name or a preference, then reloads the data
  async function saveValue(kind, key, value) {
    try {
      await postJson('/api/save', { kind, key, value: String(value) });
      await refreshData(true);
      showToast('Saved');
    } catch (error) { showToast('Could not save: ' + error.message); }
  }

  // Attempts ticked for analysis (by default: the record, the one with the best lap and the latest one)
  const selectedSessionsByEvent = {};
  function selectedSessions(event) {
    if (!selectedSessionsByEvent[event.id]) {
      const selection = new Set();
      const withTelemetry = event.sessions.filter(session => session.telemetryFile);
      if (event.bestSession && event.bestSession.telemetryFile) selection.add(event.bestSession.id);
      if (event.bestLap && event.bestLap.session.telemetryFile) selection.add(event.bestLap.session.id);
      if (withTelemetry.length) selection.add(withTelemetry[withTelemetry.length - 1].id);
      // Attempts holding your best sectors, to build the ideal lap
      for (const best of event.bestSectors || []) if (best && best.session.telemetryFile) selection.add(best.session.id);
      selectedSessionsByEvent[event.id] = selection;
    }
    return selectedSessionsByEvent[event.id];
  }

  function drawProgress(event) {
    const canvas = byId('progressChart');
    const { context, width, height } = fitCanvas(canvas, 110);
    const points = event.completeSessions.map((session, index) => ({ index, value: session.total, session }));
    const referenceTimes = [event.targetSource && event.targetSource.target, event.gameBest.total].filter(Boolean);
    if (!points.length) {
      context.fillStyle = cssVariable('--text-muted'); context.font = '13px ' + cssVariable('--font-body');
      context.fillText('Your total time for each completed event will show here.', 60, 40); return;
    }
    const values = points.map(point => point.value).concat(referenceTimes);
    let lowest = Math.min(...values), highest = Math.max(...values);
    const padding = Math.max(0.5, (highest - lowest) * 0.12); lowest -= padding; highest += padding;
    const margin = { left: 70, right: 16, top: 12, bottom: 24 };
    const xOf = index => margin.left + (points.length === 1 ? 0.5 : index / (points.length - 1)) * (width - margin.left - margin.right);
    const yOf = value => margin.top + (highest - value) / (highest - lowest) * (height - margin.top - margin.bottom);
    const gridStep = niceStep(highest - lowest, 4);
    context.font = '11px ' + cssVariable('--font-data'); context.fillStyle = cssVariable('--text-muted'); context.strokeStyle = cssVariable('--line'); context.textAlign = 'right'; context.textBaseline = 'middle';
    for (let value = Math.ceil(lowest / gridStep) * gridStep; value <= highest; value += gridStep) {
      const y = Math.round(yOf(value)) + 0.5;
      context.beginPath(); context.moveTo(margin.left, y); context.lineTo(width - margin.right, y); context.stroke();
      context.fillText(formatTime(value), margin.left - 6, y);
    }
    const referenceLine = (value, color, label) => {
      if (!value) return;
      context.strokeStyle = color; context.setLineDash([5, 4]); context.lineWidth = 1.5;
      context.beginPath(); context.moveTo(margin.left, yOf(value)); context.lineTo(width - margin.right, yOf(value)); context.stroke(); context.setLineDash([]);
      context.fillStyle = color; context.textAlign = 'left'; context.fillText(label, margin.left + 6, yOf(value) - 9);
    };
    referenceLine(event.targetSource && event.targetSource.target, cssVariable('--warning'), 'target ' + formatTime(event.targetSource && event.targetSource.target));
    referenceLine(event.gameBest.total, cssVariable('--best'), 'game record');
    const accent = cssVariable('--accent');
    if (points.length > 1) {
      const gradient = context.createLinearGradient(0, margin.top, 0, height - margin.bottom);
      gradient.addColorStop(0, accent + '40'); gradient.addColorStop(1, accent + '00');
      context.fillStyle = gradient;
      context.beginPath(); context.moveTo(xOf(points[0].index), height - margin.bottom);
      points.forEach(point => context.lineTo(xOf(point.index), yOf(point.value)));
      context.lineTo(xOf(points[points.length - 1].index), height - margin.bottom); context.closePath(); context.fill();
    }
    context.save(); context.shadowColor = accent; context.shadowBlur = 10;
    context.strokeStyle = accent; context.lineWidth = 2.2;
    context.beginPath(); points.forEach((point, order) => { order ? context.lineTo(xOf(point.index), yOf(point.value)) : context.moveTo(xOf(point.index), yOf(point.value)); }); context.stroke();
    context.restore();
    points.forEach(point => {
      const isBestSession = point.session === event.bestSession;
      context.fillStyle = isBestSession ? cssVariable('--best') : accent; context.strokeStyle = cssVariable('--background'); context.lineWidth = 2;
      context.beginPath(); context.arc(xOf(point.index), yOf(point.value), isBestSession ? 6 : 4, 0, Math.PI * 2); context.fill(); context.stroke();
    });
    // Labels: your best recorded event and the latest one
    const pointLabel = (point, text, color) => {
      context.font = '600 11px ' + cssVariable('--font-data'); context.fillStyle = color; context.textBaseline = 'bottom';
      const x = xOf(point.index); context.textAlign = x > width - 120 ? 'right' : x < margin.left + 60 ? 'left' : 'center';
      context.fillText(text, x, yOf(point.value) - 9);
    };
    if (event.bestSession) { const bestPoint = points.find(point => point.session === event.bestSession); if (bestPoint) pointLabel(bestPoint, 'best ' + formatTime(bestPoint.value), cssVariable('--best')); }
    const lastPoint = points[points.length - 1];
    if (lastPoint && lastPoint.session !== event.bestSession) pointLabel(lastPoint, 'last ' + formatTime(lastPoint.value), cssVariable('--text'));
    context.fillStyle = cssVariable('--text-muted'); context.textAlign = 'center'; context.textBaseline = 'top';
    context.fillText('completed attempts, oldest to newest →', (margin.left + width - margin.right) / 2, height - margin.bottom + 6);
  }

  // ---------- Lap analysis (map, difference, speed) ----------
  async function fetchText(path) {
    if (state.fileCache[path]) return state.fileCache[path];
    const text = await (await fetchFromApp('/api/file?path=' + encodeURIComponent(path))).text();
    state.fileCache[path] = text;
    return text;
  }

  // Arranque lanzado: el total y la vuelta oficial de la carrera, para que el análisis empiece en el GO
  // (core.js ya marca las vueltas de esos eventos, también las de antes del cambio)
  function rollingOf(session) {
    const lap = (session.laps || [])[0];
    return lap && lap.rolling && lap.officialLap ? { total: session.total || lap.time, officialLap: lap.officialLap } : null;
  }

  async function loadAnalysis(event) {
    const selection = selectedSessions(event);
    const chosen = event.sessions.filter(session => selection.has(session.id) && session.telemetryFile);
    const loadToken = Symbol();
    state.analysisLoadToken = loadToken;
    byId('readout').textContent = chosen.length ? 'Loading telemetry…' : 'Tick an attempt in the list to analyse its laps.';
    if (!chosen.length) { state.analysis = null; drawAll(); byId('lapTable').innerHTML = ''; return; }
    try {
      const route = parseRouteCsv(await fetchText(chosen[chosen.length - 1].routeFile));
      const loaded = [];
      for (const session of chosen) loaded.push({ label: (session.date || session.id).slice(5, 16), samples: parseSessionCsv(await fetchText(session.telemetryFile), vehicleTypeOfEvent(session.event)), session });
      if (state.analysisLoadToken !== loadToken) return;
      const routeLength = route.points[route.points.length - 1][0];
      const analysis = { route, routeLength, lapLength: routeLength, laps: [], track: null, event };
      for (const item of loaded) {
        const result = analyzeSession(route, item.samples, item.label, rollingOf(item.session));
        if (!analysis.track || result.finishCheckpoint !== null) analysis.track = result;
        result.laps.forEach(lap => {
          lap.sessionLabel = item.label; lap.sessionId = item.session.id;
          // The game's official time (the one in the summary); the one measured in the telemetry can differ by a few tenths
          const official = (item.session.laps || []).find(summaryLap => summaryLap.number === lap.number);
          if (official && official.official && Math.abs(official.time - lap.time) < 1.5) lap.officialTime = official.time;
          analysis.laps.push(lap);
        });
      }
      // On a point-to-point stage the charts go from the start to the finish
      if (analysis.track && analysis.track.isPointToPoint) analysis.lapLength = analysis.track.span;
      const previousA = state.analysis && state.analysis.lapA;
      const sameLap = previous => previous && analysis.laps.find(lap => lap.sessionLabel === previous.sessionLabel && lap.number === previous.number);
      const cleanLaps = analysis.laps.filter(lap => !lap.incident).sort((first, second) => officialLapTime(first) - officialLapTime(second));   // by the game's official time
      analysis.idealLap = buildIdealLap(analysis);
      analysis.idealStartLap = buildIdealLap(analysis, true);
      analysis.idealRace = buildIdealRace(analysis);
      analysis.friendLaps = friendLaps(event, analysis);
      analysis.friendRaces = friendRaces(event, analysis);
      analysis.friendStarts = friendStarts(event, analysis);
      analysis.lapA = sameLap(previousA) || bestOwnLap(analysis, event) || cleanLaps[0] || analysis.laps[0];
      analysis.lapB = null;
      // A es el intento elegido en la lista y B el rival por defecto (el amigo más rápido o tu mejor carrera)
      fitComparison(analysis);
      if (isSimpleMode()) state.simpleRival = analysis.lapB ? lapValue(analysis, analysis.lapB) : '';
      state.pendingFocusSession = null;
      prepareMap(analysis);
      state.analysis = analysis;
      renderLapTable(); drawAll();
      byId('readout').textContent = 'Hover over the charts to see each point on the map.';
    } catch (error) {
      // A file that is no longer where the data said (the app moves the first race of a new circuit into
      // its folder, and compresses long sessions): the data is read again, which loads the analysis again
      if (state.analysisLoadToken !== loadToken) return;
      if (!state.analysisRetriedAt || performance.now() - state.analysisRetriedAt > 15000) {
        state.analysisRetriedAt = performance.now(); state.fileCache = {};
        await refreshData();
        return;
      }
      byId('readout').textContent = 'Could not load the telemetry: ' + error.message;
      showToast('Could not load the telemetry of your attempts. Close and reopen the app; if it keeps happening, keep log.txt and the tracks folder so it can be checked.');
    }
  }

  // Ideal lap: joins the stretch of each best sector (among the loaded attempts), with its trace and
  // its time, to use it as a reference.
  // startLap: the ideal lap 1 of an event of several laps (your best start S1, the rest your best sectors);
  // if not, the ideal flying lap (the start S1 does not count, it is slower).
  // Laps with an incident, or a sector whose trace does not match its time, are left out: their line would jump.
  function buildIdealLap(analysis, startLap) {
    if (!analysis.track) return null;
    const sectorCount = analysis.track.sectorCount;
    const bounds = [0].concat(analysis.track.sectorStarts).concat([analysis.lapLength]);
    const bestSectors = Array(sectorCount).fill(null);
    const severalLaps = analysis.event && analysis.event.plannedLaps > 1;
    if (startLap && !severalLaps) return null;
    for (const lap of analysis.laps) {
      if (!lap.sectors || lap.sectors.length !== sectorCount || lap.incident) continue;
      lap.sectors.forEach((value, sectorIndex) => {
        if (severalLaps && (startLap ? lap.number !== 1 : lap.number === 1)) return;   // laps 1 only in the ideal lap 1, and never in the flying one
        const measured = +(lap.measuredSectors || [])[sectorIndex];
        if (measured > 0 && Math.abs(measured - value) > 0.3) return;
        if (!bestSectors[sectorIndex] || value < bestSectors[sectorIndex].value) bestSectors[sectorIndex] = { value, lap };
      });
    }
    if (bestSectors.some(best => !best)) return null;
    // Each sector keeps its own trace, with its times stretched to its official time: no jumps in time where they join
    const trace = [];
    let elapsed = 0;
    bestSectors.forEach((best, sectorIndex) => {
      const timeByDistance = timeAtDistance(best.lap);
      const startTime = interpolate(timeByDistance.distances, timeByDistance.times, bounds[sectorIndex]);
      const endTime = interpolate(timeByDistance.distances, timeByDistance.times, bounds[sectorIndex + 1]);
      const stretch = endTime > startTime ? best.value / (endTime - startTime) : 1;
      for (const point of best.lap.trace) {
        if (point.distance < bounds[sectorIndex] || point.distance > bounds[sectorIndex + 1]) continue;
        trace.push({ distance: point.distance, time: elapsed + (interpolate(timeByDistance.distances, timeByDistance.times, point.distance) - startTime) * stretch,
          x: point.x, y: point.y, speed: point.speed });
      }
      elapsed += best.value;
    });
    trace.sort((first, second) => first.distance - second.distance);
    // Where two sectors of different laps join, the two racing lines (and speeds) are blended over 30 m
    const BLEND = 1500;
    for (const point of trace) {
      for (let boundary = 1; boundary < sectorCount; boundary++) {
        const before = bestSectors[boundary - 1].lap, after = bestSectors[boundary].lap, middle = bounds[boundary];
        if (before === after || Math.abs(point.distance - middle) >= BLEND) continue;
        let share = (point.distance - (middle - BLEND)) / (2 * BLEND); share = share * share * (3 - 2 * share);
        const pointBefore = lapPointAtDistance(before, point.distance), pointAfter = lapPointAtDistance(after, point.distance);
        point.x = pointBefore.x + (pointAfter.x - pointBefore.x) * share; point.y = pointBefore.y + (pointAfter.y - pointBefore.y) * share;
        point.speed = pointBefore.speed + (pointAfter.speed - pointBefore.speed) * share;
      }
    }
    return { isIdeal: true, sessionLabel: startLap ? 'Ideal lap 1' : 'Ideal lap', number: startLap ? 1 : '', time: elapsed, sectors: bestSectors.map(best => best.value), measuredSectors: bestSectors.map(best => best.value),
      sourceLaps: bestSectors.map(best => best.lap.sessionLabel + ' V' + best.lap.number), trace, incident: false };
  }
  // The ideal race: your ideal lap 1 (with your best start) and then the ideal lap on every other lap
  // Con vueltas de verdad (de los intentos cargados): tu mejor vuelta 1 y tus mejores vueltas lanzadas,
  // una distinta para cada vuelta que queda (si no hay bastantes, se repite la mejor)
  function buildIdealRace(analysis) {
    const plannedLaps = analysis.event && analysis.event.plannedLaps;
    if (!(plannedLaps > 1)) return null;
    const cleanLaps = analysis.laps.filter(lap => !lap.incident && lap.official).sort((first, second) => officialLapTime(first) - officialLapTime(second));
    const startLap = cleanLaps.find(lap => lap.number === 1);
    const flyingLaps = cleanLaps.filter(lap => lap.number !== 1);
    if (!startLap || !flyingLaps.length) return null;
    const race = { laps: [] };
    race.laps.push(Object.assign({}, startLap, { number: 1, time: officialLapTime(startLap), idealRace: race, sessionLabel: 'Ideal race' }));
    for (let lapNumber = 2; lapNumber <= plannedLaps; lapNumber++) {
      const lap = flyingLaps[Math.min(lapNumber - 2, flyingLaps.length - 1)];
      race.laps.push(Object.assign({}, lap, { number: lapNumber, time: officialLapTime(lap), idealRace: race, sessionLabel: 'Ideal race' }));
    }
    race.total = race.laps.reduce((sum, lap) => sum + lap.time, 0);
    return race;
  }

  // Simple mode compares your best lap with one rival: a friend, the ideal lap or the best lap of another attempt of yours
  function simpleRivals(analysis) {
    return comparisonCandidates(analysis).filter(item => item.lap && item.lap !== analysis.lapA).map(item => ({ value: item.value, label: item.label, detail: item.detail || item.label, lap: item.lap }));
  }
  function useSimpleComparison(analysis) {
    const chosen = simpleRivals(analysis).find(rival => rival.value === state.simpleRival);
    if (chosen) analysis.lapB = chosen.lap;
    state.replay.segment = null;
  }
  function fillSimpleRivalPicker() {
    const picker = byId('simpleRival'), analysis = state.analysis;
    if (!picker || !analysis) return;
    const rivals = simpleRivals(analysis), selected = analysis.lapB ? lapValue(analysis, analysis.lapB) : '';
    picker.innerHTML = rivals.length ? rivals.map(rival => '<option value="' + escapeHtml(rival.value) + '"' + (rival.value === selected ? ' selected' : '') + ' title="' + escapeHtml(rival.detail) + '">' + escapeHtml(rival.label) + '</option>').join('')
      : '<option value="">' + (comparisonKind() === 'race' ? 'Race another whole race or add a friend\'s file' : 'Race again to have someone to compare with') + '</option>';
  }
  document.addEventListener('change', changeEvent => {
    if (changeEvent.target.id !== 'simpleRival' || !state.analysis || !changeEvent.target.value) return;
    state.simpleRival = changeEvent.target.value;
    useSimpleComparison(state.analysis);
    renderLapTable(); drawAll();
  });

  // Values of the lap pickers and of the table rows: "lap:<index>", "friend:<index>", "ideal", "race:<session id>"
  // "friendrace:<index>:<lap index>" is a lap of a friend's best race (the first lap stands for the whole race)
  const lapValue = (analysis, lap) => lap.isFriendStart ? 'friendstart:' + analysis.friendStarts.indexOf(lap) : lap.idealRace ? 'idealrace' : lap === analysis.idealStartLap ? 'idealstart' : lap === analysis.idealLap ? 'ideal' : lap.friendRace ? 'friendrace:' + analysis.friendRaces.indexOf(lap.friendRace) + ':' + lap.friendRace.laps.indexOf(lap)
    : lap.isFriend ? 'friend:' + analysis.friendLaps.indexOf(lap) : 'lap:' + analysis.laps.indexOf(lap);
  function lapFromValue(analysis, value) {
    if (value === 'ideal') return analysis.idealLap;
    if (value === 'idealrace') return analysis.idealRace ? analysis.idealRace.laps[0] : null;
    if (value === 'idealstart') return analysis.idealStartLap || null;
    if (value.startsWith('friendstart:')) return (analysis.friendStarts || [])[+value.slice(12)] || null;
    if (!value) return null;
    const [kind, index, lapIndex] = value.split(':');
    if (kind === 'friendrace') { const race = (analysis.friendRaces || [])[+index]; return race ? race.laps[+lapIndex || 0] || null : null; }
    return kind === 'friend' ? analysis.friendLaps[+index] : kind === 'lap' ? analysis.laps[+index] : null;
  }
  function renderLapTable() {
    if (state.replay) { stopReplay(true); if (byId('replayGap')) byId('replayGap').textContent = ''; }
    const analysis = state.analysis, event = analysis.event;
    const sectorCount = analysis.track ? analysis.track.sectorCount : 1;
    const selectionClasses = lap => (lap === analysis.lapA ? ' selected-a' : '') + (lap === analysis.lapB ? ' selected-b' : '');
    let html = '<thead><tr><th>Lap</th><th>Time</th>';
    for (let sectorNumber = 1; sectorNumber <= sectorCount; sectorNumber++) html += '<th>S' + sectorNumber + '</th>';
    html += '<th></th></tr></thead><tbody>';
    if (analysis.idealLap) {
      const lap = analysis.idealLap;
      html += '<tr class="clickable ideal-row' + selectionClasses(lap) + '" data-lap="ideal"><td class="text"><b class="best">Ideal lap</b> <span class="muted" title="' + escapeHtml(lap.sourceLaps.join(' · ')) + '">best sectors</span></td>' +
        '<td class="best">' + formatTime(lap.time) + '</td>' + lap.sectors.map((value, sectorIndex) => '<td class="best" title="' + escapeHtml(lap.sourceLaps[sectorIndex]) + '">' + value.toFixed(3) + '</td>').join('') +
        '<td><button class="button small" data-reference="ideal">B</button></td></tr>';
    }
    (analysis.friendLaps || []).forEach(lap => {
      const value = lapValue(analysis, lap);
      html += '<tr class="clickable friend-row' + selectionClasses(lap) + '" data-lap="' + value + '"><td class="text"><b>' + escapeHtml(lap.pilot) + '</b> <span class="muted">their best lap</span></td>' +
        '<td>' + formatTime(officialLapTime(lap)) + '</td>';
      for (let sectorIndex = 0; sectorIndex < sectorCount; sectorIndex++) { const sector = (lap.sectors || [])[sectorIndex]; html += '<td>' + (sector > 0 ? (+sector).toFixed(3) : '—') + '</td>'; }
      html += '<td><button class="button small" data-reference="' + value + '">B</button></td></tr>';
    });
    // Laps grouped by attempt; open are the ones holding A, the reference or your best lap
    state.openLapGroups = state.openLapGroups || {};
    const groups = [];
    analysis.laps.forEach(lap => {
      let group = groups[groups.length - 1];
      if (!group || group.label !== lap.sessionLabel) { group = { label: lap.sessionLabel, laps: [] }; groups.push(group); }
      group.laps.push(lap);
    });
    groups.forEach((group, groupIndex) => {
      const key = event.id + '|' + group.label;
      const holdsSelection = group.laps.some(lap => lap === analysis.lapA || lap === analysis.lapB || (event.bestLap && Math.abs(officialLapTime(lap) - event.bestLap.lap.time) < 0.01));
      const open = state.openLapGroups[key] ?? holdsSelection;
      const fastest = group.laps.reduce((best, lap) => (!best || officialLapTime(lap) < officialLapTime(best) ? lap : best), null);
      html += '<tr class="group-row' + (open ? ' open' : '') + '" data-group="' + groupIndex + '" data-group-key="' + escapeHtml(key) + '"><td class="text" colspan="' + (sectorCount + 3) + '"><span class="chevron" aria-hidden="true">▸</span><b>' + escapeHtml(group.label) + '</b>' +
        '<span class="muted"> · ' + group.laps.length + (group.laps.length === 1 ? ' lap' : ' laps') + ' · best <span class="numeric">' + formatTime(officialLapTime(fastest)) + '</span></span></td></tr>';
      group.laps.forEach(lap => {
        const value = lapValue(analysis, lap);
        const isStartLap = event.plannedLaps > 1 && lap.number === 1;
        html += '<tr class="clickable lap-row' + selectionClasses(lap) + '" data-lap="' + value + '" data-in-group="' + groupIndex + '"' + (open ? '' : ' hidden') + '><td class="text">V' + lap.number +
          (isStartLap ? '<span class="tag" title="Start lap: its S1 is only compared with other starts">start</span>' : '') + (lap.incident ? '<span class="tag failure">incident</span>' : '') + '</td>';
        html += '<td class="' + (event.bestLap && Math.abs(officialLapTime(lap) - event.bestLap.lap.time) < 0.01 ? 'best' : '') + '">' + formatTime(officialLapTime(lap)) + '</td>';
        const sectors = lap.sectors || lap.measuredSectors;
        for (let sectorIndex = 0; sectorIndex < sectorCount; sectorIndex++) {
          const sector = sectors[sectorIndex];
          const best = isStartLap && sectorIndex === 0 ? event.bestStartSector : event.bestSectors[sectorIndex];
          const isBestSector = lap.sectors && best && sector != null && Math.abs(sector - best.value) < 0.01;
          html += '<td class="' + (isBestSector ? 'best' : '') + '">' + (sector != null ? sector.toFixed(3) : '—') + '</td>';
        }
        html += '<td><button class="button small" data-reference="' + value + '">B</button></td></tr>';
      });
    });
    byId('lapTable').innerHTML = html + '</tbody>';
    fillComparisonPickers(); fillSimpleRivalPicker(); fillReplayScopes(); renderSectorComparison();
    updateVersusBar();
    byId('lapTable').onclick = clickEvent => {
      const groupRow = clickEvent.target.closest('tr.group-row');
      if (groupRow) {
        const open = !groupRow.classList.contains('open');
        groupRow.classList.toggle('open', open); state.openLapGroups[groupRow.dataset.groupKey] = open;
        byId('lapTable').querySelectorAll('tr[data-in-group="' + groupRow.dataset.group + '"]').forEach(row => { row.hidden = !open; });
        return;
      }
      const referenceButton = clickEvent.target.closest('[data-reference]');
      // The table holds laps: picking one there compares laps (or the sector being compared)
      const pickedRow = referenceButton || clickEvent.target.closest('tr[data-lap]');
      if (pickedRow) {
        const picked = lapFromValue(analysis, (referenceButton ? referenceButton.dataset.reference : pickedRow.dataset.lap));
        const pickedNumber = +picked.number, severalLaps = severalLapsEvent(analysis);
        // La vuelta ideal (mejores sectores) es una vuelta lanzada: se compara con tu vuelta lanzada más rápida de
        // ese intento, nunca con la salida ni con la carrera entera. La vuelta 1 ideal, con tu vuelta 1.
        const idealScope = () => {
          if (picked === analysis.idealStartLap) return 'start';
          if (/^L\d+$/.test(state.replay.scope) && state.replay.scope !== 'L1') return state.replay.scope;
          const session = selectedSessionId(analysis);
          const best = fastest(analysis.laps.filter(lap => isOwnLap(lap) && lap.sessionId === session && lap.number > 1));
          return best ? 'L' + best.number : 'L2';
        };
        const wantedKind = !severalLaps ? (comparisonKind() === 'sector' ? state.replay.scope : 'lap')
          : comparisonKind() === 'sector' ? state.replay.scope
          : picked.isIdeal ? idealScope()
          : pickedNumber >= 1 ? (pickedNumber === 1 ? 'start' : 'L' + pickedNumber) : comparisonKind() === 'race' ? 'start' : state.replay.scope;
        if (wantedKind !== state.replay.scope) {
          state.replay.scope = wantedKind; state.replay.segment = null;
          if (referenceButton) { analysis.lapB = picked; fitComparison(analysis); if (picked !== analysis.lapA) analysis.lapB = picked; }
          else { analysis.lapA = picked; fitComparison(analysis); analysis.lapA = picked; if (analysis.lapB === picked) analysis.lapB = null; }
          renderLapTable(); drawAll(); return;
        }
      }
      if (referenceButton) { const lap = lapFromValue(analysis, referenceButton.dataset.reference); if (lap !== analysis.lapA) analysis.lapB = lap; renderLapTable(); drawAll(); return; }
      const row = clickEvent.target.closest('tr[data-lap]');
      if (!row) return;
      const lap = lapFromValue(analysis, row.dataset.lap);
      if (lap === analysis.lapB) analysis.lapB = analysis.lapA;
      analysis.lapA = lap; renderLapTable(); drawAll();
    };
  }

  function fitCanvas(canvas, cssHeight) {
    const box = canvas.getBoundingClientRect();
    const pixelRatio = window.devicePixelRatio || 1;
    const width = Math.max(10, box.width), height = cssHeight || Math.max(10, box.height);
    if (cssHeight) canvas.style.height = cssHeight + 'px';
    canvas.width = Math.round(width * pixelRatio); canvas.height = Math.round(height * pixelRatio);
    const context = canvas.getContext('2d');
    context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
    return { context, width, height };

  // A round grid step (1, 2, 2.5 or 5 times a power of ten) giving about `divisions` lines over `span`

    for (const multiple of [1, 2, 2.5, 5, 10]) if (rawStep <= multiple * powerOfTen) return multiple * powerOfTen;
    return 10 * powerOfTen;
  }
  function prepareMap(analysis) {
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    const include = (x, y) => { minX = Math.min(minX, x); maxX = Math.max(maxX, x); minY = Math.min(minY, y); maxY = Math.max(maxY, y); };
    analysis.route.points.forEach(point => include(point[1], point[2]));
    analysis.laps.forEach(lap => lap.trace.forEach(point => include(point.x, point.y)));
    analysis.bounds = { minX, maxX, minY, maxY };
  }
  // Position on the route's spline at a distance along it
  function routePointAt(analysis, routeDistance) {
    const points = analysis.route.points, length = analysis.routeLength;
    routeDistance = ((routeDistance % length) + length) % length;
    let low = 0, high = points.length - 1;
    while (high - low > 1) { const middle = (low + high) >> 1; if (points[middle][0] <= routeDistance) low = middle; else high = middle; }
    const fraction = (routeDistance - points[low][0]) / (points[high][0] - points[low][0] || 1);
    return [points[low][1] + fraction * (points[high][1] - points[low][1]), points[low][2] + fraction * (points[high][2] - points[low][2])];
  }
  // A lap distance (from the finish line, or from the start of a point-to-point stage) as a distance along the route's spline
  function lapDistanceToRouteDistance(analysis, lapDistance) {
    const length = analysis.routeLength, origin = analysis.track.isPointToPoint ? analysis.track.originDistance : analysis.track.finishDistance;
    const distanceDriven = ((origin + lapDistance) % length + length) % length;
    return analysis.track.direction === 1 ? distanceDriven : length - distanceDriven;
  }
  function lapPointAtDistance(lap, distance) {
    const trace = lap.trace;
    if (distance <= trace[0].distance) return trace[0];
    const index = trace.findIndex(point => point.distance >= distance);
    if (index <= 0) return trace[trace.length - 1];
    const before = trace[index - 1], after = trace[index], fraction = (distance - before.distance) / ((after.distance - before.distance) || 1);
    return { x: before.x + fraction * (after.x - before.x), y: before.y + fraction * (after.y - before.y), speed: before.speed + fraction * (after.speed - before.speed) };
  }
  // Position of a lap at the instant `time` (seconds since its start)
  function lapPointAtTime(lap, time) {
    if (!lap.timeOrderedTrace) {
      const points = []; let lastTime = -Infinity;
      for (const point of lap.trace) if (point.time > lastTime) { points.push(point); lastTime = point.time; }
      lap.timeOrderedTrace = points;
    }
    const trace = lap.timeOrderedTrace;
    if (time <= trace[0].time) return trace[0];
    if (time >= trace[trace.length - 1].time) return trace[trace.length - 1];
    let low = 0, high = trace.length - 1;
    while (high - low > 1) { const middle = (low + high) >> 1; if (trace[middle].time <= time) low = middle; else high = middle; }
    const before = trace[low], after = trace[high], fraction = (time - before.time) / ((after.time - before.time) || 1);
    return { distance: before.distance + fraction * (after.distance - before.distance), x: before.x + fraction * (after.x - before.x), y: before.y + fraction * (after.y - before.y),

  }
  // Replay: a sector, the lap or the whole race; in real time or with both cars at the same point
  state.replay = { time: null, playing: false, lastFrame: 0, animationFrame: 0, scope: 'lap', sync: 'realTime', followCar: false, segment: null };
  const referenceName = lap => !lap ? 'B' : lap.isIdeal ? 'ideal' : lap.isFriend ? lap.pilot : 'B';
  function sectorBounds(analysis) { return analysis.track ? [0].concat(analysis.track.sectorStarts).concat([analysis.lapLength]) : [0, analysis.lapLength]; }

  function sliceLap(lap, startDistance, endDistance) {

  // All the laps of an attempt, in order

        : '<span><b>The app is out of date.</b> Your mod is v' + escapeHtml(data.modVersion) + ' and this app (v' + escapeHtml(data.version) + ') goes with v' + escapeHtml(data.expectedModVersion) +
          ': use the GalacticRacerTelemetry.exe from the same package as the mod.</span>');
    }
    // safe_mode.txt: one line per part turned off: part \t blocked|session \t reason \t detail
    const turnedOff = String(data.safeMode || '').split('\n').map(line => line.split('\t')).filter(columns => columns[0]);
    if (turnedOff.length) notices.push('<span><b>Mod safe mode.</b> ' + turnedOff.map(([part, scope, reason, detail]) => 'Turned off ' + escapeHtml(SAFE_MODE_PARTS[part] || part) +
      (scope === 'session' || scope === 'sesion' ? ' in your last session' : '') + ' because ' + escapeHtml(reason || 'something failed') + (detail ? ' (' + escapeHtml(detail) + ')' : '') + '.').join(' ') +
      ' Everything else keeps working.</span><button type="button" class="button small" id="safeModeRetry">Try again</button>');
    const seenVersion = preference('seen_changes_version');
    if (data.version && seenVersion !== data.version && state.view.name !== 'options')
      notices.push('<span><b>What\'s new in ' + escapeHtml(data.version) + ':</b> ' + escapeHtml(CHANGELOG[0].items.slice(0, 3).map(item => item.replace(/:.*/, '')).join(' · ')) + '…</span>' +
        '<button type="button" class="button small" data-navigate="about">See what\'s new</button><button type="button" class="button small" id="changesSeen">Got it</button>');
    byId('notices').innerHTML = notices.map(notice => '<div class="notice">' + notice + '</div>').join('');
    if (byId('changesSeen')) byId('changesSeen').onclick = () => { savePreference('seen_changes_version', data.version); renderNotices(); };
    if (byId('safeModeRetry')) byId('safeModeRetry').onclick = async () => {
      try { await fetchFromApp('/api/retry-safe-mode', { method: 'POST' }); showToast('Done: the mod will try again next time you open the game'); await refreshData(); }
      catch (error) { showToast('Could not do it: ' + error.message); }
    };
  }

  // Sección «Acerca de» de la página de Opciones: versiones, novedades, créditos y aviso
  // Novedades: la versión actual a la vista; todas las demás, plegadas dentro de «Versiones anteriores»
  function changelogEntry(entry, open) {
    const title = entry.version === 'Before' ? 'First versions' : /^\d/.test(entry.version) ? 'Version ' + escapeHtml(entry.version) + ' <span class="muted">app and mod</span>' : 'Before: ' + escapeHtml(entry.version);
    return '<details' + (open ? ' open' : '') + '><summary>' + title + '</summary><ul>' +
      entry.items.map(item => '<li>' + escapeHtml(item) + '</li>').join('') + '</ul></details>';
  }
  function changelogHtml() {
    const [current, ...older] = CHANGELOG;
    return (current ? changelogEntry(current, false) : '') +
      (older.length ? '<details class="older-versions"><summary>Versiones anteriores</summary>' + older.map(entry => changelogEntry(entry, false)).join('') + '</details>' : '');
  }

  // Lee el archivo y prepara los controles
  async function loadRacePanel() {
    if (!byId('racePanelScreen')) return;
    try { state.racePanel = (await (await fetchFromApp('/api/timing-panel')).json()).values || {}; } catch (error) { state.racePanel = {}; }
    wireRacePanel();
    drawRacePanel();
  }
  // Guarda unos cambios (y los aplica ya a la muestra)
  function saveRacePanel(changes) {
    Object.assign(state.racePanel, changes);
    drawRacePanel();
    clearTimeout(state.racePanelSaveTimer);
    state.racePanelSaveTimer = setTimeout(async () => {
      const pending = state.racePanelPending || {}; state.racePanelPending = {};
      try {
        const response = await postJson('/api/timing-panel', { values: pending });
        if (!response.ok) throw new Error(await response.text());
        if (!state.racePanelSavedNotice) { state.racePanelSavedNotice = true; showToast('Panel saved: it applies from the next race'); }
      } catch (error) { showToast('Could not save the panel: ' + error.message); }
    }, 350);
    state.racePanelPending = Object.assign(state.racePanelPending || {}, changes);
  }

  function wireRacePanel() {
    document.querySelectorAll('[data-race-panel-place]').forEach(button => button.addEventListener('click', () => {
      const [x, y] = button.dataset.racePanelPlace.split(',');
      saveRacePanel({ x, y });
    }));
    document.querySelectorAll('[data-race-panel-key] button').forEach(button => button.addEventListener('click', () => {
      saveRacePanel({ [button.parentElement.dataset.racePanelKey]: button.dataset.value });
    }));
    document.querySelectorAll('[data-race-panel-toggle]').forEach(button => button.addEventListener('click', () => {
      const key = button.dataset.racePanelToggle;

    }));
    document.querySelectorAll('[data-race-panel-palette]').forEach(button => button.addEventListener('click', () => {
      const palette = RACE_PANEL_PALETTES[button.dataset.racePanelPalette], changes = {};
      RACE_PANEL_COLORS.forEach(([key, , fileKey]) => { changes[fileKey] = palette[key]; });
      saveRacePanel(changes);
    }));
    document.querySelectorAll('[data-race-panel-color]').forEach(input => input.addEventListener('input', () => {
      const entry = RACE_PANEL_COLORS.find(item => item[0] === input.dataset.racePanelColor);
      saveRacePanel({ [entry[2]]: input.value });
    }));
    const slider = (id, key, digits) => byId(id).addEventListener('input', event => saveRacePanel({ [key]: (+event.target.value).toFixed(digits) }));
    slider('racePanelScale', 'scale', 2); slider('racePanelOpacity', 'opacity', 2);
    // Arrastrar el panel por la pantalla de muestra
    const preview = byId('racePanelPreview');
    preview.addEventListener('pointerdown', down => {
      const zoom = state.racePanelZoom || 1, layout = racePanelLayout(), scale = +racePanelValue('scale');
      const panelWidth = layout.width * scale, panelHeight = preview.offsetHeight * scale;
      const startLeft = preview.offsetLeft, startTop = preview.offsetTop;
      preview.setPointerCapture(down.pointerId);
      const move = event => {
        const left = Math.max(0, Math.min(RACE_PANEL_SCREEN.width - panelWidth, startLeft + (event.clientX - down.clientX) / zoom));
        const top = Math.max(0, Math.min(RACE_PANEL_SCREEN.height - panelHeight, startTop + (event.clientY - down.clientY) / zoom));
        state.racePanel.x = (left / Math.max(1, RACE_PANEL_SCREEN.width - panelWidth)).toFixed(3);
        state.racePanel.y = (top / Math.max(1, RACE_PANEL_SCREEN.height - panelHeight)).toFixed(3);
        drawRacePanel();
      };
      const up = () => {
        preview.removeEventListener('pointermove', move); preview.removeEventListener('pointerup', up);
        saveRacePanel({ x: state.racePanel.x, y: state.racePanel.y });
      };
      preview.addEventListener('pointermove', move); preview.addEventListener('pointerup', up);
    });
    if (!state.racePanelResizeWired) { state.racePanelResizeWired = true; window.addEventListener('resize', () => { if (byId('racePanelScreen')) drawRacePanel(); }); }
  }

  // La muestra: un panel parecido al del juego, con los colores, filas y medidas elegidos
  function drawRacePanel() {
    const screen = byId('racePanelScreen'), stage = byId('racePanelStage'), preview = byId('racePanelPreview');
    if (!screen || !state.racePanel) return;
    const layout = racePanelLayout(), compact = racePanelValue('style') === 'compact', color = racePanelColor;
    const [titleLabel, titleValue, labelSize, valueSize, differenceSize] = layout.fonts;
    const row = (label, value, difference, valueColor, differenceColor, sizes) => '<div class="race-panel-row" style="height:' + layout.rowHeight + 'px">' +
      '<span style="color:' + color('label') + ';font-size:' + (sizes ? sizes[0] : labelSize) + 'px">' + label + '</span>' +
      '<span style="color:' + (valueColor || color('text')) + ';font-size:' + (sizes ? sizes[1] : valueSize) + 'px">' + value + '</span>' +
      '<span style="color:' + (differenceColor || color('dim')) + ';font-size:' + differenceSize + 'px">' + (difference || '') + '</span></div>';
    let html = racePanelColor('topBar') !== 'none' ? '<div class="race-panel-top" style="background:' + color('topBar') + '"></div>' : '';
    html += row('<span style="color:' + color('title') + '">LAP 2</span>', '1:02.4', '', color('text'), null, [titleLabel, titleValue]);
    if (racePanelOn('live_difference')) html += row('DIF', '-0.214', '', color('gain'), null, [labelSize, titleValue + 4]);
    if (racePanelOn('sector_bars')) html += '<div class="race-panel-bars"><i style="background:' + color('best') + '"></i><i style="background:' + color('better') + '"></i><i style="background:' + color('dim') + '"></i></div>';
    html += row('S1', '11.204', '-0.120', color('best'), color('gain')) + row('S2', '17.512', '+0.084', color('worse'), color('loss')) + row('S3', '--', '', color('dim'));
    const bottom = [['last_lap', 'LAST', '1:02.9', '+0.230'], ['best_lap', 'BEST', '1:01.9', ''], ['ideal_lap', 'IDEAL', '1:01.2', '0.700'],
      ['speeds', 'SPEED', '612', '298'], ['event_total', 'TOTAL', '2:07.3', ''], ['forecast', 'FORECAST', '3:10.1', '-0.80'], ['target', 'TARGET', '3:11.0', '']];
    bottom.forEach(([key, label, value, difference]) => {
      if (!racePanelOn(key) || (key === 'last_lap' && compact)) return;
      const differenceColor = difference.startsWith('-') ? color('gain') : difference.startsWith('+') ? color('loss') : color('dim');
      html += row(label, value, difference, null, differenceColor);
    });
    preview.innerHTML = html;
    // Fondo con su opacidad (la del juego), tamaño y posición
    const background = color('background'), opacity = +racePanelValue('opacity');
    const channels = [1, 3, 5].map(index => parseInt(background.slice(index, index + 2), 16) || 0);
    Object.assign(preview.style, { width: layout.width + 'px', padding: '0 ' + layout.padding + 'px ' + layout.padding / 2 + 'px', background: 'rgba(' + channels.join(',') + ',' + opacity + ')' });
    RACE_PANEL_SCREEN.width = RACE_PANEL_WIDTHS[preference('panel_aspect')] || 3840;
    screen.style.aspectRatio = RACE_PANEL_SCREEN.width + ' / ' + RACE_PANEL_SCREEN.height;
    stage.style.width = RACE_PANEL_SCREEN.width + 'px';
    const scale = +racePanelValue('scale'), zoom = screen.clientWidth / RACE_PANEL_SCREEN.width;
    state.racePanelZoom = zoom;
    stage.style.transform = 'scale(' + zoom + ')';
    const panelWidth = layout.width * scale, panelHeight = preview.offsetHeight * scale;
    preview.style.transform = 'scale(' + scale + ')';
    preview.style.left = (+racePanelValue('x') * Math.max(0, RACE_PANEL_SCREEN.width - panelWidth)) + 'px';
    preview.style.top = (+racePanelValue('y') * Math.max(0, RACE_PANEL_SCREEN.height - panelHeight)) + 'px';
    // Los controles, con lo elegido
    byId('racePanelScale').value = scale; byId('racePanelScaleText').textContent = Math.round(scale * 100) + ' %';
    byId('racePanelOpacity').value = opacity; byId('racePanelOpacityText').textContent = Math.round(opacity * 100) + ' %';
    document.querySelectorAll('[data-race-panel-key]').forEach(group => group.querySelectorAll('button').forEach(button => {
      const current = group.dataset.racePanelKey === 'style' && racePanelValue('style') === 'current' ? 'sith' : racePanelValue(group.dataset.racePanelKey);
      button.setAttribute('aria-pressed', String(button.dataset.value === current));
    }));
    document.querySelectorAll('[data-race-panel-toggle]').forEach(button => {
      const key = button.dataset.racePanelToggle;
      button.setAttribute('aria-pressed', String(racePanelOn(key)));
      button.disabled = key === 'last_lap' && compact;
    });
    document.querySelectorAll('[data-race-panel-color]').forEach(input => {
      const value = color(input.dataset.racePanelColor);
      input.value = /^#[0-9a-f]{6}$/i.test(value) ? value : '#000000';
    });
    document.querySelectorAll('[data-race-panel-palette]').forEach(button => {
      const palette = RACE_PANEL_PALETTES[button.dataset.racePanelPalette];
      button.setAttribute('aria-pressed', String(RACE_PANEL_COLORS.every(([key]) => color(key).toLowerCase() === palette[key].toLowerCase())));
    });
  }
  // ---------- Pilots: .swgr files to compare yourself with your friends, without internet ----------
  // Pilot name: the profile's; if there is none, a default one that each person changes in their profile
  const DEFAULT_PILOT_NAME = 'Anakin Skywalker';
  const myPilotName = () => String(preference('pilot_name') || '').trim() || DEFAULT_PILOT_NAME;
  const roundToMilliseconds = seconds => (seconds > 0 ? Math.round(seconds * 1000) / 1000 : null);
  // Pilot files of version 1 (0.9.17 and earlier) had Spanish keys: they are read as version 2
  const OLD_VEHICLE_NAMES = { Vaina: 'podracer', Coche: 'car', Moto: 'bike', Rasante: 'skimmer', Otros: 'other' };
  function readPilotFile(file) {
    if (!file || typeof file !== 'object') return null;
    if (file.format === 'swgr-pilot') return file.events && typeof file.events === 'object' ? file : null;
    if (file.formato !== 'swgr-piloto' || !file.eventos || typeof file.eventos !== 'object') return null;
    const events = {};
    for (const [eventId, old] of Object.entries(file.eventos)) {
      if (!old || typeof old !== 'object') continue;
      const lap = old.vuelta && typeof old.vuelta === 'object' ? old.vuelta : null;
      events[eventId] = { name: old.nombre, planet: old.planeta, vehicle: OLD_VEHICLE_NAMES[old.vehiculo] || old.vehiculo, plannedLaps: old.vueltas, total: old.total,
        bestLap: old.mejorVuelta, sectors: old.sectores, startSector: old.salidaS1, idealLap: old.ideal, date: old.fecha,
        bestLapTelemetry: lap ? { number: lap.n, time: lap.t, sectors: lap.sec, length: lap.L, isPointToPoint: lap.abierto, trace: lap.tr } : null };
    }
    return { format: 'swgr-pilot', version: 2, pilot: file.piloto, color: file.color, date: file.fecha, app: file.app, events };
  }
  function friendPilots() {
    const myName = String(preference('pilot_name') || '').trim().toLowerCase();   // with the default name nobody is hidden
    return ((state.data && state.data.friends) || []).filter(friend => String(friend.pilot || '').trim() && (!myName || String(friend.pilot).trim().toLowerCase() !== myName));
  }
  // An event's standings: you and your friends, from the fastest to the slowest
  function standings(eventId, event) {
    const rows = [];
    const myGameRecord = gameRecordOf(state.data, eventId);
    if (event && (event.recordTime || event.bestLap)) rows.push({ isMe: true, pilot: myPilotName() || 'You', color: myPilotColor(), total: event.recordTime || null,
      bestLap: event.bestLap ? event.bestLap.lap.time : null, sectors: event.bestSectors.map(best => (best ? best.value : null)), hasLapTelemetry: true });
    else if (myGameRecord) rows.push({ isMe: true, pilot: myPilotName() || 'You', color: myPilotColor(), total: myGameRecord.total, bestLap: null, sectors: [], hasLapTelemetry: false });
    for (const friend of friendPilots()) {
      const result = friend.events[eventId];
      if (result && (result.total > 0 || result.bestLap > 0)) rows.push({ pilot: String(friend.pilot), color: friend.color, friend, total: result.total > 0 ? +result.total : null,
        bestLap: result.bestLap > 0 ? +result.bestLap : null, sectors: Array.isArray(result.sectors) ? result.sectors : [],
        hasLapTelemetry: !!(result.bestLapTelemetry && Array.isArray(result.bestLapTelemetry.trace)), hasRaceTelemetry: !!(result.bestRaceTelemetry && Array.isArray(result.bestRaceTelemetry.laps)) });
    }
    rows.sort((first, second) => (first.total || 1e9) - (second.total || 1e9) || (first.bestLap || 1e9) - (second.bestLap || 1e9));
    return rows;
  }
  function friendsChip(event) {
    if (!friendPilots().length) return '';
    const rows = standings(event.id, event);
    if (rows.length < 2) return '';
    const myPosition = rows.findIndex(row => row.isMe) + 1;
    return '<span class="event-friends"><span class="position' + (myPosition === 1 ? ' first' : '') + '">' + ordinal(myPosition) + '</span> of ' + rows.length + ' among friends</span> · ';
  }
  function friendsPanel(event, inTab) {
    const allRows = standings(event.id, event);
    if (allRows.length < 2) return '';
    const shownFriends = allRows.filter(row => !row.isMe).slice(0, 3);
    const rows = allRows.filter(row => row.isMe || shownFriends.includes(row));
    const hiddenCount = allRows.length - rows.length;
    const sectorCount = Math.max(event.sectorCount || 0, ...rows.map(row => row.sectors.length));
    const showBestLap = event.plannedLaps !== 1;
    const bestOfColumn = valueOf => { const values = rows.map(valueOf).filter(value => value > 0); return values.length ? Math.min(...values) : null; };
    const bestTotal = bestOfColumn(row => row.total), bestLapTime = bestOfColumn(row => row.bestLap);
    const bestSectors = Array.from({ length: sectorCount }, (_, sectorIndex) => bestOfColumn(row => row.sectors[sectorIndex]));
    const myRow = rows.find(row => row.isMe);
    const isBestValue = (value, best) => value > 0 && best != null && Math.abs(value - best) < 0.0005;
    let html = (inTab ? '<div class="friends-pane">' : '<section class="panel"><div class="panel-header"><h2>Against your friends</h2><span class="muted" title="everyone\'s best time in this event · highlighted: the best in each column">everyone\'s best time</span></div>') +
      '<div class="table-scroll"><table class="friends"><thead><tr><th>#</th><th>Pilot</th><th>' + (showBestLap ? 'Total' : 'Time') + '</th><th>Gap</th>' + (showBestLap ? '<th>Best lap</th>' : '') + '';
    for (let sectorNumber = 1; sectorNumber <= sectorCount; sectorNumber++) html += '<th>S' + sectorNumber + '</th>';
    html += '<th></th></tr></thead><tbody>';
    rows.forEach(row => {
      const difference = !row.isMe && myRow && myRow.total && row.total ? row.total - myRow.total : null;
      const position = allRows.indexOf(row);
      html += '<tr' + (row.isMe ? ' class="my-row"' : '') + '><td><span class="position' + (position === 0 && row.total ? ' first' : '') + '">' + (row.total ? position + 1 : '—') + '</span></td>' +
        '<td class="text">' + pilotDot(row.color) + '<b>' + escapeHtml(row.pilot) + '</b>' + (row.isMe ? ' <span class="tag">you</span>' : row.friend.date ? ' <span class="muted">· file from ' + escapeHtml(String(row.friend.date).slice(0, 10)) + '</span>' : '') + '</td>' +
        '<td class="' + (isBestValue(row.total, bestTotal) ? 'best' : '') + '">' + (row.total ? formatTime(row.total) : '—') + '</td>' +
        '<td>' + (difference == null ? '—' : '<span class="' + (difference < 0 ? 'loss' : 'gain') + '" title="' + (difference < 0 ? 'ahead of you by ' : 'you are ahead by ') + Math.abs(difference).toFixed(3) + ' s">' + formatSigned(difference) + '</span>') + '</td>' +
        (showBestLap ? '<td class="' + (isBestValue(row.bestLap, bestLapTime) ? 'best' : '') + '">' + (row.bestLap ? formatTime(row.bestLap) : '—') + '</td>' : '');
      for (let sectorIndex = 0; sectorIndex < sectorCount; sectorIndex++) {
        const sector = +row.sectors[sectorIndex], mySector = myRow && myRow.sectors[sectorIndex];
        html += '<td class="' + (isBestValue(sector, bestSectors[sectorIndex]) ? 'best' : '') + '"' + (!row.isMe && sector > 0 && mySector > 0 ? ' title="frente a ti: ' + formatSigned(sector - mySector) + ' s"' : '') + '>' + (sector > 0 ? sector.toFixed(3) : '—') + '</td>';
      }
      const compareButtons = (row.hasRaceTelemetry && showBestLap ? '<button type="button" class="button small" data-compare-friend-race="' + escapeHtml(row.pilot) + '">Compare race</button> ' : '') +
        (row.hasLapTelemetry ? '<button type="button" class="button small" data-compare-friend="' + escapeHtml(row.pilot) + '">Compare lap</button>' : '');
      html += '<td class="compare-cell">' + (row.isMe ? '' : compareButtons || '<span class="muted">time only</span>') + '</td></tr>';
    });
    html += '</tbody></table></div>' + (hiddenCount > 0 ? '<p class="more-friends muted">And ' + hiddenCount + (hiddenCount === 1 ? ' more friend' : ' more friends') + ': <a data-navigate="social" href="#">see them all in Social</a></p>' : '') +
      '<div class="note" title="' + '«Compare lap» puts their best lap against your real best lap. ' +
      (showBestLap ? '«Compare race» puts their best whole race against yours, lap by lap. ' : '') +
      'You will see it in the «A against B» bar, the map and the replay, and in the charts. ' +
      (showBestLap ? 'The sectors in this table are each pilot\'s best, not those of a single lap. ' : '') +
      '«Time only»: their file has the time but not the telemetry (records imported from the game, or a file from an older version). ' +
      'The time includes the record imported from the game; «Compare lap» uses the best lap recorded with the mod, which may be slower.' +
      '">The compare buttons take their lap or race to the map. Hover here for more detail.</div>' + (inTab ? '</div>' : '</section>');
    return html;
  }
  // Your friends' best laps of this event, as laps of the analysis (only if they are of the same course)
  const usableLapTelemetry = telemetry => telemetry && Array.isArray(telemetry.trace) && telemetry.trace.length >= 10 && telemetry.time > 0;
  // Another course or direction: the length of the lap does not match
  const otherCourse = (analysis, length) => analysis && analysis.lapLength && length && Math.abs(length - analysis.lapLength) / analysis.lapLength > 0.03;
  function lapFromFriendTelemetry(friend, telemetry, sessionLabel) {
    return { isFriend: true, pilot: String(friend.pilot), sessionLabel, number: telemetry.number || '', time: +telemetry.time,
      sectors: Array.isArray(telemetry.sectors) ? telemetry.sectors : null, measuredSectors: Array.isArray(telemetry.sectors) ? telemetry.sectors : [], incident: false, official: true,
      trace: telemetry.trace.filter(point => Array.isArray(point) && point.length >= 5).map(point => ({ distance: +point[0], time: +point[1], x: +point[2], y: +point[3], speed: +point[4], boost: BOOST_CODES[+point[5]] || '' })) };
  }
  function friendLaps(event, analysis) {
    const laps = [];
    for (const friend of friendPilots()) {
      const result = friend.events[event.id], telemetry = result && result.bestLapTelemetry;
      if (!usableLapTelemetry(telemetry) || otherCourse(analysis, telemetry.length)) continue;

  }
  // Your friends' best laps 1 (their start), from pilot files of 0.9.25 on
  function friendStarts(event, analysis) {

      if (!usableLapTelemetry(telemetry) || otherCourse(analysis, telemetry.length)) continue;
      const lap = lapFromFriendTelemetry(friend, telemetry, String(friend.pilot));
      lap.isFriendStart = true; lap.number = 1;

  // Your friends' best races (every lap of the attempt with their best total), from pilot files of 0.9.20 on
  function friendRaces(event, analysis) {

      const entry = { pilot: String(friend.pilot), laps: race.laps.map(telemetry => {

  // An attempt analysed for the export (kept while exporting, as the best lap and the best race are often the same attempt)
  async function analyzeForExport(session, cache) {
    if (!session || !session.telemetryFile || !session.routeFile) return null;
    if (!cache[session.id]) cache[session.id] = (async () => {

  // One point every 10 m: distance, time, x, y, speed, boost and (0.9.29) z, heading
  function traceForExport(lap) {

      if (point.distance - lastDistance >= 1000 || index === lap.trace.length - 1) {
        const exported = [Math.round(point.distance), Math.round(point.time * 1000) / 1000, Math.round(point.x), Math.round(point.y), Math.round(point.speed * 10) / 10, BOOST_CODES.indexOf(point.boost || '')];

  async function bestLapForExport(event, cache) {

    // The same lap (by number; its time measured in the telemetry can differ by a few tenths from the official one)
    const closest = result.laps.reduce((nearest, lap) => (!nearest || Math.abs(lap.time - bestLap.lap.time) < Math.abs(nearest.time - bestLap.lap.time) ? lap : nearest), null);
    const lap = result.laps.find(item => item.number === bestLap.lap.number && Math.abs(item.time - bestLap.lap.time) < 1) || (closest && Math.abs(closest.time - bestLap.lap.time) < 0.5 ? closest : null);

  // Your best race: every lap of the attempt with your best total (only on events of several laps)

  async function bestStartForExport(event, cache) {

      const lap = (session.laps || []).find(item => item.number === 1 && item.official && !item.incident);
      if (lap && (!best || lap.time < best.lap.time)) best = { session, lap };
    }
    if (!best) return null;
    const analysed = await analyzeForExport(best.session, cache);
    if (!analysed || analysed.result.isPointToPoint) return null;
    const lap = analysed.result.laps.find(item => item.number === 1);
    if (!lap || lap.trace.length < 10) return null;
    return { number: 1, time: roundToMilliseconds(lap.time), officialTime: roundToMilliseconds(best.lap.time), sectors: (lap.sectors || lap.measuredSectors || []).map(roundToMilliseconds),

  }
  async function bestRaceForExport(event, cache) {

    if (!analysed || analysed.result.isPointToPoint) return null;
